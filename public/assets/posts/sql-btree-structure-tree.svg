<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <defs>
    <marker id="arr-o" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#ce9178"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">B-Tree 인덱스 구조</text>
  <text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#888">루트 → 브랜치 → 리프 노드 · 리프는 힙(데이터) 포인터 보유</text>

  <!-- ROOT node -->
  <rect x="340" y="86" width="200" height="44" rx="6" fill="#1a1a2e" stroke="#7777cc" stroke-width="2"/>
  <text x="440" y="103" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="700" fill="#7777cc">ROOT</text>
  <text x="440" y="122" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">25 | 50 | 75</text>

  <!-- Branch nodes -->
  <rect x="120" y="170" width="150" height="44" rx="6" fill="#121220" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="195" y="187" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="700" fill="#7ec8e3">BRANCH</text>
  <text x="195" y="206" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e8e8e8">10 | 20</text>

  <rect x="365" y="170" width="150" height="44" rx="6" fill="#121220" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="187" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="700" fill="#7ec8e3">BRANCH</text>
  <text x="440" y="206" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e8e8e8">30 | 40</text>

  <rect x="610" y="170" width="150" height="44" rx="6" fill="#121220" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="685" y="187" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" font-weight="700" fill="#7ec8e3">BRANCH</text>
  <text x="685" y="206" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e8e8e8">60 | 70</text>

  <!-- Lines from root to branches -->
  <line x1="390" y1="130" x2="195" y2="170" stroke="#7777cc" stroke-width="1.5"/>
  <line x1="440" y1="130" x2="440" y2="170" stroke="#7777cc" stroke-width="1.5"/>
  <line x1="490" y1="130" x2="685" y2="170" stroke="#7777cc" stroke-width="1.5"/>

  <!-- Leaf nodes -->
  <rect x="60" y="264" width="105" height="60" rx="6" fill="#0f1a0f" stroke="#55c555" stroke-width="1.5"/>
  <text x="112" y="282" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" font-weight="700" fill="#55c555">LEAF</text>
  <text x="112" y="298" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#e8e8e8">1, 5, 8</text>
  <text x="112" y="314" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="9" fill="#888">→ 힙 포인터</text>

  <rect x="191" y="264" width="105" height="60" rx="6" fill="#0f1a0f" stroke="#55c555" stroke-width="1.5"/>
  <text x="243" y="282" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" font-weight="700" fill="#55c555">LEAF</text>
  <text x="243" y="298" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#e8e8e8">12, 15, 18</text>
  <text x="243" y="314" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="9" fill="#888">→ 힙 포인터</text>

  <rect x="322" y="264" width="105" height="60" rx="6" fill="#0f1a0f" stroke="#55c555" stroke-width="1.5"/>
  <text x="374" y="282" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" font-weight="700" fill="#55c555">LEAF</text>
  <text x="374" y="298" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#e8e8e8">26, 28, 29</text>
  <text x="374" y="314" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="9" fill="#888">→ 힙 포인터</text>

  <rect x="453" y="264" width="105" height="60" rx="6" fill="#0f1a0f" stroke="#55c555" stroke-width="1.5"/>
  <text x="505" y="282" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" font-weight="700" fill="#55c555">LEAF</text>
  <text x="505" y="298" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#e8e8e8">32, 35, 39</text>
  <text x="505" y="314" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="9" fill="#888">→ 힙 포인터</text>

  <rect x="584" y="264" width="105" height="60" rx="6" fill="#0f1a0f" stroke="#55c555" stroke-width="1.5"/>
  <text x="636" y="282" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" font-weight="700" fill="#55c555">LEAF</text>
  <text x="636" y="298" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#e8e8e8">52, 58</text>
  <text x="636" y="314" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="9" fill="#888">→ 힙 포인터</text>

  <rect x="715" y="264" width="105" height="60" rx="6" fill="#0f1a0f" stroke="#55c555" stroke-width="1.5"/>
  <text x="767" y="282" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" font-weight="700" fill="#55c555">LEAF</text>
  <text x="767" y="298" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#e8e8e8">62, 68, 72</text>
  <text x="767" y="314" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="9" fill="#888">→ 힙 포인터</text>

  <!-- Lines from branches to leaves -->
  <line x1="160" y1="214" x2="112" y2="264" stroke="#7ec8e3" stroke-width="1"/>
  <line x1="195" y1="214" x2="243" y2="264" stroke="#7ec8e3" stroke-width="1"/>
  <line x1="395" y1="214" x2="374" y2="264" stroke="#7ec8e3" stroke-width="1"/>
  <line x1="440" y1="214" x2="505" y2="264" stroke="#7ec8e3" stroke-width="1"/>
  <line x1="635" y1="214" x2="636" y2="264" stroke="#7ec8e3" stroke-width="1"/>
  <line x1="685" y1="214" x2="767" y2="264" stroke="#7ec8e3" stroke-width="1"/>

  <!-- Leaf linked list arrows -->
  <line x1="165" y1="294" x2="191" y2="294" stroke="#ce9178" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <line x1="296" y1="294" x2="322" y2="294" stroke="#ce9178" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <line x1="427" y1="294" x2="453" y2="294" stroke="#ce9178" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <line x1="558" y1="294" x2="584" y2="294" stroke="#ce9178" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <line x1="689" y1="294" x2="715" y2="294" stroke="#ce9178" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <!-- Legend -->
  <rect x="60" y="350" width="760" height="32" rx="6" fill="#111" stroke="#3a4a6e"/>
  <text x="100" y="371" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#ce9178">━━▶ 리프 노드 연결 리스트</text>
  <text x="310" y="371" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">(범위 스캔 시 → 다음 리프로 이동)</text>
  <text x="600" y="371" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">높이(Height) = 3 → 탐색 I/O = 3회</text>

  <!-- Height indicator -->
  <text x="30" y="108" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7777cc">H=1</text>
  <text x="30" y="192" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7ec8e3">H=2</text>
  <text x="30" y="294" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#55c555">H=3</text>

  <!-- Heap pointer label -->
  <rect x="60" y="390" width="760" height="100" rx="6" fill="#0d1520" stroke="#7777cc" stroke-width="1"/>
  <text x="440" y="414" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7777cc">B-Tree 핵심 특성</text>
  <text x="80" y="438" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• O(log N) 탐색: 1억 행 → 높이 약 7 → 7번 블록 I/O로 검색 완료</text>
  <text x="80" y="458" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 리프 연결 리스트: 범위 스캔 시 추가 트리 탐색 없이 순차 이동</text>
  <text x="80" y="478" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 밸런스 유지: 모든 리프 노드가 같은 높이 (Balanced Tree)</text>
</svg>
