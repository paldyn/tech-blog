<svg xmlns="http://www.w3.org/2000/svg" width="880" height="476" viewBox="0 0 880 476"
     style="font-family:'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="476" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">CREATE TABLE 문 해부</text>

  <!-- Code block -->
  <rect x="60" y="68" width="760" height="206" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="80" y="92" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7777cc" font-weight="600">CREATE TABLE</tspan> employees (</text>
  <text x="80" y="110" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    id          <tspan fill="#7ec8e3">INTEGER</tspan>        <tspan fill="#55c555">NOT NULL PRIMARY KEY</tspan>,</text>
  <text x="80" y="128" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    name        <tspan fill="#7ec8e3">VARCHAR(100)</tspan>   <tspan fill="#55c555">NOT NULL</tspan>,</text>
  <text x="80" y="146" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    email       <tspan fill="#7ec8e3">VARCHAR(200)</tspan>   <tspan fill="#55c555">UNIQUE</tspan>,</text>
  <text x="80" y="164" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    salary      <tspan fill="#7ec8e3">DECIMAL(12,2)</tspan>  <tspan fill="#55c555">DEFAULT 0 CHECK (salary &gt;= 0)</tspan>,</text>
  <text x="80" y="182" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    dept_id     <tspan fill="#7ec8e3">INTEGER</tspan>,</text>
  <text x="80" y="200" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    created_at  <tspan fill="#7ec8e3">TIMESTAMP</tspan>      <tspan fill="#55c555">DEFAULT CURRENT_TIMESTAMP</tspan>,</text>
  <text x="80" y="218" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    <tspan fill="#9aa4b8">-- 테이블 수준 제약</tspan></text>
  <text x="80" y="236" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    <tspan fill="#ce9178">CONSTRAINT fk_dept FOREIGN KEY (dept_id) REFERENCES departments(id)</tspan></text>
  <text x="80" y="254" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">);</text>

  <!-- Legend -->
  <rect x="80" y="291" width="12" height="12" rx="2" fill="#7777cc"/>
  <text x="100" y="302" font-size="12" fill="#7777cc">DDL 키워드</text>
  <rect x="228" y="291" width="12" height="12" rx="2" fill="#ffffff"/>
  <text x="248" y="302" font-size="12" fill="#e8e8e8">컬럼명</text>
  <rect x="376" y="291" width="12" height="12" rx="2" fill="#7ec8e3"/>
  <text x="396" y="302" font-size="12" fill="#7ec8e3">데이터 타입</text>
  <rect x="524" y="291" width="12" height="12" rx="2" fill="#55c555"/>
  <text x="544" y="302" font-size="12" fill="#55c555">열 수준 제약</text>
  <rect x="672" y="291" width="12" height="12" rx="2" fill="#ce9178"/>
  <text x="692" y="302" font-size="12" fill="#ce9178">테이블 수준 제약</text>

  <!-- Bottom notes -->
  <rect x="60" y="326" width="760" height="120" rx="6" fill="#0d0d15" stroke="#3a4a6e"/>
  <text x="440" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">CREATE TABLE의 세 구성 요소</text>

  <text x="110" y="372" font-size="12" font-weight="600" fill="#7ec8e3">①  테이블명</text>
  <text x="230" y="372" font-size="12" fill="#888">가독성 높은 명사 복수형 권장 (employees, orders)</text>

  <text x="110" y="392" font-size="12" font-weight="600" fill="#7ec8e3">②  컬럼 정의</text>
  <text x="230" y="392" font-size="12" fill="#888">이름 + 타입 [+ 열 수준 제약]. 컬럼 순서는 CREATE 시 고정</text>

  <text x="110" y="412" font-size="12" font-weight="600" fill="#7ec8e3">③  테이블 제약</text>
  <text x="230" y="412" font-size="12" fill="#888">여러 컬럼을 묶는 FK, 복합 PK, 복합 UNIQUE</text>

  <text x="110" y="432" font-size="12" font-weight="600" fill="#e8c555">⚠  주의</text>
  <text x="160" y="432" font-size="12" fill="#888">컬럼 추가는 저렴, 컬럼 타입 변경은 테이블 잠금+리빌드 발생 가능</text>

</svg>
