<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <rect width="880" height="440" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">문맥적 타이핑 (Contextual Typing)</text>
  <text x="440" y="74" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">콜백 파라미터 타입을 사용 문맥에서 자동 추론</text>

  <!-- Code box -->
  <text x="60" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">문맥적 타이핑 예시</text>
  <rect x="60" y="116" width="760" height="282" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <!-- nums.forEach -->
  <text x="76" y="142" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 문맥적 타이핑 — 파라미터 타입 자동 추론</text>
  <text x="76" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> nums = [</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">2</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">3</tspan><tspan fill="#ffffff">];</tspan></text>
  <text x="76" y="182" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">nums.forEach(n </tspan><tspan fill="#ffffff">=&gt; {</tspan></text>
  <text x="76" y="202" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  console.log(n.toFixed(</tspan><tspan fill="#b5cea8">2</tspan><tspan fill="#ffffff">)); </tspan><tspan fill="#9aa4b8">// n: number</tspan></text>
  <text x="76" y="222" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">});</text>

  <!-- 이벤트 핸들러 -->
  <text x="76" y="252" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 이벤트 핸들러 추론</text>
  <text x="76" y="272" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">document.addEventListener(</tspan><tspan fill="#ce9178">"click"</tspan><tspan fill="#ffffff">, (e) </tspan><tspan fill="#ffffff">=&gt; {</tspan></text>
  <text x="76" y="292" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  console.log(e.clientX); </tspan><tspan fill="#9aa4b8">// e: MouseEvent</tspan></text>
  <text x="76" y="312" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">});</text>

  <!-- 할당 문맥 -->
  <text x="76" y="342" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 할당 문맥</text>
  <text x="76" y="362" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">type</tspan><tspan fill="#ffffff"> Handler = (s: </tspan><tspan fill="#7ec8e3" font-weight="600">string</tspan><tspan fill="#ffffff">) </tspan><tspan fill="#ffffff">=&gt;</tspan><tspan fill="#7ec8e3" font-weight="600"> void</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="76" y="382" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> h: Handler = (s) </tspan><tspan fill="#ffffff">=&gt;</tspan><tspan fill="#ffffff"> { console.log(s.toUpperCase()); }; </tspan><tspan fill="#9aa4b8">// s: string</tspan></text>

  <!-- Note -->
  <rect x="60" y="410" width="760" height="14" rx="3" fill="none"/>
  <text x="440" y="422" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7ec8e3">문맥적 타이핑은 콜백 함수 파라미터에서 특히 강력 — 명시적 어노테이션 없이도 타입 안전</text>
</svg>
