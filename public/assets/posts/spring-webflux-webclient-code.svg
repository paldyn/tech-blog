<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 520">
  <rect width="880" height="520" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8">WebClient 주요 패턴 코드</text>

  <!-- Left: Setup & Basic GET -->
  <rect x="60" y="68" width="360" height="432" rx="10" fill="#111827" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="240" y="96" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">빌드 &amp; GET 요청</text>
  <line x1="70" y1="106" x2="410" y2="106" stroke="#3a4a6e" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Code block 1: WebClient setup -->
  <rect x="74" y="116" width="332" height="148" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="88" y="138" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#9aa4b8" xml:space="preserve">// WebClient 인스턴스 생성</text>
  <text x="88" y="157" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">WebClient</tspan><tspan fill="#ffffff"> client = WebClient</tspan></text>
  <text x="88" y="176" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .builder()</text>
  <text x="88" y="195" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    .baseUrl(</tspan><tspan fill="#ce9178">"https://api.example.com"</tspan></text>
  <text x="88" y="214" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    .defaultHeader(</tspan><tspan fill="#ce9178">"Accept"</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="88" y="233" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">        </tspan><tspan fill="#ce9178">MediaType.APPLICATION_JSON_VALUE</tspan></text>
  <text x="88" y="252" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    ).build();</text>

  <!-- Code block 2: GET request -->
  <rect x="74" y="276" width="332" height="210" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="88" y="298" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#9aa4b8" xml:space="preserve">// GET 요청 + 에러 처리</text>
  <text x="88" y="317" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">Mono</tspan><tspan fill="#ffffff">&lt;User&gt; user = client</tspan></text>
  <text x="88" y="336" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .get()</text>
  <text x="88" y="355" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    .uri(</tspan><tspan fill="#ce9178">"/users/{id}"</tspan><tspan fill="#ffffff">, userId)</tspan></text>
  <text x="88" y="374" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .retrieve()</text>
  <text x="88" y="393" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .onStatus(</text>
  <text x="88" y="412" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">        HttpStatus::is4xxClientError,</text>
  <text x="88" y="431" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">        r -&gt; Mono.error(</text>
  <text x="88" y="450" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">          </tspan><tspan fill="#7ec8e3" font-weight="600">new</tspan><tspan fill="#ffffff"> UserNotFoundException()))</tspan></text>

  <!-- Right: POST & Advanced -->
  <rect x="460" y="68" width="360" height="432" rx="10" fill="#111827" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="640" y="96" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">POST &amp; 고급 패턴</text>
  <line x1="470" y1="106" x2="810" y2="106" stroke="#3a4a6e" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Code block 3: POST request -->
  <rect x="474" y="116" width="332" height="148" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="488" y="138" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#9aa4b8" xml:space="preserve">// POST 요청 (body 전송)</text>
  <text x="488" y="157" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">Mono</tspan><tspan fill="#ffffff">&lt;User&gt; created = client</tspan></text>
  <text x="488" y="176" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .post()</text>
  <text x="488" y="195" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    .uri(</tspan><tspan fill="#ce9178">"/users"</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="488" y="214" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .bodyValue(createRequest)</text>
  <text x="488" y="233" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .retrieve()</text>
  <text x="488" y="252" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .bodyToMono(User.class);</text>

  <!-- Code block 4: retry & timeout -->
  <rect x="474" y="276" width="332" height="210" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="488" y="298" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#9aa4b8" xml:space="preserve">// 타임아웃 + 재시도 패턴</text>
  <text x="488" y="317" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">Flux</tspan><tspan fill="#ffffff">&lt;Item&gt; items = client</tspan></text>
  <text x="488" y="336" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    .get().uri(</tspan><tspan fill="#ce9178">"/items"</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="488" y="355" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .retrieve()</text>
  <text x="488" y="374" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .bodyToFlux(Item.class)</text>
  <text x="488" y="393" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .timeout(Duration.ofSeconds(</text>
  <text x="488" y="412" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#b5cea8">        3</tspan><tspan fill="#ffffff">))</tspan></text>
  <text x="488" y="431" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    .retryWhen(Retry.backoff(</text>
  <text x="488" y="450" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#b5cea8">        3</tspan><tspan fill="#ffffff">, Duration.ofMillis(</tspan></text>
  <text x="488" y="469" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#b5cea8">        100</tspan><tspan fill="#ffffff">));</tspan></text>
</svg>
