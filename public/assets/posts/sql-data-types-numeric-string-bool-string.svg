<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520"
     style="font-family:'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="520" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">문자열 · 불리언 데이터 타입</text>

  <!-- ── Left: Character types ── -->
  <rect x="60" y="68" width="350" height="410" rx="8" fill="#0d0d0d" stroke="#3a4a6e"/>
  <text x="235" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#7777cc">문자열 타입 (Character)</text>
  <line x1="60" y1="108" x2="410" y2="108" stroke="#2a2a3a"/>

  <!-- CHAR(n) -->
  <rect x="78" y="118" width="314" height="64" rx="4" fill="#0a0a1a" stroke="#3a3a6a"/>
  <text x="90" y="137" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="700" fill="#7777cc">CHAR(n)</text>
  <text x="160" y="137" font-size="11" fill="#888">고정 길이</text>
  <text x="90" y="156" font-size="11" fill="#888">항상 n바이트 사용 — 짧으면 공백 패딩</text>
  <text x="90" y="173" font-size="11" fill="#55c555">용도: 국가 코드 (2), 성별 코드 (1)</text>

  <!-- VARCHAR(n) -->
  <rect x="78" y="190" width="314" height="64" rx="4" fill="#0a0a1a" stroke="#3a3a6a"/>
  <text x="90" y="209" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="700" fill="#7777cc">VARCHAR(n)</text>
  <text x="184" y="209" font-size="11" fill="#e8e8e8">가변 길이</text>
  <rect x="284" y="195" width="100" height="20" rx="3" fill="#1a1a3a"/>
  <text x="334" y="209" text-anchor="middle" font-size="10" fill="#7777cc">가장 일반적</text>
  <text x="90" y="228" font-size="11" fill="#888">실제 길이만큼만 저장 · n 초과 시 오류</text>
  <text x="90" y="245" font-size="11" fill="#55c555">용도: 이름 (100), 이메일 (254)</text>

  <!-- TEXT -->
  <rect x="78" y="262" width="314" height="64" rx="4" fill="#0a0a1a" stroke="#3a3a6a"/>
  <text x="90" y="281" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="700" fill="#7777cc">TEXT</text>
  <text x="134" y="281" font-size="11" fill="#888">길이 제한 없음 (비표준)</text>
  <text x="90" y="300" font-size="11" fill="#888">PG: 무제한  /  MySQL: 65,535바이트</text>
  <text x="90" y="317" font-size="11" fill="#e8c555">주의: 인덱싱 길이 제한 발생 가능</text>

  <!-- Code block -->
  <rect x="78" y="338" width="314" height="96" rx="4" fill="#000000" stroke="#3a4a6e"/>
  <text x="94" y="360" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 문자열 컬럼 설계 예시</tspan></text>
  <text x="94" y="380" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">country_code <tspan fill="#7ec8e3" font-weight="600">CHAR</tspan>(<tspan fill="#b5cea8">2</tspan>)</text>
  <text x="94" y="400" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">email        <tspan fill="#7ec8e3" font-weight="600">VARCHAR</tspan>(<tspan fill="#b5cea8">254</tspan>)</text>
  <text x="94" y="420" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">body         <tspan fill="#7ec8e3" font-weight="600">TEXT</tspan></text>

  <!-- ── Right: Boolean ── -->
  <rect x="470" y="68" width="350" height="410" rx="8" fill="#0d0d0d" stroke="#3a4a6e"/>
  <text x="645" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#55c555">불리언 타입 (Boolean)</text>
  <line x1="470" y1="108" x2="820" y2="108" stroke="#2a2a3a"/>

  <!-- BOOLEAN block -->
  <rect x="488" y="118" width="314" height="64" rx="4" fill="#0a1a0a" stroke="#2a5a2a"/>
  <text x="500" y="137" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="700" fill="#55c555">BOOLEAN</text>
  <text x="572" y="137" font-size="11" fill="#888">SQL 표준 타입</text>
  <text x="500" y="156" font-size="11" fill="#888">값: TRUE · FALSE · NULL (UNKNOWN)</text>
  <text x="500" y="173" font-size="11" fill="#e8c555">NULL은 참도 거짓도 아님 (3값 논리)</text>

  <!-- DBMS differences -->
  <text x="488" y="206" font-size="12" font-weight="600" fill="#e8e8e8">DBMS별 구현 방식</text>

  <rect x="488" y="216" width="314" height="28" rx="3" fill="#0a1520" stroke="#2a3a5a"/>
  <text x="500" y="234" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#7ec8e3">PostgreSQL</text>
  <text x="590" y="234" font-size="11" fill="#888">네이티브 BOOLEAN 지원</text>

  <rect x="488" y="250" width="314" height="28" rx="3" fill="#0a1520" stroke="#2a3a5a"/>
  <text x="500" y="268" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#7ec8e3">MySQL</text>
  <text x="590" y="268" font-size="11" fill="#888">TINYINT(1) 별칭 (0/1)</text>

  <rect x="488" y="284" width="314" height="28" rx="3" fill="#0a1520" stroke="#2a3a5a"/>
  <text x="500" y="302" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#7ec8e3">Oracle</text>
  <text x="590" y="302" font-size="11" fill="#888">NUMBER(1) 관례 · 23c+ BOOLEAN</text>

  <!-- Code block -->
  <rect x="488" y="324" width="314" height="136" rx="4" fill="#000000" stroke="#3a4a6e"/>
  <text x="504" y="346" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 불리언 컬럼 활용 예시</tspan></text>
  <text x="504" y="366" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">is_active  <tspan fill="#7ec8e3" font-weight="600">BOOLEAN</tspan> <tspan fill="#7ec8e3" font-weight="600">DEFAULT</tspan> <tspan fill="#55c555">TRUE</tspan></text>
  <text x="504" y="386" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">is_deleted <tspan fill="#7ec8e3" font-weight="600">BOOLEAN</tspan> <tspan fill="#7ec8e3" font-weight="600">DEFAULT</tspan> <tspan fill="#e05555">FALSE</tspan></text>
  <text x="504" y="406" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- NULL 조건은 IS NULL로</tspan></text>
  <text x="504" y="426" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan> is_active   <tspan fill="#9aa4b8">-- TRUE만</tspan></text>
  <text x="504" y="446" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan> is_active <tspan fill="#7ec8e3" font-weight="600">IS NULL</tspan></text>
</svg>
