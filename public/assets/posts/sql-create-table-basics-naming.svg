<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480"
     style="font-family:'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="480" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">테이블 설계 — 좋은 이름과 나쁜 이름</text>

  <!-- ── Left: Bad examples ── -->
  <rect x="60" y="70" width="350" height="360" rx="8" fill="#0d0d0d" stroke="#e05555" stroke-opacity="0.5"/>
  <text x="235" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#e05555">✗ 나쁜 예시</text>
  <line x1="60" y1="110" x2="410" y2="110" stroke="#e05555" stroke-opacity="0.3"/>

  <!-- Bad code block -->
  <rect x="78" y="122" width="314" height="216" rx="5" fill="#000000" stroke="#3a4a6e"/>
  <text x="92" y="143" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 예약어 충돌</tspan></text>
  <text x="92" y="161" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#e05555"> order</tspan> (...);</text>
  <text x="92" y="179" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 의미 불명확</tspan></text>
  <text x="92" y="197" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#e05555"> t1</tspan> (...);</text>
  <text x="92" y="215" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 단수 (관례 불일치)</tspan></text>
  <text x="92" y="233" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#e05555"> Employee</tspan> (...);</text>
  <text x="92" y="251" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 특수문자 포함</tspan></text>
  <text x="92" y="269" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#e05555"> "User-Data"</tspan> (...);</text>
  <text x="92" y="287" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 이름이 너무 유사</tspan></text>
  <text x="92" y="305" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#e05555"> orders2</tspan> (...);</text>
  <text x="92" y="323" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- SELECT는 예약어!</tspan></text>

  <text x="78" y="375" font-size="11" fill="#e05555">✗ order: SQL 예약어. 따옴표 필요</text>
  <text x="78" y="393" font-size="11" fill="#e05555">✗ t1: 나중에 무엇인지 알 수 없음</text>
  <text x="78" y="411" font-size="11" fill="#e05555">✗ Employee: camelCase 대신 snake_case</text>

  <!-- ── Right: Good examples ── -->
  <rect x="470" y="70" width="350" height="360" rx="8" fill="#0d0d0d" stroke="#55c555" stroke-opacity="0.5"/>
  <text x="645" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#55c555">✓ 좋은 예시</text>
  <line x1="470" y1="110" x2="820" y2="110" stroke="#55c555" stroke-opacity="0.3"/>

  <!-- Good code block -->
  <rect x="488" y="122" width="314" height="198" rx="5" fill="#000000" stroke="#3a4a6e"/>
  <text x="502" y="143" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 예약어 회피 (복수형)</tspan></text>
  <text x="502" y="161" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#55c555"> orders</tspan> (...);</text>
  <text x="502" y="179" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 의미 명확</tspan></text>
  <text x="502" y="197" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#55c555"> employees</tspan> (...);</text>
  <text x="502" y="215" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 소문자 snake_case</tspan></text>
  <text x="502" y="233" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#55c555"> order_items</tspan> (...);</text>
  <text x="502" y="251" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 알파벳+숫자+밑줄</tspan></text>
  <text x="502" y="269" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#55c555"> audit_logs</tspan> (...);</text>
  <text x="502" y="287" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 명확한 이름</tspan></text>
  <text x="502" y="305" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#55c555"> order_history</tspan> (...);</text>

  <text x="488" y="375" font-size="11" fill="#55c555">✓ orders: 복수형, 예약어 아님</text>
  <text x="488" y="393" font-size="11" fill="#55c555">✓ snake_case: 모든 DBMS에서 안전</text>
  <text x="488" y="411" font-size="11" fill="#55c555">✓ order_history: orders2보다 명확</text>

</svg>
