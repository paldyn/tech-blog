<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <rect width="880" height="520" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8">Testing Library — render·userEvent·waitFor</text>

  <!-- Left: render + getByRole -->
  <text x="60" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#7ec8e3">render + screen + userEvent</text>
  <rect x="60" y="94" width="370" height="276" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <!-- Right: waitFor + findBy -->
  <text x="450" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#7ec8e3">waitFor + findBy — 비동기 DOM 검증</text>
  <rect x="450" y="94" width="370" height="276" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <!-- Bottom: @testing-library/jest-dom matchers -->
  <text x="60" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">@testing-library/jest-dom 커스텀 매처</text>
  <rect x="60" y="412" width="760" height="96" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="116" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">import</tspan> { render, screen }</text>
  <text x="76" y="136" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">from</tspan> <tspan fill="#ce9178">'@testing-library/react'</tspan></text>
  <text x="76" y="156" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">import</tspan> userEvent</text>
  <text x="76" y="176" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">from</tspan> <tspan fill="#ce9178">'@testing-library/user-event'</tspan></text>
  <text x="76" y="216" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">test(<tspan fill="#ce9178">'로그인 폼 제출'</tspan>, <tspan fill="#7ec8e3" font-weight="600">async</tspan> () =&gt; {</text>
  <text x="76" y="236" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">const</tspan> user = userEvent.setup()</text>
  <text x="76" y="256" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  render(&lt;LoginForm /&gt;)</text>
  <text x="76" y="276" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">await</tspan> user.<tspan fill="#7ec8e3" font-weight="600">type</tspan>(screen.getByLabelText(</text>
  <text x="76" y="296" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    <tspan fill="#ce9178">'이메일'</tspan>), <tspan fill="#ce9178">'alice@example.com'</tspan>)</text>
  <text x="76" y="316" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">await</tspan> user.click(screen.getByRole(</text>
  <text x="76" y="336" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    <tspan fill="#ce9178">'button'</tspan>, { name: <tspan fill="#ce9178">'로그인'</tspan> }))</text>
  <text x="76" y="356" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">})</text>
  <text x="466" y="116" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">import</tspan> { render, screen,</text>
  <text x="466" y="136" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  waitFor } <tspan fill="#7ec8e3" font-weight="600">from</tspan> <tspan fill="#ce9178">'@testing-library/react'</tspan></text>
  <text x="466" y="176" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">// waitFor: 조건이 충족될 때까지 폴링</tspan></text>
  <text x="466" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">await</tspan> waitFor(() =&gt; {</text>
  <text x="466" y="216" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  expect(screen.getByText(<tspan fill="#ce9178">'완료'</tspan>))</text>
  <text x="466" y="236" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    .toBeInTheDocument()</text>
  <text x="466" y="256" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">})</text>
  <text x="466" y="296" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">// findBy: Promise 반환 쿼리</tspan></text>
  <text x="466" y="316" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">const</tspan> el = <tspan fill="#7ec8e3" font-weight="600">await</tspan> screen.findByText(</text>
  <text x="466" y="336" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#ce9178">'완료'</tspan>)</text>
  <text x="76" y="434" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">expect(el).toBeInTheDocument()                 <tspan fill="#9aa4b8">// DOM에 존재하는지</tspan></text>
  <text x="76" y="454" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">expect(btn).toBeDisabled()                     <tspan fill="#9aa4b8">// disabled 속성 여부</tspan></text>
  <text x="76" y="474" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">expect(input).toHaveValue(<tspan fill="#ce9178">'alice'</tspan>)             <tspan fill="#9aa4b8">// 입력값 검증</tspan></text>
  <text x="76" y="494" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">expect(link).toHaveAttribute(<tspan fill="#ce9178">'href'</tspan>, <tspan fill="#ce9178">'/about'</tspan>) <tspan fill="#9aa4b8">// 속성값 검증</tspan></text>
</svg>
