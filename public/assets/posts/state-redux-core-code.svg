<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <!-- Background -->
  <rect width="880" height="480" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="45" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8">Redux 기본 패턴</text>

  <!-- ===== Left: Action box ===== -->
  <rect x="60" y="70" width="240" height="374" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <!-- Header -->
  <rect x="60" y="70" width="240" height="30" rx="6" fill="#0a0a1a"/>
  <rect x="60" y="88" width="240" height="12" fill="#0a0a1a"/>
  <text x="180" y="90" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3">Action</text>
  <!-- Code -->

  <!-- ===== Center: Reducer box ===== -->
  <rect x="320" y="70" width="240" height="374" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <!-- Header -->
  <rect x="320" y="70" width="240" height="30" rx="6" fill="#0a0a1a"/>
  <rect x="320" y="88" width="240" height="12" fill="#0a0a1a"/>
  <text x="440" y="90" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3">Reducer</text>
  <!-- Code -->

  <!-- ===== Right: Store + Subscribe box ===== -->
  <rect x="580" y="70" width="240" height="374" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <!-- Header -->
  <rect x="580" y="70" width="240" height="30" rx="6" fill="#0a0a1a"/>
  <rect x="580" y="88" width="240" height="12" fill="#0a0a1a"/>
  <text x="700" y="90" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3">Store + Subscribe</text>
  <!-- Code -->
  <text xml:space="preserve" x="76" y="122" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">// actions.js</tspan></text>
  <text xml:space="preserve" x="76" y="141" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> ADD_TODO =</tspan></text>
  <text xml:space="preserve" x="76" y="160" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ce9178">  'ADD_TODO'</tspan></text>
  <text xml:space="preserve" x="76" y="198" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">function</tspan><tspan fill="#ffffff"> addTodo(text) {</tspan></text>
  <text xml:space="preserve" x="76" y="217" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">  return</tspan><tspan fill="#ffffff"> {</tspan></text>
  <text xml:space="preserve" x="76" y="236" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">    type: ADD_TODO,</tspan></text>
  <text xml:space="preserve" x="76" y="255" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">    payload: { text }</tspan></text>
  <text xml:space="preserve" x="76" y="274" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">  }</tspan></text>
  <text xml:space="preserve" x="76" y="293" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">}</tspan></text>
  <text xml:space="preserve" x="336" y="122" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">// reducer.js</tspan></text>
  <text xml:space="preserve" x="336" y="141" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">function</tspan><tspan fill="#ffffff"> todosReducer(</tspan></text>
  <text xml:space="preserve" x="336" y="160" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">  state = [],</tspan></text>
  <text xml:space="preserve" x="336" y="179" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">  action</tspan></text>
  <text xml:space="preserve" x="336" y="198" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">) {</tspan></text>
  <text xml:space="preserve" x="336" y="217" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">  switch</tspan><tspan fill="#ffffff"> (action.type) {</tspan></text>
  <text xml:space="preserve" x="336" y="236" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">    case</tspan><tspan fill="#ffffff"> ADD_TODO:</tspan></text>
  <text xml:space="preserve" x="336" y="255" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">      return</tspan><tspan fill="#ffffff"> [</tspan></text>
  <text xml:space="preserve" x="336" y="274" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">        ...state,</tspan></text>
  <text xml:space="preserve" x="336" y="293" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">        action.payload</tspan></text>
  <text xml:space="preserve" x="336" y="312" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">      ]</tspan></text>
  <text xml:space="preserve" x="336" y="331" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">    default</tspan><tspan fill="#ffffff">:</tspan></text>
  <text xml:space="preserve" x="336" y="350" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">      return</tspan><tspan fill="#ffffff"> state</tspan></text>
  <text xml:space="preserve" x="336" y="369" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">  }</tspan></text>
  <text xml:space="preserve" x="336" y="388" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">}</tspan></text>
  <text xml:space="preserve" x="596" y="122" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">// store.js</tspan></text>
  <text xml:space="preserve" x="596" y="141" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">import</tspan><tspan fill="#ffffff"> { createStore }</tspan></text>
  <text xml:space="preserve" x="596" y="160" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">  from</tspan><tspan fill="#ce9178"> 'redux'</tspan></text>
  <text xml:space="preserve" x="596" y="198" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> store =</tspan></text>
  <text xml:space="preserve" x="596" y="217" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">  createStore(todosReducer)</tspan></text>
  <text xml:space="preserve" x="596" y="255" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">store.subscribe(() =&gt;</tspan></text>
  <text xml:space="preserve" x="596" y="274" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">  console.log(</tspan></text>
  <text xml:space="preserve" x="596" y="293" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">    store.getState()</tspan></text>
  <text xml:space="preserve" x="596" y="312" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">  )</tspan></text>
  <text xml:space="preserve" x="596" y="331" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">)</tspan></text>
  <text xml:space="preserve" x="596" y="350" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">store.dispatch(</tspan></text>
  <text xml:space="preserve" x="596" y="369" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">  addTodo(</tspan></text>
  <text xml:space="preserve" x="596" y="388" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ce9178">    'Learn Redux'</tspan></text>
  <text xml:space="preserve" x="596" y="407" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">  )</tspan></text>
  <text xml:space="preserve" x="596" y="426" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#ffffff">)</tspan></text>
</svg>
