<svg xmlns="http://www.w3.org/2000/svg" width="880" height="434" viewBox="0 0 880 434">
  <rect width="880" height="434" rx="12" fill="#0a0a0a"/>

  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">CSRF 토큰 구현 패턴</text>
  <text x="440" y="70" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" fill="#888" text-anchor="middle">서버 발급 → 클라이언트 전송 → 서버 검증</text>

  <!-- 서버 토큰 생성 -->
  <rect x="60" y="90" width="370" height="34" rx="6" fill="#0a1a0a" stroke="#55c555" stroke-width="1.5"/>
  <text x="245" y="113" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="700" fill="#55c555" text-anchor="middle">① 서버: 토큰 생성 및 쿠키 설정</text>

  <rect x="60" y="136" width="370" height="114" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="160" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan font-weight="600" fill="#7ec8e3">import</tspan><tspan fill="#ffffff"> crypto from </tspan><tspan fill="#ce9178">'node:crypto'</tspan></text>
  <text x="76" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan font-weight="600" fill="#7ec8e3">const</tspan><tspan fill="#ffffff"> token = crypto</tspan></text>
  <text x="76" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  .randomBytes(32).toString(</tspan><tspan fill="#ce9178">'hex'</tspan><tspan fill="#ffffff">);</tspan></text>
  <text x="76" y="214" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">res.cookie(</tspan><tspan fill="#ce9178">'csrf'</tspan><tspan fill="#ffffff">, token,</tspan></text>
  <text x="76" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  { sameSite: </tspan><tspan fill="#ce9178">'Strict'</tspan><tspan fill="#ffffff"> });</tspan></text>

  <!-- 클라이언트 전송 -->
  <rect x="450" y="90" width="370" height="34" rx="6" fill="#0a0a1a" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="635" y="113" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="700" fill="#7ec8e3" text-anchor="middle">② 클라이언트: 헤더에 토큰 포함</text>

  <rect x="450" y="136" width="370" height="114" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="466" y="169" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan font-weight="600" fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> getCsrfToken() {</tspan></text>
  <text x="466" y="187" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan font-weight="600" fill="#7ec8e3">  return</tspan><tspan fill="#ffffff"> document.cookie</tspan></text>
  <text x="466" y="205" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    .match(/csrf=([^;]+)/)?.[</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">];</tspan></text>
  <text x="466" y="223" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">}</tspan></text>

  <!-- 서버 검증 -->
  <rect x="60" y="272" width="760" height="34" rx="6" fill="#1a0a1a" stroke="#7777cc" stroke-width="1.5"/>
  <text x="440" y="295" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="700" fill="#7777cc" text-anchor="middle">③ 서버: 요청 헤더 토큰과 세션 토큰 비교 검증</text>

  <rect x="60" y="316" width="760" height="90" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="338" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan font-weight="600" fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> verifyCsrf(req, res, next) {</tspan></text>
  <text x="76" y="358" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan font-weight="600" fill="#7ec8e3">  const</tspan><tspan fill="#ffffff"> header = req.headers[</tspan><tspan fill="#ce9178">'x-csrf-token'</tspan><tspan fill="#ffffff">];</tspan></text>
  <text x="76" y="378" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan font-weight="600" fill="#7ec8e3">  if</tspan><tspan fill="#ffffff"> (!header || header !== req.session.csrf)</tspan></text>
  <text x="76" y="396" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    </tspan><tspan font-weight="600" fill="#7ec8e3">return</tspan><tspan fill="#ffffff"> res.status(</tspan><tspan fill="#b5cea8">403</tspan><tspan fill="#ffffff">).json({ error: </tspan><tspan fill="#ce9178">'CSRF mismatch'</tspan><tspan fill="#ffffff"> });</tspan></text>
</svg>
