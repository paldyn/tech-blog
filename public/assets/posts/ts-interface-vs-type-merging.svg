<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380">
  <rect width="880" height="380" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">선언 병합 실전 — 전역 타입 확장</text>
  <text x="440" y="74" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">interface 재선언으로 기존 타입에 속성 추가</text>

  <!-- Left: Express Request augmentation -->
  <text x="60" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">Express Request 타입 확장</text>
  <rect x="60" y="116" width="370" height="226" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="142" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// express.d.ts (또는 global.d.ts)</text>
  <text x="76" y="160" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">declare</tspan><tspan fill="#7ec8e3"> global</tspan><tspan fill="#ffffff"> {</tspan></text>
  <text x="76" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  namespace</tspan><tspan fill="#ffffff"> Express {</tspan></text>
  <text x="76" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">    interface</tspan><tspan fill="#ffffff"> Request {</tspan></text>
  <text x="76" y="214" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">      user?: { id: </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff">; role: </tspan><tspan fill="#7ec8e3">string</tspan><tspan fill="#ffffff"> };</tspan></text>
  <text x="76" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    }</text>
  <text x="76" y="250" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  }</text>
  <text x="76" y="268" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>
  <text x="76" y="304" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 핸들러에서 타입 안전하게 접근</text>
  <text x="76" y="322" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">app.get(</tspan><tspan fill="#ce9178">"/me"</tspan><tspan fill="#ffffff">, (req, res) => {</tspan></text>
  <text x="76" y="340" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  req.user?.id;  </tspan><tspan fill="#55c555">// number | undefined</tspan></text>

  <!-- Right: type utility examples -->
  <text x="460" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">type이 필요한 고급 패턴</text>
  <rect x="460" y="116" width="360" height="226" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="476" y="142" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 유니언·인터섹션</text>
  <text x="476" y="160" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">type</tspan><tspan fill="#ffffff"> ID = </tspan><tspan fill="#7ec8e3">string</tspan><tspan fill="#ffffff"> | </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="476" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 조건부 타입</text>
  <text x="476" y="214" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">type</tspan><tspan fill="#ffffff"> IsArray&lt;T&gt; = T </tspan><tspan fill="#7ec8e3">extends</tspan></text>
  <text x="476" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  any</tspan><tspan fill="#ffffff">[] ? </tspan><tspan fill="#7ec8e3">true</tspan><tspan fill="#ffffff"> : </tspan><tspan fill="#7ec8e3">false</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="476" y="268" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 매핑 타입</text>
  <text x="476" y="286" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">type</tspan><tspan fill="#ffffff"> Optional&lt;T&gt; = {</tspan></text>
  <text x="476" y="304" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  [K </tspan><tspan fill="#7ec8e3">in</tspan><tspan fill="#7ec8e3"> keyof</tspan><tspan fill="#ffffff"> T]?: T[K]</tspan></text>
  <text x="476" y="322" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">};</text>
  <text x="476" y="340" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// interface로는 불가능</text>
</svg>
