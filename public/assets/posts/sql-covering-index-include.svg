<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
  <rect width="880" height="360" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">INCLUDE 컬럼 vs 인덱스 키 컬럼</text>
  <text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#888">PostgreSQL 11+ / SQL Server INCLUDE 절</text>

  <!-- Left: Key columns only -->
  <rect x="60" y="86" width="360" height="240" rx="8" fill="#0d0d0d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="240" y="110" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#7ec8e3">키 컬럼 방식</text>
  <text x="240" y="130" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">모든 컬럼이 정렬 키가 됨</text>

  <rect x="76" y="140" width="328" height="72" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="92" y="171" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE INDEX</tspan> idx1</text>
  <text x="92" y="190" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">ON</tspan> orders (status, name, total);</text>

  <text x="80" y="236" xml:space="preserve" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">장점: name·total로도 필터·정렬 가능</text>
  <text x="80" y="254" xml:space="preserve" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">단점: 불필요한 컬럼도 모두 정렬 키</text>
  <text x="80" y="272" xml:space="preserve" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">      인덱스 크기 증가</text>
  <text x="80" y="290" xml:space="preserve" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">      갱신 시 모든 컬럼 재정렬</text>
  <text x="80" y="310" xml:space="preserve" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">      name 변경이 인덱스 재구성 유발</text>

  <!-- Right: INCLUDE -->
  <rect x="460" y="86" width="360" height="240" rx="8" fill="#0d0d0d" stroke="#55c555" stroke-width="2"/>
  <text x="640" y="110" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#55c555">INCLUDE 방식 (권장)</text>
  <text x="640" y="130" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">리프에만 저장, 정렬 키 아님</text>

  <rect x="476" y="140" width="328" height="72" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="492" y="162" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE INDEX</tspan> idx2</text>
  <text x="492" y="181" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">ON</tspan> orders (status)</text>
  <text x="492" y="200" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">INCLUDE</tspan> (name, total);</text>

  <text x="480" y="236" xml:space="preserve" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">장점: 인덱스 크기 작음</text>
  <text x="480" y="254" xml:space="preserve" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">      name 변경이 재정렬 없음</text>
  <text x="480" y="272" xml:space="preserve" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">      DML 오버헤드 최소화</text>
  <text x="480" y="290" xml:space="preserve" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">단점: name·total로 필터·정렬 불가</text>
  <text x="480" y="310" xml:space="preserve" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">      SELECT 목적으로만 활용</text>

  <!-- Bottom -->
  <text x="440" y="348" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">INCLUDE: SELECT에 필요하지만 WHERE/ORDER BY엔 없는 컬럼 · 힙 접근만 없애는 목적</text>
</svg>
