<svg xmlns="http://www.w3.org/2000/svg" width="880" height="546" viewBox="0 0 880 546">
  <defs>
    <marker id="arrR" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
    <marker id="arrG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>
  <rect width="880" height="546" fill="#0a0a0a" rx="12"/>
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">상관 서브쿼리 실행 흐름</text>
  <text x="440" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#888" text-anchor="middle">외부 쿼리 행마다 서브쿼리가 재실행된다</text>

  <!-- Outer table -->
  <rect x="50" y="96" width="240" height="214" fill="#131820" rx="8" stroke="#7ec8e3"/>
  <text x="170" y="118" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">외부 쿼리 (employees)</text>
  <rect x="66" y="128" width="208" height="24" fill="#243049" rx="3"/>
  <text x="84" y="144" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">id</text>
  <text x="124" y="144" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">name</text>
  <text x="204" y="144" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">dept</text>
  <rect x="66" y="152" width="208" height="22" fill="#0a1e14" rx="2" stroke="#55c555" stroke-width="1"/>
  <text x="84" y="167" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#55c555">1</text>
  <text x="124" y="167" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#55c555">Alice</text>
  <text x="204" y="167" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#55c555">IT</text>
  <rect x="66" y="174" width="208" height="22" fill="#111" rx="2"/>
  <text x="84" y="189" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">2</text>
  <text x="124" y="189" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">Bob</text>
  <text x="204" y="189" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">HR</text>
  <rect x="66" y="196" width="208" height="22" fill="#111" rx="2"/>
  <text x="84" y="211" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">3</text>
  <text x="124" y="211" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">Carol</text>
  <text x="204" y="211" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">IT</text>
  <rect x="66" y="218" width="208" height="22" fill="#111" rx="2"/>
  <text x="84" y="233" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">4</text>
  <text x="124" y="233" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">Dave</text>
  <text x="204" y="233" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">IT</text>
  <text x="170" y="262" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">... N행</text>
  <text x="170" y="292" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">행 1 처리 중 (Alice, IT)</text>

  <!-- Arrow: outer to inner -->
  <line x1="290" y1="200" x2="350" y2="200" stroke="#e05555" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="320" y="170" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555" text-anchor="middle">dept='IT'</text>
  <text x="320" y="184" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555" text-anchor="middle">전달</text>

  <!-- Inner subquery -->
  <rect x="350" y="96" width="240" height="214" fill="#131820" rx="8" stroke="#e05555"/>
  <text x="470" y="118" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">서브쿼리 실행 (dept='IT')</text>
  <rect x="366" y="130" width="208" height="96" fill="#000000" rx="6" stroke="#3a4a6e"/>
  <text x="382" y="154" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan> <tspan fill="#7ec8e3" font-weight="600">AVG</tspan>(salary)</text>
  <text x="382" y="173" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan> employees</text>
  <text x="382" y="192" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan> dept = <tspan fill="#ce9178">'IT'</tspan></text>
  <text x="382" y="211" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#55c555">→ 6,200,000</tspan></text>
  <text x="470" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555" text-anchor="middle">외부 행 N개 → N번 실행</text>
  <text x="470" y="272" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">인덱스 있어도 비용 누적</text>
  <text x="470" y="292" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555" text-anchor="middle">⚠ 대용량에서 성능 위험</text>

  <!-- Arrow: result back -->
  <line x1="590" y1="200" x2="650" y2="200" stroke="#55c555" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="620" y="170" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#55c555" text-anchor="middle">결과</text>
  <text x="620" y="184" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#55c555" text-anchor="middle">반환</text>

  <!-- Result box -->
  <rect x="650" y="96" width="180" height="214" fill="#131820" rx="8" stroke="#55c555"/>
  <text x="740" y="118" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">최종 결과</text>
  <rect x="666" y="128" width="148" height="24" fill="#243049" rx="3"/>
  <text x="680" y="144" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">name / dept_avg</text>
  <rect x="666" y="152" width="148" height="22" fill="#0a1e14" rx="2"/>
  <text x="680" y="167" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#55c555">Alice / 6.2M</text>
  <rect x="666" y="174" width="148" height="22" fill="#111" rx="2"/>
  <text x="680" y="189" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">Bob / 4.8M</text>
  <rect x="666" y="196" width="148" height="22" fill="#111" rx="2"/>
  <text x="680" y="211" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">Carol / 6.2M</text>
  <rect x="666" y="218" width="148" height="22" fill="#111" rx="2"/>
  <text x="680" y="233" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#c8ccd4">Dave / 6.2M</text>

  <!-- Bottom: rewrite with join -->
  <rect x="50" y="336" width="780" height="186" fill="#0a180e" rx="8" stroke="#55c555"/>
  <text x="440" y="360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">JOIN으로 변환 — 테이블 1회 스캔</text>
  <rect x="66" y="372" width="748" height="134" fill="#000000" rx="6" stroke="#3a4a6e"/>
  <text x="82" y="396" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan> e.name, da.dept_avg</text>
  <text x="82" y="415" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan> employees e</text>
  <text x="82" y="434" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">JOIN</tspan> (<tspan fill="#7ec8e3" font-weight="600">SELECT</tspan> dept, <tspan fill="#7ec8e3" font-weight="600">AVG</tspan>(salary) dept_avg</text>
  <text x="82" y="453" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">      <tspan fill="#7ec8e3" font-weight="600">FROM</tspan> employees <tspan fill="#7ec8e3" font-weight="600">GROUP BY</tspan> dept) da</text>
  <text x="82" y="472" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">ON</tspan> da.dept = e.dept;</text>
  <text x="82" y="491" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 집계를 1회 수행 후 hash join → O(N) 처리</tspan></text>
</svg>
