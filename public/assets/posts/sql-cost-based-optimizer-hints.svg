<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">
  <rect width="880" height="460" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">잘못된 플랜 대응 — 힌트와 통계 갱신</text>
  <text x="440" y="72" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">통계 갱신이 우선, 힌트는 마지막 수단</text>

  <!-- Left: Statistics update -->
  <rect x="60" y="95" width="360" height="245" fill="#111" rx="8" stroke="#55c555" stroke-width="1"/>
  <text x="240" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555">1순위: 통계 갱신</text>

  <rect x="80" y="132" width="320" height="190" fill="#000000" rx="6" stroke="#3a4a6e"/>
  <text x="96" y="156" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- PostgreSQL</tspan></text>
  <text x="96" y="175" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">ANALYZE</tspan> orders;</text>
  <text x="96" y="213" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- MySQL</tspan></text>
  <text x="96" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">ANALYZE TABLE</tspan> orders;</text>
  <text x="96" y="270" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- Oracle</tspan></text>
  <text x="96" y="289" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">EXEC</tspan> DBMS_STATS.GATHER_TABLE_STATS</text>

  <!-- Right: Hints -->
  <rect x="460" y="95" width="360" height="245" fill="#111" rx="8" stroke="#e05555" stroke-width="1"/>
  <text x="640" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e05555">최후 수단: 옵티마이저 힌트</text>

  <rect x="478" y="132" width="324" height="190" fill="#000000" rx="6" stroke="#3a4a6e"/>
  <text x="494" y="156" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- PostgreSQL (pg_hint_plan)</tspan></text>
  <text x="494" y="175" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">/*+ IndexScan(orders idx) */</tspan></text>
  <text x="494" y="194" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan> * <tspan fill="#7ec8e3" font-weight="600">FROM</tspan> orders;</text>
  <text x="494" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- Oracle</tspan></text>
  <text x="494" y="251" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">/*+ INDEX(orders idx_status) */</tspan></text>
  <text x="494" y="289" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- MySQL</tspan></text>
  <text x="494" y="308" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">USE INDEX</tspan> (idx_status)</text>

  <!-- Warning box -->
  <rect x="60" y="360" width="760" height="76" fill="#1a0e0e" rx="6" stroke="#e05555" stroke-width="1"/>
  <text x="440" y="384" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e05555">힌트 사용 시 주의</text>
  <text x="440" y="406" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">힌트는 스키마 변화·데이터 증가를 반영하지 못해 오히려 성능을 악화시킬 수 있다</text>
  <text x="440" y="424" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">통계 갱신 → 쿼리 재작성 → 인덱스 추가 순으로 시도한 뒤 힌트를 마지막에 검토한다</text>
</svg>
