<svg xmlns="http://www.w3.org/2000/svg" width="880" height="516" viewBox="0 0 880 516">
  <rect width="880" height="516" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8">Playwright 테스트 코드 패턴</text>

  <!-- Left: basic test -->
  <text x="60" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#7ec8e3">기본 E2E 테스트</text>
  <rect x="60" y="94" width="370" height="272" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <!-- Right: network intercept + fixtures -->
  <text x="450" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#7ec8e3">네트워크 인터셉트 + fixture</text>
  <rect x="450" y="94" width="370" height="272" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <!-- Bottom: playwright.config.ts -->
  <text x="60" y="392" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#7ec8e3">playwright.config.ts 핵심 설정</text>
  <rect x="60" y="406" width="760" height="96" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="116" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">import</tspan> { test, expect }</text>
  <text x="76" y="136" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">from</tspan> <tspan fill="#ce9178">'@playwright/test'</tspan></text>
  <text x="76" y="176" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">test(<tspan fill="#ce9178">'로그인 성공'</tspan>, <tspan fill="#7ec8e3" font-weight="600">async</tspan> ({ page }) =&gt; {</text>
  <text x="76" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">await</tspan> page.goto(</text>
  <text x="76" y="216" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    <tspan fill="#ce9178">'http://localhost:3000/login'</tspan>)</text>
  <text x="76" y="236" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">await</tspan> page.fill(<tspan fill="#ce9178">'[name=email]'</tspan>,</text>
  <text x="76" y="256" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    <tspan fill="#ce9178">'alice@test.com'</tspan>)</text>
  <text x="76" y="276" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">await</tspan> page.fill(<tspan fill="#ce9178">'[name=password]'</tspan>,</text>
  <text x="76" y="296" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    <tspan fill="#ce9178">'secret'</tspan>)</text>
  <text x="76" y="316" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">await</tspan> page.click(<tspan fill="#ce9178">'button[type=submit]'</tspan>)</text>
  <text x="76" y="336" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">await</tspan> expect(page).toHaveURL(<tspan fill="#ce9178">'/dashboard'</tspan>)</text>
  <text x="76" y="356" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">})</text>
  <text x="466" y="116" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">// API 응답 목킹</tspan></text>
  <text x="466" y="136" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">await</tspan> page.route(<tspan fill="#ce9178">'**/api/users'</tspan>, route =&gt; {</text>
  <text x="466" y="156" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  route.fulfill({ json: [{ id: <tspan fill="#b5cea8">1</tspan>,</text>
  <text x="466" y="176" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    name: <tspan fill="#ce9178">'Alice'</tspan> }] })</text>
  <text x="466" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">})</text>
  <text x="466" y="236" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">// 스크린샷 · 시각 회귀</tspan></text>
  <text x="466" y="256" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">await</tspan> expect(page).toHaveScreenshot(</text>
  <text x="466" y="276" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#ce9178">'dashboard.png'</tspan></text>
  <text x="466" y="296" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">)</text>
  <text x="76" y="426" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">projects: [</text>
  <text x="76" y="446" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  { name: <tspan fill="#ce9178">'chromium'</tspan>, use: { ...devices[<tspan fill="#ce9178">'Desktop Chrome'</tspan>] } },</text>
  <text x="76" y="466" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  { name: <tspan fill="#ce9178">'firefox'</tspan>, use: { ...devices[<tspan fill="#ce9178">'Desktop Firefox'</tspan>] } },</text>
  <text x="76" y="486" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  { name: <tspan fill="#ce9178">'Mobile Safari'</tspan>, use: { ...devices[<tspan fill="#ce9178">'iPhone 14'</tspan>] } },</text>
</svg>
