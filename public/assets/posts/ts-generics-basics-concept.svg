<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420">
  <defs>
    <marker id="ah7777cc" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/></marker>
  </defs>
  <rect width="880" height="420" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">제네릭 — 타입을 매개변수로 추상화</text>
  <text x="440" y="74" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">T는 함수 호출 시점에 구체적 타입으로 대체된다</text>

  <!-- without generics (left) -->
  <text x="60" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">제네릭 없이 — 중복 코드</text>
  <rect x="60" y="116" width="376" height="172" rx="6" fill="#000000" stroke="#e05555"/>
  <text x="76" y="142" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> firstNumber(arr: </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff">[]): </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff"> {</tspan></text>
  <text x="76" y="160" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  return</tspan><tspan fill="#ffffff"> arr[</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">];</tspan></text>
  <text x="76" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>
  <text x="76" y="214" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> firstString(arr: </tspan><tspan fill="#7ec8e3">string</tspan><tspan fill="#ffffff">[]): </tspan><tspan fill="#7ec8e3">string</tspan><tspan fill="#ffffff"> {</tspan></text>
  <text x="76" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  return</tspan><tspan fill="#ffffff"> arr[</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">];</tspan></text>
  <text x="76" y="250" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>
  <text x="76" y="272" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">타입마다 함수를 복제해야 한다</text>

  <!-- Arrow -->
  <line x1="436" y1="202" x2="487" y2="202" stroke="#7777cc" stroke-width="2" marker-end="url(#ah7777cc)"/>
  <text x="461" y="188" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7777cc">제네릭</text>

  <!-- with generics (right) -->
  <text x="487" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">제네릭 사용 — 하나로 통합</text>
  <rect x="487" y="116" width="333" height="172" rx="6" fill="#000000" stroke="#55c555"/>
  <text x="503" y="142" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> first&lt;T&gt;(arr: T[]): T {</tspan></text>
  <text x="503" y="160" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  return</tspan><tspan fill="#ffffff"> arr[</tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">];</tspan></text>
  <text x="503" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>
  <text x="503" y="214" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// T는 호출 시점에 결정</text>
  <text x="503" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">first([</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">2</tspan><tspan fill="#ffffff">]); </tspan>  <tspan fill="#9aa4b8">// T=number</tspan></text>
  <text x="503" y="250" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">first([</tspan><tspan fill="#ce9178">"a"</tspan><tspan fill="#ffffff">]);   </tspan><tspan fill="#9aa4b8">// T=string</tspan></text>
  <text x="503" y="272" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">T는 추론 또는 명시적으로 결정</text>

  <!-- Bottom: Generic interface and class -->
  <text x="60" y="314" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">제네릭 interface · 클래스</text>
  <rect x="60" y="324" width="760" height="72" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="350" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">interface</tspan><tspan fill="#ffffff"> Wrapper&lt;T&gt; { value: T; unwrap(): T }       </tspan><tspan fill="#7ec8e3">type</tspan><tspan fill="#ffffff"> Pair&lt;A, B&gt; = { fst: A; snd: B };</tspan></text>
  <text x="76" y="368" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">class</tspan><tspan fill="#ffffff"> Stack&lt;T&gt; { </tspan><tspan fill="#7ec8e3">private</tspan><tspan fill="#ffffff"> items: T[] = []; push(item: T) { </tspan><tspan fill="#7ec8e3">this</tspan><tspan fill="#ffffff">.items.push(item) } }</tspan></text>
</svg>
