<svg xmlns="http://www.w3.org/2000/svg" width="880" height="416" viewBox="0 0 880 416">
  <rect width="880" height="416" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">복합 인덱스 컬럼 순서 설계 원칙</text>

  <rect x="60" y="66" width="360" height="142" rx="8" fill="#0d0d0d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="240" y="90" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#7ec8e3">원칙 1: 등호(=) 조건 먼저</text>
  <rect x="72" y="102" width="336" height="94" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="86" y="126" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 좋음: = 먼저, 범위 나중</tspan></text>
  <text x="86" y="145" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">INDEX</tspan> (status, created_at)</text>
  <text x="86" y="164" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 나쁨: 범위 먼저</tspan></text>
  <text x="86" y="183" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">INDEX</tspan> (created_at, status)</text>

  <rect x="460" y="66" width="360" height="142" rx="8" fill="#0d0d0d" stroke="#55c555" stroke-width="1.5"/>
  <text x="640" y="90" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#55c555">원칙 2: 선택도 높은 컬럼 먼저</text>
  <rect x="472" y="102" width="336" height="94" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="486" y="126" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- user_id 선택도 높음 (1/100만)</tspan></text>
  <text x="486" y="145" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- status 선택도 낮음 (1/5)</tspan></text>
  <text x="486" y="164" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">INDEX</tspan> (user_id, status)  <tspan fill="#9aa4b8">-- 권장</tspan></text>
  <text x="486" y="183" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">INDEX</tspan> (status, user_id)  <tspan fill="#9aa4b8">-- 비효율</tspan></text>

  <rect x="60" y="226" width="360" height="142" rx="8" fill="#0d0d0d" stroke="#ce9178" stroke-width="1.5"/>
  <text x="240" y="250" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#ce9178">원칙 3: 쿼리 패턴 매칭</text>
  <rect x="72" y="262" width="336" height="94" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="86" y="286" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 자주 쓰는 WHERE 절 순서 = 인덱스</tspan></text>
  <text x="86" y="305" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan> dept_id=<tspan fill="#b5cea8">1</tspan> <tspan fill="#7ec8e3" font-weight="600">AND</tspan> salary &gt; <tspan fill="#b5cea8">5000</tspan></text>
  <text x="86" y="324" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">→ <tspan fill="#7ec8e3" font-weight="600">INDEX</tspan> (dept_id, salary)</text>
  <text x="86" y="343" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">   등호 dept_id 먼저, 범위 salary 뒤</text>

  <rect x="460" y="226" width="360" height="142" rx="8" fill="#0d0d0d" stroke="#7777cc" stroke-width="1.5"/>
  <text x="640" y="250" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#7777cc">원칙 4: 정렬 컬럼 포함</text>
  <rect x="472" y="262" width="336" height="94" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="486" y="286" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- ORDER BY 정렬 인덱스로 처리</tspan></text>
  <text x="486" y="305" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan> status=<tspan fill="#ce9178">'A'</tspan> <tspan fill="#7ec8e3" font-weight="600">ORDER BY</tspan> created_at</text>
  <text x="486" y="324" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">→ <tspan fill="#7ec8e3" font-weight="600">INDEX</tspan> (status, created_at)</text>
  <text x="486" y="343" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">   filesort 없이 인덱스 순서 활용</text>

  <text x="440" y="400" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">원칙 1(등호 먼저) &gt; 원칙 3(쿼리 패턴) &gt; 원칙 2(선택도) 순으로 우선순위 적용</text>
</svg>
