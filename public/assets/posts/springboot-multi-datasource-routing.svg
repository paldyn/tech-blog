<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <rect width="880" height="480" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">AbstractRoutingDataSource — 자동 라우팅 구현</text>

  <!-- Left: RoutingDataSource class -->
  <text x="220" y="78" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7777cc">RoutingDataSource.java</text>
  <rect x="60" y="90" width="360" height="240" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="114" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">public class</tspan><tspan fill="#ffffff"> RoutingDataSource</tspan></text>
  <text x="76" y="132" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">    extends</tspan><tspan fill="#ffffff"> AbstractRoutingDataSource {</tspan></text>
  <text x="76" y="158" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178">  @Override</text>
  <text x="76" y="176" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  protected</tspan><tspan fill="#ffffff"> Object</tspan></text>
  <text x="76" y="194" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  determineCurrentLookupKey() {</text>
  <text x="76" y="212" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">    boolean</tspan><tspan fill="#ffffff"> isReadOnly =</tspan></text>
  <text x="76" y="230" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">      TransactionSynchronizationManager</text>
  <text x="76" y="248" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">        .isCurrentTransactionReadOnly();</text>
  <text x="76" y="266" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">    return</tspan><tspan fill="#ffffff"> isReadOnly ? </tspan><tspan fill="#ce9178">"replica"</tspan></text>
  <text x="76" y="284" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">                         : </tspan><tspan fill="#ce9178">"primary"</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="76" y="302" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  }</text>
  <text x="76" y="320" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>

  <!-- Right: Config class -->
  <text x="660" y="78" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555">DataSourceConfig.java (Bean 등록)</text>
  <rect x="480" y="90" width="340" height="240" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="496" y="114" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178">@Bean</text>
  <text x="496" y="132" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">public</tspan><tspan fill="#ffffff"> DataSource routingDataSource(</tspan></text>
  <text x="496" y="150" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    DataSource primary,</text>
  <text x="496" y="168" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    DataSource replica) {</text>
  <text x="496" y="186" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  Map targets = </tspan><tspan fill="#7ec8e3">new</tspan><tspan fill="#ffffff"> HashMap();</tspan></text>
  <text x="496" y="204" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  targets.put(</tspan><tspan fill="#ce9178">"primary"</tspan><tspan fill="#ffffff">, primary);</tspan></text>
  <text x="496" y="222" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  targets.put(</tspan><tspan fill="#ce9178">"replica"</tspan><tspan fill="#ffffff">, replica);</tspan></text>
  <text x="496" y="240" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  RoutingDataSource r =</text>
  <text x="496" y="258" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">    new</tspan><tspan fill="#ffffff"> RoutingDataSource();</tspan></text>
  <text x="496" y="276" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  r.setTargetDataSources(targets);</text>
  <text x="496" y="294" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  r.setDefaultTargetDataSource(primary);</text>
  <text x="496" y="312" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  return</tspan><tspan fill="#ffffff"> r; }</tspan></text>

  <!-- Bottom: Usage -->
  <rect x="60" y="350" width="760" height="44" rx="8" fill="#1a1f2e" stroke="#7777cc" stroke-width="1"/>
  <text x="440" y="370" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7777cc">사용 방법 — @Transactional(readOnly = true) 만 붙이면 자동으로 Replica 사용</text>
  <text x="440" y="389" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">@Transactional 기본값은 readOnly=false → Primary DataSource 선택</text>

  <!-- Usage code -->
  <rect x="160" y="410" width="560" height="54" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="176" y="432" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ce9178">@Transactional(readOnly = </tspan><tspan fill="#7ec8e3">true</tspan><tspan fill="#ffffff">)  </tspan><tspan fill="#9aa4b8">// → Replica</tspan></text>
  <text x="176" y="450" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">public</tspan><tspan fill="#ffffff"> List&lt;Order&gt; findAll() { </tspan><tspan fill="#9aa4b8">/* SELECT */ </tspan><tspan fill="#ffffff">}</tspan></text>
</svg>
