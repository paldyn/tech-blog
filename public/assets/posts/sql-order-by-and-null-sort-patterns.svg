<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <rect width="880" height="400" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle" xml:space="preserve">ORDER BY 실전 패턴</text>

  <!-- Left: CASE WHEN for custom sort -->
  <text x="80" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#7ec8e3" xml:space="preserve">CASE로 커스텀 정렬</text>
  <rect x="60" y="96" width="370" height="164" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="118" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 상태 우선순위 직접 지정</text>
  <text x="76" y="136" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">ORDER BY</text>
  <text x="76" y="154" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">  CASE</text>
  <text x="76" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">    WHEN</tspan><tspan fill="#ffffff"> status = </tspan><tspan fill="#ce9178">'urgent'</tspan><tspan fill="#7ec8e3"> THEN</tspan><tspan fill="#b5cea8"> 1</tspan></text>

  <text x="76" y="190" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">    WHEN</tspan><tspan fill="#ffffff"> status = </tspan><tspan fill="#ce9178">'normal'</tspan><tspan fill="#7ec8e3"> THEN</tspan><tspan fill="#b5cea8"> 2</tspan></text>

  <text x="76" y="208" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">    ELSE</tspan><tspan fill="#b5cea8"> 3</tspan></text>
  
  <text x="76" y="226" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">  END</tspan><tspan fill="#ffffff"> ASC, created_at ASC</tspan></text>

  <!-- Right: performance warning -->
  <text x="470" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e05555" xml:space="preserve">ORDER BY 성능 주의</text>
  <rect x="450" y="96" width="370" height="164" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="466" y="118" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- ✗ 함수 사용 → 인덱스 미사용</text>
  <text x="466" y="136" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ORDER BY</tspan><tspan fill="#ffffff"> LOWER(name)</tspan></text>
  <text x="466" y="154" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- ✗ 데이터 많을 때 filesort 발생</text>
  <text x="466" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ORDER BY</tspan><tspan fill="#ffffff"> RAND()</tspan><tspan fill="#9aa4b8"> -- 랜덤 정렬</tspan></text>
  <text x="466" y="190" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- ✓ 인덱스 순서와 ORDER BY 일치</text>
  <text x="466" y="208" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">-- INDEX</tspan><tspan fill="#ffffff"> ON orders(user_id, created_at)</tspan></text>
  <text x="466" y="226" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ORDER BY</tspan><tspan fill="#ffffff"> user_id, created_at</tspan></text>
  <text x="466" y="244" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555" xml:space="preserve">-- → filesort 없이 인덱스 순서 그대로</text>

  <!-- COALESCE for cross-DB NULL sort -->
  <text x="60" y="286" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#7777cc" xml:space="preserve">COALESCE로 크로스-DB NULL 제어</text>
  <rect x="60" y="300" width="760" height="72" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="322" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- MySQL에서 NULL을 ASC 마지막으로 (NULLS LAST 미지원)</text>
  <text x="76" y="340" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ORDER BY</tspan><tspan fill="#ffffff"> COALESCE(score, </tspan><tspan fill="#b5cea8">999999</tspan><tspan fill="#ffffff">) ASC</tspan><tspan fill="#9aa4b8"> -- NULL을 매우 큰 값으로 대체</tspan></text>
  <text x="76" y="358" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 또는: ORDER BY (score IS NULL), score ASC</text>

  <!-- Footer -->
</svg>
