<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 530">
  <rect width="880" height="530" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8">Spring Data R2DBC 핵심 코드</text>

  <!-- Left panel: Entity & Repository -->
  <rect x="60" y="68" width="370" height="444" rx="10" fill="#111827" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="245" y="96" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">엔티티 &amp; 리포지토리</text>
  <line x1="70" y1="106" x2="420" y2="106" stroke="#3a4a6e" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Entity code -->
  <rect x="74" y="116" width="342" height="184" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="88" y="138" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#9aa4b8" xml:space="preserve">// R2DBC 엔티티</text>
  <text x="88" y="157" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">@Table</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#ce9178">"users"</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="88" y="176" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">public record</tspan><tspan fill="#ffffff"> User(</tspan></text>
  <text x="88" y="195" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">@Id</tspan></text>
  <text x="88" y="214" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    Long id,</text>
  <text x="88" y="233" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">@Column</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#ce9178">"user_name"</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="88" y="252" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    String username,</text>
  <text x="88" y="271" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">    String email</text>
  <text x="88" y="290" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">)</text>

  <!-- Repository interface code -->
  <rect x="74" y="310" width="342" height="188" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="88" y="332" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#9aa4b8" xml:space="preserve">// R2DBC 리포지토리</text>
  <text x="88" y="351" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">public interface</tspan><tspan fill="#ffffff"> UserRepository</tspan></text>
  <text x="88" y="370" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    extends</tspan><tspan fill="#ffffff"> ReactiveCrudRepository</tspan></text>
  <text x="88" y="389" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">             &lt;User, Long&gt; {</text>
  <text x="88" y="408" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">Flux</tspan><tspan fill="#ffffff">&lt;User&gt; findByEmail(</tspan></text>
  <text x="102" y="427" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">      String email);</text>
  <text x="88" y="446" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">Mono</tspan><tspan fill="#ffffff">&lt;Boolean&gt; existsByEmail(</tspan></text>
  <text x="102" y="465" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">      String email);</text>
  <text x="88" y="484" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">}</text>

  <!-- Right panel: Service & Transaction -->
  <rect x="450" y="68" width="370" height="444" rx="10" fill="#111827" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="635" y="96" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">서비스 &amp; 트랜잭션</text>
  <line x1="460" y1="106" x2="810" y2="106" stroke="#3a4a6e" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Service code -->
  <rect x="464" y="116" width="342" height="390" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="478" y="138" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#7ec8e3" font-weight="600" xml:space="preserve">@Service</text>
  <text x="478" y="157" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#7ec8e3" font-weight="600" xml:space="preserve">@RequiredArgsConstructor</text>
  <text x="478" y="176" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">public class</tspan><tspan fill="#ffffff"> UserService {</tspan></text>
  <text x="478" y="195" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  private final</tspan><tspan fill="#ffffff"> UserRepository repo;</tspan></text>
  <text x="478" y="224" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#9aa4b8" xml:space="preserve">  // 리액티브 트랜잭션</text>
  <text x="478" y="243" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#7ec8e3" font-weight="600" xml:space="preserve">  @Transactional</text>
  <text x="478" y="262" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  public</tspan><tspan fill="#ffffff"> Mono&lt;User&gt; create(</tspan></text>
  <text x="492" y="281" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">      CreateUserRequest req) {</text>
  <text x="478" y="300" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    return</tspan><tspan fill="#ffffff"> repo.existsByEmail(</tspan></text>
  <text x="492" y="319" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">        req.email())</text>
  <text x="492" y="338" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">      .flatMap(exists -&gt; {</text>
  <text x="492" y="357" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">        if</tspan><tspan fill="#ffffff"> (exists)</tspan></text>
  <text x="492" y="376" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">          return</tspan><tspan fill="#ffffff"> Mono.error(</tspan></text>
  <text x="492" y="395" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">              </tspan><tspan fill="#7ec8e3" font-weight="600">new</tspan><tspan fill="#ffffff"> DupEmailEx());</tspan></text>
  <text x="492" y="414" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">        return</tspan><tspan fill="#ffffff"> repo.save(</tspan></text>
  <text x="492" y="433" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">          req.toEntity());</text>
  <text x="492" y="452" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">      });</text>
  <text x="478" y="471" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">  }</text>
  <text x="478" y="490" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">}</text>
</svg>
