<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <rect width="880" height="420" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">조건 배치 전략 — 성능과 의미</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">WHERE에 넣을 수 있으면 WHERE에 넣어라</text>

  <!-- Anti-pattern -->
  <rect x="60" y="90" width="370" height="290" rx="8" fill="#1a0e0e" stroke="#e05555" stroke-width="1.5"/>
  <text x="245" y="114" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#e05555">안티패턴 — HAVING 오용</text>
  <rect x="72" y="124" width="346" height="126" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="88" y="145" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- ✗ 집계 불필요한 조건을 HAVING에</tspan></text>
  <text x="88" y="163" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> country, SUM(amount)</tspan></text>
  <text x="88" y="181" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff"> orders</tspan></text>
  <text x="88" y="199" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">GROUP BY</tspan><tspan fill="#ffffff"> country</tspan></text>
  <text x="88" y="217" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#e05555" font-weight="600">HAVING</tspan><tspan fill="#ffffff"> country = </tspan><tspan fill="#ce9178">'KR'</tspan></text>
  <text x="88" y="235" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#e05555" font-weight="600">  AND</tspan><tspan fill="#ffffff"> SUM(amount) &gt;= </tspan><tspan fill="#b5cea8">5000</tspan></text>

  <text x="245" y="282" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">모든 국가를 GROUP BY 후 KR만 남김</text>
  <text x="245" y="302" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">불필요한 그룹 생성 비용 발생</text>
  <text x="245" y="322" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">인덱스도 활용 못 함</text>
  <text x="245" y="362" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#e05555">느리고 비효율적</text>

  <!-- Recommended pattern -->
  <rect x="450" y="90" width="370" height="290" rx="8" fill="#0e1a0e" stroke="#55c555" stroke-width="1.5"/>
  <text x="635" y="114" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#55c555">권장 패턴 — WHERE + HAVING</text>
  <rect x="462" y="124" width="346" height="144" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="478" y="145" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- ✓ 행 조건은 WHERE, 집계 조건은 HAVING</tspan></text>
  <text x="478" y="163" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> country, SUM(amount)</tspan></text>
  <text x="478" y="181" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff"> orders</tspan></text>
  <text x="478" y="199" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#55c555" font-weight="600">WHERE</tspan><tspan fill="#ffffff"> country = </tspan><tspan fill="#ce9178">'KR'</tspan></text>
  <text x="478" y="217" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">GROUP BY</tspan><tspan fill="#ffffff"> country</tspan></text>
  <text x="478" y="235" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#55c555" font-weight="600">HAVING</tspan><tspan fill="#ffffff"> SUM(amount) &gt;= </tspan><tspan fill="#b5cea8">5000</tspan></text>
  <text x="478" y="253" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- KR만 필터 후 집계</tspan></text>

  <text x="635" y="296" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">WHERE로 먼저 KR만 필터링</text>
  <text x="635" y="316" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">인덱스 활용 가능</text>
  <text x="635" y="336" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">집계 대상 행 수 줄어 GROUP BY 빠름</text>
  <text x="635" y="362" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#55c555">효율적</text>

</svg>
