<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <rect width="880" height="440" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">타입 어노테이션 — 언제 명시할까</text>
  <text x="440" y="72" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#888">추론 vs 명시 — 상황별 가이드</text>

  <!-- Scenario 1: 추론에 맡기는 경우 (green) -->
  <rect x="20" y="90" width="270" height="334" rx="6" fill="#0d1a0d" stroke="#4caf50" stroke-width="1.5"/>
  <text x="155" y="112" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#4caf50">✓ 추론에 맡기는 경우</text>

  <!-- Scenario 1 code box -->
  <rect x="30" y="122" width="250" height="288" rx="4" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <text x="42" y="143" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">// ✓ 추론 신뢰</text>
  <text x="42" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> x = </tspan><tspan fill="#b5cea8">42</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="42" y="181" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> arr = [</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">2</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">3</tspan><tspan fill="#ffffff">];</tspan></text>
  <text x="42" y="210" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">function</tspan><tspan fill="#ffffff"> add(</tspan></text>
  <text x="42" y="229" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#ffffff">  a: </tspan><tspan fill="#7ec8e3" font-weight="600">number</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="42" y="248" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#ffffff">  b: </tspan><tspan fill="#7ec8e3" font-weight="600">number</tspan></text>
  <text x="42" y="267" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#ffffff">) {</text>
  <text x="42" y="286" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  return</tspan><tspan fill="#ffffff"> a + b;</tspan></text>
  <text x="42" y="305" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#ffffff">}</text>
  <text x="42" y="326" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">// 반환값 자동 추론</text>
  <text x="42" y="345" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">// → number</text>
  <text x="42" y="380" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#4caf50">값이 명확할 때</text>

  <!-- Scenario 2: 어노테이션 필요 (blue) -->
  <rect x="305" y="90" width="270" height="334" rx="6" fill="#0a0d1a" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="112" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#7ec8e3">✓ 어노테이션 필요</text>

  <!-- Scenario 2 code box -->
  <rect x="315" y="122" width="250" height="288" rx="4" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <text x="327" y="143" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">// ✓ 파라미터 명시</text>
  <text x="327" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">function</tspan><tspan fill="#ffffff"> greet(</tspan></text>
  <text x="327" y="181" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#ffffff">  name: </tspan><tspan fill="#7ec8e3" font-weight="600">string</tspan></text>
  <text x="327" y="200" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#ffffff">): </tspan><tspan fill="#7ec8e3" font-weight="600">string</tspan><tspan fill="#ffffff"> {</tspan></text>
  <text x="327" y="219" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  return</tspan><tspan fill="#ffffff"> `Hello, </tspan><tspan fill="#ffffff">${name}`;</tspan></text>
  <text x="327" y="238" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#ffffff">}</text>
  <text x="327" y="267" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">// 빈 배열: 추론 불가</text>
  <text x="327" y="286" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> items: </tspan><tspan fill="#7ec8e3" font-weight="600">string</tspan><tspan fill="#ffffff">[] = [];</tspan></text>
  <text x="327" y="326" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">// null 초기값</text>
  <text x="327" y="345" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">let</tspan><tspan fill="#ffffff"> val: </tspan><tspan fill="#7ec8e3" font-weight="600">string</tspan><tspan fill="#ffffff"> | </tspan><tspan fill="#7ec8e3" font-weight="600">null</tspan></text>
  <text x="327" y="364" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#ffffff">    = </tspan><tspan fill="#7ec8e3" font-weight="600">null</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="327" y="380" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#7ec8e3">초기값으로 추론 불가</text>

  <!-- Scenario 3: 의도 표현 (yellow) -->
  <rect x="590" y="90" width="270" height="334" rx="6" fill="#1a1a0a" stroke="#d4c452" stroke-width="1.5"/>
  <text x="725" y="112" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="700" fill="#d4c452">✓ 명시로 의도 표현</text>

  <!-- Scenario 3 code box -->
  <rect x="600" y="122" width="250" height="288" rx="4" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <text x="612" y="143" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">// ✓ API 경계 명시</text>
  <text x="612" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">export</tspan><tspan fill="#7ec8e3" font-weight="600"> function</tspan></text>
  <text x="612" y="181" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#ffffff">fetchUser(</text>
  <text x="612" y="200" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#ffffff">  id: </tspan><tspan fill="#7ec8e3" font-weight="600">number</tspan></text>
  <text x="612" y="219" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#ffffff">): Promise&lt;User&gt; {</text>
  <text x="612" y="238" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#ffffff">  ...</text>
  <text x="612" y="257" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#ffffff">}</text>
  <text x="612" y="286" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">// 인터페이스 구현</text>
  <text x="612" y="305" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> svc: IService</tspan></text>
  <text x="612" y="324" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" xml:space="preserve"><tspan fill="#ffffff">  = </tspan><tspan fill="#7ec8e3" font-weight="600">new</tspan><tspan fill="#ffffff"> Service();</tspan></text>
  <text x="612" y="353" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">// 타입 오류 조기 발견</text>
  <text x="612" y="372" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">// → 인터페이스 불일치 감지</text>
  <text x="612" y="391" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#d4c452">공개 API / 의도 명확화</text>

</svg>
