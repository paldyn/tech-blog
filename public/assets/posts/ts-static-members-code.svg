<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 380" style="background:#0a0a0a;border-radius:12px">
  <rect width="880" height="380" fill="#0a0a0a" rx="12"/>
  <!-- Title -->
  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">static 멤버 코드 예시</text>

  <!-- Code block -->
  <rect x="60" y="64" width="760" height="282" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <text x="76" y="92" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">class</tspan> IdGenerator {</text>
  <text x="76" y="112" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">static</tspan> <tspan fill="#7ec8e3" font-weight="600">private</tspan> _next = <tspan fill="#b5cea8">1</tspan>;  <tspan fill="#9aa4b8">// 클래스 레벨 상태</tspan></text>
  <text x="76" y="142" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">static</tspan> next(): <tspan fill="#7ec8e3" font-weight="600">number</tspan> {</text>
  <text x="76" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    <tspan fill="#7ec8e3" font-weight="600">return</tspan> IdGenerator._next++;</text>
  <text x="76" y="182" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  }</text>
  <text x="76" y="212" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">static</tspan> reset(): <tspan fill="#7ec8e3" font-weight="600">void</tspan> { IdGenerator._next = <tspan fill="#b5cea8">1</tspan>; }</text>
  <text x="76" y="232" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">}</text>
  <text x="76" y="266" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8">// 인스턴스 없이 클래스 이름으로 직접 호출</tspan></text>
  <text x="76" y="286" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">console.log(IdGenerator.next());  <tspan fill="#9aa4b8">// 1</tspan></text>
  <text x="76" y="306" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">console.log(IdGenerator.next());  <tspan fill="#9aa4b8">// 2</tspan></text>
  <text x="76" y="326" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">console.log(IdGenerator.next());  <tspan fill="#9aa4b8">// 3</tspan></text>
</svg>
