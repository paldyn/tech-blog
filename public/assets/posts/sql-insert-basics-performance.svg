<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370">
  <rect width="880" height="370" fill="#0a0a0a" rx="12"/>
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">INSERT 성능 — 단건 vs 배치</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">네트워크 왕복과 트랜잭션 오버헤드 최소화</text>

  <!-- Visual bars -->
  <rect x="60" y="96" width="760" height="134" rx="10" fill="#111827" stroke="#3a4a6e"/>
  <text x="440" y="118" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e8e8e8">1,000행 삽입 상대 속도 비교</text>
  <!-- Single insert bar -->
  <text x="80" y="145" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">단건 ×1000</text>
  <rect x="200" y="132" width="520" height="20" rx="3" fill="#e05555" opacity="0.8"/>
  <text x="730" y="147" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">100x</text>
  <!-- Batch insert bar -->
  <text x="80" y="181" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">배치 삽입</text>
  <rect x="200" y="168" width="52" height="20" rx="3" fill="#55c555" opacity="0.8"/>
  <text x="260" y="183" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">~10x</text>
  <!-- Copy bar -->
  <text x="80" y="213" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">COPY/LOAD</text>
  <rect x="200" y="200" width="26" height="20" rx="3" fill="#7ec8e3" opacity="0.8"/>
  <text x="234" y="215" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7ec8e3">1x (기준)</text>

  <!-- Code block -->
  <rect x="60" y="252" width="760" height="88" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="80" y="274" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- PostgreSQL: CSV 파일에서 빠른 대량 적재</text>
  <text x="80" y="292" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">COPY</tspan><tspan fill="#ffffff"> products (name, price)</tspan></text>
  <text x="80" y="310" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ce9178"> '/data/products.csv'</tspan></text>
  <text x="80" y="328" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">WITH</tspan><tspan fill="#ffffff"> (FORMAT CSV, HEADER </tspan><tspan fill="#7ec8e3" font-weight="600">TRUE</tspan><tspan fill="#ffffff">);</tspan></text>
</svg>
