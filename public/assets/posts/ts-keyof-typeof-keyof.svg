<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <rect width="880" height="440" fill="#0a0a0a" rx="12"/>
  <text x="440" y="42" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">keyof 연산자</text>
  <text x="440" y="64" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#888">객체 타입의 모든 키를 유니온으로 추출</text>

  <!-- keyof basic -->
  <rect x="60" y="84" width="760" height="140" rx="8" fill="#0d1627" stroke="#7ec8e3" stroke-width="2"/>
  <text x="440" y="110" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3">기본 사용법</text>
  <rect x="74" y="122" width="736" height="90" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="82" y="142" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">interface</tspan> <tspan fill="#ffffff">User { id: </tspan><tspan fill="#7ec8e3" font-weight="600">number</tspan><tspan fill="#ffffff">; name: </tspan><tspan fill="#7ec8e3" font-weight="600">string</tspan><tspan fill="#ffffff">; email: </tspan><tspan fill="#7ec8e3" font-weight="600">string</tspan> <tspan fill="#ffffff">}</tspan></text>
  
  
  
  <text x="82" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">type</tspan> <tspan fill="#ffffff">UserKey = </tspan><tspan fill="#7ec8e3" font-weight="600">keyof</tspan> <tspan fill="#ffffff">User</tspan>  <tspan fill="#9aa4b8">// "id" | "name" | "email"</tspan></text>
  
  
  <text x="82" y="182" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">type</tspan> <tspan fill="#ffffff">AllKey = </tspan><tspan fill="#7ec8e3" font-weight="600">keyof</tspan> <tspan fill="#ffffff">any</tspan>  <tspan fill="#9aa4b8">// string | number | symbol</tspan></text>
  
  

  <!-- keyof practical use: safe getter -->
  <rect x="60" y="244" width="760" height="160" rx="8" fill="#0f0f0f" stroke="#333" stroke-width="1"/>
  <text x="440" y="268" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#888">실용 패턴: 타입 안전 프로퍼티 접근</text>
  <rect x="74" y="280" width="736" height="112" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="82" y="300" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">function</tspan> <tspan fill="#ffffff">getProperty&lt;T, K </tspan><tspan fill="#7ec8e3" font-weight="600">extends</tspan> <tspan fill="#7ec8e3" font-weight="600">keyof</tspan> <tspan fill="#ffffff">T&gt;(</tspan></text>
  
  
  <text x="82" y="320" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">  obj: T, key: K): T[K] {</text>
  <text x="82" y="340" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  return</tspan> <tspan fill="#ffffff">obj[key]</tspan></text>
  <text x="82" y="360" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">}</text>
  <text x="82" y="380" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">getProperty(user, </tspan><tspan fill="#ce9178">"name"</tspan><tspan fill="#ffffff">)        </tspan><tspan fill="#9aa4b8">// string 반환</tspan>  <tspan fill="#9aa4b8">// "invalid" → 컴파일 오류</tspan></text>
  
  
</svg>