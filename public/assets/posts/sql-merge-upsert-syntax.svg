<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" style="background:#0a0a0a;border-radius:12px">
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">MERGE / UPSERT DBMS별 문법</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">표준 MERGE, PostgreSQL ON CONFLICT, MySQL ON DUPLICATE KEY</text>

  <!-- Code block -->
  <rect x="60" y="96" width="760" height="296" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="80" y="118" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 표준 MERGE (Oracle, SQL Server, DB2)</text>
  <text x="80" y="136" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">MERGE INTO</tspan><tspan fill="#ffffff"> inventory tgt</tspan></text>
  <text x="80" y="154" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">USING</tspan><tspan fill="#ffffff"> incoming_stock src</tspan></text>
  <text x="80" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ON</tspan><tspan fill="#ffffff"> (tgt.product_id = src.product_id)</tspan></text>
  <text x="80" y="190" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555" xml:space="preserve">WHEN MATCHED THEN</text>
  <text x="80" y="208" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">    UPDATE SET</text>
  <text x="80" y="226" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">        tgt.stock = tgt.stock + src.qty</text>
  <text x="80" y="244" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555" xml:space="preserve">WHEN NOT MATCHED THEN</text>
  <text x="80" y="262" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">    INSERT</tspan><tspan fill="#ffffff"> (product_id, stock)</tspan></text>
  
  <text x="80" y="280" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">    VALUES</tspan><tspan fill="#ffffff"> (src.product_id, src.qty);</tspan></text>

  <text x="80" y="306" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- PostgreSQL: ON CONFLICT DO UPDATE</text>
  <text x="80" y="324" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">INSERT INTO</tspan><tspan fill="#ffffff"> inventory (product_id, stock)</tspan></text>
  <text x="80" y="342" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">VALUES</tspan><tspan fill="#ffffff"> (</tspan><tspan fill="#b5cea8">101</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">50</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="80" y="360" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555" xml:space="preserve">ON CONFLICT (product_id) DO UPDATE</text>
  <text x="80" y="378" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">    SET</tspan><tspan fill="#ffffff"> stock = inventory.stock + </tspan><tspan fill="#7ec8e3">EXCLUDED</tspan><tspan fill="#ffffff">.stock;</tspan></text>

</svg>
