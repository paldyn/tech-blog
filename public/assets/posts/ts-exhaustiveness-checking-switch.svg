<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <rect width="880" height="480" fill="#0a0a0a" rx="12"/>
  <defs>
    <marker id="arr-r" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <text x="440" y="42" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8">switch 완전성 검사 (Exhaustiveness Checking)</text>
  <text x="440" y="64" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" fill="#888">모든 케이스를 커버했는지 컴파일 타임에 검증</text>

  <!-- Left: Incomplete switch -->
  <rect x="60" y="82" width="360" height="350" rx="8" fill="#1a0a0a" stroke="#e05555" stroke-width="2"/>
  <text x="240" y="110" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#e05555">❌ 미완성 switch</text>

  <rect x="74" y="122" width="332" height="286" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="82" y="142" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">type</tspan> <tspan fill="#ffffff">Shape =</tspan></text>
  <text x="82" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ce9178" xml:space="preserve">  | "circle"</text>
  <text x="82" y="182" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ce9178" xml:space="preserve">  | "square"</text>
  <text x="82" y="202" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ce9178" xml:space="preserve">  | "triangle"</text>
  <text x="82" y="226" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">function</tspan> <tspan fill="#ffffff">area(s: Shape) {</tspan></text>
  <text x="82" y="246" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  switch</tspan><tspan fill="#ffffff">(s) {</tspan></text>
  <text x="82" y="266" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    case</tspan> <tspan fill="#ce9178">"circle"</tspan><tspan fill="#ffffff">:</tspan></text>
  
  <text x="82" y="286" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">      return</tspan> <tspan fill="#b5cea8">3.14</tspan></text>
  <text x="82" y="306" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    case</tspan> <tspan fill="#ce9178">"square"</tspan><tspan fill="#ffffff">:</tspan></text>
  
  <text x="82" y="326" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">      return</tspan> <tspan fill="#b5cea8">1</tspan></text>
  <text x="82" y="346" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#9aa4b8" xml:space="preserve">    // triangle 케이스 누락!</text>
  <text x="82" y="366" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">  }</text>
  <text x="82" y="386" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">}</text>

  <!-- Arrow pointing to missing case -->
  <text x="240" y="424" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#e05555">"triangle" 추가 시 런타임 버그!</text>

  <!-- Right: Complete switch -->
  <rect x="460" y="82" width="360" height="350" rx="8" fill="#0a1a0a" stroke="#55c555" stroke-width="2"/>
  <text x="640" y="110" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#55c555">✅ 완전한 switch</text>

  <rect x="474" y="122" width="332" height="286" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="482" y="142" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">function</tspan> <tspan fill="#ffffff">assertNever(</tspan></text>
  <text x="482" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#ffffff">  x: </tspan><tspan fill="#7ec8e3" font-weight="600">never</tspan><tspan fill="#ffffff">): </tspan><tspan fill="#7ec8e3" font-weight="600">never</tspan></text>
  
  <text x="482" y="182" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#ffffff">{ </tspan><tspan fill="#7ec8e3" font-weight="600">throw</tspan> <tspan fill="#7ec8e3" font-weight="600">new</tspan> <tspan fill="#ffffff">Error(x) }</tspan></text>
  
  <text x="482" y="206" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">switch</tspan><tspan fill="#ffffff">(s) {</tspan></text>
  <text x="482" y="226" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  case</tspan> <tspan fill="#ce9178">"circle"</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#7ec8e3" font-weight="600">return</tspan> <tspan fill="#b5cea8">3.14</tspan></text>
  
  
  <text x="482" y="246" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  case</tspan> <tspan fill="#ce9178">"square"</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#7ec8e3" font-weight="600">return</tspan> <tspan fill="#b5cea8">1</tspan></text>
  
  
  <text x="482" y="266" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  case</tspan> <tspan fill="#ce9178">"triangle"</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#7ec8e3" font-weight="600">return</tspan> <tspan fill="#b5cea8">0.5</tspan></text>
  
  
  <text x="482" y="286" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  default</tspan><tspan fill="#ffffff">:</tspan></text>
  <text x="482" y="306" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    return</tspan> <tspan fill="#ffffff">assertNever(s)</tspan></text>
  <text x="482" y="326" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">  }</text>
  <text x="482" y="346" font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="13" fill="#ffffff" xml:space="preserve">}</text>

  <text x="640" y="424" text-anchor="middle"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#55c555">"rectangle" 추가 시 컴파일 오류로 바로 발견!</text>
</svg>