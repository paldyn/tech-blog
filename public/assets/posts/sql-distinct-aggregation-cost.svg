<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <rect width="880" height="540" fill="#0a0a0a" rx="12"/>
  <defs>
    <marker id="arrC" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arrR" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">COUNT(DISTINCT col) 처리 과정</text>
  <text x="440" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#888" text-anchor="middle">중복 제거 비용과 대안 전략</text>

  <!-- Step 1: Full scan -->
  <rect x="60" y="100" width="200" height="72" fill="#131820" rx="8" stroke="#7ec8e3"/>
  <text x="160" y="123" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3" text-anchor="middle">① 전체 행 읽기</text>
  <text x="160" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">테이블 풀스캔</text>
  <text x="160" y="159" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">N 행</text>

  <!-- Arrow 1 -->
  <line x1="260" y1="136" x2="340" y2="136" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- Step 2: Sort/Hash for dedup -->
  <rect x="340" y="100" width="200" height="72" fill="#131820" rx="8" stroke="#e05555"/>
  <text x="440" y="123" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">② 중복 제거</text>
  <text x="440" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">Sort or Hash</text>
  <text x="440" y="159" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555" text-anchor="middle">O(N log N) 또는 O(N)</text>

  <!-- Arrow 2 -->
  <line x1="540" y1="136" x2="620" y2="136" stroke="#e05555" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- Step 3: Count distinct values -->
  <rect x="620" y="100" width="200" height="72" fill="#131820" rx="8" stroke="#55c555"/>
  <text x="720" y="123" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">③ 고유값 계산</text>
  <text x="720" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">유일 값 집계</text>
  <text x="720" y="159" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">결과: 고유 수</text>

  <!-- Warning: multiple DISTINCT -->
  <rect x="60" y="196" width="760" height="72" fill="#1a0e0e" rx="8" stroke="#e05555"/>
  <text x="440" y="217" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555" text-anchor="middle">⚠ COUNT(DISTINCT a), COUNT(DISTINCT b) 동시 사용 — 중복 소트 2회</text>
  <text x="440" y="239" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" text-anchor="middle">SELECT COUNT(DISTINCT a), COUNT(DISTINCT b) FROM t;</text>
  <text x="440" y="257" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle">각 DISTINCT마다 독립적 정렬 또는 해시 발생 → 컬럼 수만큼 비용 선형 증가</text>

  <!-- Alternatives -->
  <rect x="60" y="290" width="760" height="228" fill="#0d0d0d" rx="8" stroke="#3a4a6e"/>
  <text x="440" y="314" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7777cc" text-anchor="middle">대안 전략</text>

  <!-- Alt 1: Subquery dedup -->
  <rect x="76" y="326" width="236" height="176" fill="#000000" rx="6" stroke="#7777cc"/>
  <text x="194" y="348" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#7777cc" text-anchor="middle">서브쿼리로 사전 중복 제거</text>
  <text x="92" y="374" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan> dept, <tspan fill="#7ec8e3" font-weight="600">COUNT</tspan>(*)</text>
  <text x="92" y="393" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan> (</text>
  <text x="92" y="412" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">SELECT DISTINCT</tspan></text>
  <text x="92" y="431" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    dept, user_id</text>
  <text x="92" y="450" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">FROM</tspan> t</text>
  <text x="92" y="469" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">) d</text>
  <text x="92" y="488" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">GROUP BY</tspan> dept;</text>

  <!-- Alt 2: Approx -->
  <rect x="322" y="326" width="236" height="176" fill="#000000" rx="6" stroke="#55c555"/>
  <text x="440" y="348" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#55c555" text-anchor="middle">근사 함수 (대규모)</text>
  <text x="338" y="374" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- PostgreSQL</tspan></text>
  <text x="338" y="393" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">approx_count_distinct</text>
  <text x="338" y="412" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- BigQuery / Redshift</tspan></text>
  <text x="338" y="431" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">APPROX_COUNT_DISTINCT</text>
  <text x="440" y="460" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">HyperLogLog — 오차 ≤1%</text>

  <!-- Alt 3: Pre-aggregate -->
  <rect x="568" y="326" width="236" height="176" fill="#000000" rx="6" stroke="#7ec8e3"/>
  <text x="686" y="348" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#7ec8e3" text-anchor="middle">사전 집계 테이블/MV 활용</text>
  <text x="584" y="374" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 일별 사전 집계</tspan></text>
  <text x="584" y="393" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CREATE MATERIALIZED VIEW</tspan></text>
  <text x="584" y="412" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  daily_uniq_users <tspan fill="#7ec8e3" font-weight="600">AS</tspan></text>
  <text x="584" y="431" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan> day, dept,</text>
  <text x="584" y="450" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">COUNT</tspan>(<tspan fill="#7ec8e3" font-weight="600">DISTINCT</tspan> user_id)</text>
  <text x="584" y="469" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan> events</text>
  <text x="584" y="488" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">GROUP BY</tspan> <tspan fill="#b5cea8">1</tspan>,<tspan fill="#b5cea8">2</tspan>;</text>
</svg>
