<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">
  <defs>
    <marker id="bcArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="bcArrWarn" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e0a555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="460" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">모든 요청에 같은 예산을 줄 이유가 없다</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">난도를 먼저 싸게 가늠하고, 그 결과로 사고 예산 등급을 정한다</text>

  <rect x="50" y="210" width="180" height="70" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="70" y="232" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">요청 도착</text>
  <text x="70" y="250" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">프롬프트 · 작업 타입</text>
  <text x="70" y="268" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">지연 예산이 함께 온다</text>

  <line x1="230" y1="245" x2="290" y2="245" stroke="#7ec8e3" stroke-width="2" marker-end="url(#bcArr)"/>

  <rect x="290" y="210" width="180" height="70" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="310" y="232" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">난도 신호 수집</text>
  <text x="310" y="250" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">규칙 + 가벼운 분류기</text>
  <text x="310" y="268" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">전체 비용의 1% 미만</text>

  <path d="M 470 235 C 515 235 515 145 560 145" fill="none" stroke="#7ec8e3" stroke-width="2" marker-end="url(#bcArr)"/>
  <line x1="470" y1="245" x2="560" y2="245" stroke="#7ec8e3" stroke-width="2" marker-end="url(#bcArr)"/>
  <path d="M 470 255 C 515 255 515 345 560 345" fill="none" stroke="#7ec8e3" stroke-width="2" marker-end="url(#bcArr)"/>

  <rect x="560" y="110" width="270" height="70" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="582" y="132" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">사고 끔 — 0 토큰</text>
  <text x="582" y="150" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">분류 · 추출 · 포맷 변환 · 라우팅</text>
  <text x="582" y="168" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">지연 최소 · 실제 트래픽의 대부분</text>

  <line x1="600" y1="180" x2="600" y2="210" stroke="#e0a555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#bcArrWarn)"/>

  <rect x="560" y="210" width="270" height="70" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="582" y="232" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">중간 예산 — 2k 토큰</text>
  <text x="582" y="250" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">단계는 여럿이나 정형화된 작업</text>
  <text x="582" y="268" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">SQL 생성 · 요건 정리 · 계획 수립</text>

  <line x1="600" y1="280" x2="600" y2="310" stroke="#e0a555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#bcArrWarn)"/>

  <rect x="560" y="310" width="270" height="70" rx="8" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
  <text x="582" y="332" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7777cc">큰 예산 — 16k 토큰</text>
  <text x="582" y="350" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">난도가 높고 검증이 가능한 작업</text>
  <text x="582" y="368" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">테스트 있는 버그 수정 · 제약 해결</text>

  <text x="50" y="424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e0a555">점선 = 결과 확신이 낮을 때 한 단계 위 예산으로 재시도. 처음부터 큰 예산을 주는 것보다 총비용이 낮다.</text>
</svg>
