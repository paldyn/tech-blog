<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420">
  <defs>
    <marker id="ah7777cc" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/></marker>
  </defs>
  <rect width="880" height="420" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">extends 제약 — T의 범위를 한정한다</text>
  <text x="440" y="74" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">T extends U → T는 반드시 U의 구조를 충족해야 한다</text>

  <!-- Without constraint (left) -->
  <text x="60" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">제약 없음 — 오류 발생</text>
  <rect x="60" y="116" width="360" height="154" rx="6" fill="#000000" stroke="#e05555"/>
  <text x="76" y="142" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> getLength&lt;T&gt;(val: T): </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff"> {</tspan></text>
  <text x="76" y="160" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  return</tspan><tspan fill="#ffffff"> val.length;</tspan></text>
  <text x="76" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">  // TS2339 ❌</text>
  <text x="76" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">  // T에 length가 없을 수도 있다</text>
  <text x="76" y="214" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>
  <text x="76" y="250" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">T에 length 속성이 없으면 런타임 오류</text>

  <!-- Arrow -->
  <line x1="432" y1="193" x2="473" y2="193" stroke="#7777cc" stroke-width="2" marker-end="url(#ah7777cc)"/>
  <text x="449" y="179" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7777cc">extends</text>
  <text x="449" y="193" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#7777cc">제약 추가</text>

  <!-- With constraint (right) -->
  <text x="487" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">extends 제약 — 안전</text>
  <rect x="487" y="116" width="333" height="154" rx="6" fill="#000000" stroke="#55c555"/>
  <text x="503" y="142" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// { length: number }를 가져야 함</text>
  <text x="503" y="160" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> getLength&lt;T </tspan><tspan fill="#7ec8e3">extends</tspan></text>
  <text x="503" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  { length: </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff"> })(val: T): </tspan><tspan fill="#7ec8e3">number</tspan></text>
  <text x="503" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">{</text>
  <text x="503" y="214" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  return</tspan><tspan fill="#ffffff"> val.length;</tspan><tspan fill="#55c555">  // ✅</tspan></text>
  <text x="503" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>
  <text x="503" y="250" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">string, Array, NodeList 등 모두 통과</text>

  <!-- Bottom: keyof operator examples -->
  <text x="60" y="296" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">keyof 연산자와 제약 조합</text>
  <rect x="60" y="306" width="760" height="90" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="332" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// K extends keyof T — T의 키만 허용</text>
  <text x="76" y="350" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> pluck&lt;T, K </tspan><tspan fill="#7ec8e3">extends</tspan><tspan fill="#7ec8e3"> keyof</tspan><tspan fill="#ffffff"> T&gt;(arr: T[], key: K): T[K][] {</tspan><tspan fill="#9aa4b8">   // pluck(users, "name") → string[]</tspan></text>
  <text x="76" y="368" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  return</tspan><tspan fill="#ffffff"> arr.map(item =&gt; item[key]);</tspan></text>
  <text x="76" y="386" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>
</svg>
