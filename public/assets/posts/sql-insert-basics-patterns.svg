<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" style="background:#0a0a0a;border-radius:12px">
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">INSERT 패턴 총정리</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">단일·복수·SELECT 삽입과 ON CONFLICT</text>

  <!-- Code block -->
  <rect x="60" y="96" width="760" height="348" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="80" y="118" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 1. 단일 행 삽입 (컬럼 명시 권장)</text>
  <text x="80" y="136" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">INSERT INTO</tspan><tspan fill="#ffffff"> products (name, price, stock)</tspan></text>
  <text x="80" y="154" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">VALUES</tspan><tspan fill="#ffffff"> (</tspan><tspan fill="#ce9178">'노트북'</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">1500000</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">50</tspan><tspan fill="#ffffff">);</tspan></text>

  <text x="80" y="180" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 2. 복수 행 삽입 (배치 삽입)</text>
  <text x="80" y="198" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">INSERT INTO</tspan><tspan fill="#ffffff"> products (name, price, stock)</tspan></text>
  <text x="80" y="216" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">VALUES</tspan><tspan fill="#ffffff">   (</tspan><tspan fill="#ce9178">'마우스'</tspan><tspan fill="#ffffff">,   </tspan><tspan fill="#b5cea8">35000</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">200</tspan><tspan fill="#ffffff">)</tspan></text>

  <text x="80" y="234" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">         , (</tspan><tspan fill="#ce9178">'키보드'</tspan><tspan fill="#ffffff">,  </tspan><tspan fill="#b5cea8">89000</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">150</tspan><tspan fill="#ffffff">);</tspan></text>

  <text x="80" y="260" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 3. SELECT 결과 삽입 (INSERT INTO ... SELECT)</text>
  <text x="80" y="278" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">INSERT INTO</tspan><tspan fill="#ffffff"> archive_orders (order_id, total)</tspan></text>
  <text x="80" y="296" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> order_id, total</tspan></text>
  <text x="80" y="314" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff">  orders</tspan></text>
  <text x="80" y="332" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan><tspan fill="#ffffff"> created_at &lt; </tspan><tspan fill="#ce9178">'2025-01-01'</tspan><tspan fill="#ffffff">;</tspan></text>

  <text x="80" y="358" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 4. ON CONFLICT (UPSERT) - PostgreSQL</text>
  <text x="80" y="376" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">INSERT INTO</tspan><tspan fill="#ffffff"> user_stats (user_id, login_count)</tspan></text>
  <text x="80" y="394" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">VALUES</tspan><tspan fill="#ffffff"> (</tspan><tspan fill="#b5cea8">101</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">)</tspan></text>
  <text x="80" y="412" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555" xml:space="preserve">ON CONFLICT (user_id) DO UPDATE</text>
  <text x="80" y="430" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">SET</tspan><tspan fill="#ffffff"> login_count = user_stats.login_count + </tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">;</tspan></text>

</svg>
