<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 480">
  <rect width="880" height="480" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">BaseEntity · AuditorAware 구현 예시</text>
  <text x="440" y="65"
        font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" fill="#888" text-anchor="middle">모든 Entity가 상속할 공통 Auditing 상위 클래스와 설정 Bean</text>

  <!-- Left code block: BaseEntity -->
  <rect x="40" y="82" width="370" height="366" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <!-- filename label -->
  <text x="56" y="104"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="11" fill="#9aa4b8" xml:space="preserve">// BaseEntity.java</text>

  <text x="56" y="124" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">@Getter</text>
  <text x="56" y="142" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">@MappedSuperclass</text>
  <text x="56" y="160" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">@EntityListeners(</text>
  <text x="56" y="178" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">    AuditingEntityListener.class)</text>
  <text x="56" y="196" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">public abstract class <tspan fill="#ffffff">BaseEntity</tspan> {</text>
  <text x="56" y="214" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">    // 생성 시각 (최초 1회)</text>
  <text x="56" y="232" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">    @CreatedDate</text>
  <text x="56" y="250" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">    @Column(updatable = false)</text>
  <text x="56" y="268" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">    private <tspan fill="#ffffff">LocalDateTime createdAt;</tspan></text>
  <text x="56" y="286" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">    @LastModifiedDate</text>
  <text x="56" y="304" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">    private <tspan fill="#ffffff">LocalDateTime updatedAt;</tspan></text>
  <text x="56" y="322" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">    @CreatedBy</text>
  <text x="56" y="340" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">    private <tspan fill="#ffffff">String createdBy;</tspan></text>
  <text x="56" y="358" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">    @LastModifiedBy</text>
  <text x="56" y="376" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">    private <tspan fill="#ffffff">String updatedBy;</tspan></text>
  <text x="56" y="394" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">}</text>

  <!-- Right code block: AuditorAware config -->
  <rect x="430" y="82" width="410" height="366" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="446" y="104"
        font-family="'JetBrains Mono','Menlo','Consolas',monospace"
        font-size="11" fill="#9aa4b8" xml:space="preserve">// JpaAuditingConfig.java</text>

  <text x="446" y="124" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">@Configuration</text>
  <text x="446" y="142" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">@EnableJpaAuditing(</text>
  <text x="446" y="160" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">  auditorAwareRef = <tspan fill="#ce9178">"auditorProvider"</tspan>)</text>
  <text x="446" y="178" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">public class <tspan fill="#ffffff">JpaAuditingConfig</tspan> {</text>
  <text x="446" y="214" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">    @Bean</text>
  <text x="446" y="232" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">    public <tspan fill="#ffffff">AuditorAware&lt;String&gt;</tspan></text>
  <text x="446" y="250" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">            auditorProvider() {</text>
  <text x="446" y="268" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">        return <tspan fill="#ffffff">() -&gt; {</tspan></text>
  <text x="446" y="286" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">          var auth <tspan fill="#ffffff">= SecurityContextHolder</tspan></text>
  <text x="446" y="304" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">            .getContext().getAuthentication();</text>
  <text x="446" y="322" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">          if <tspan fill="#ffffff">(auth == null</tspan></text>
  <text x="446" y="340" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">              || !auth.isAuthenticated())</text>
  <text x="446" y="358" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">              return <tspan fill="#ffffff">Optional.empty();</tspan></text>
  <text x="446" y="376" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">          return <tspan fill="#ffffff">Optional.of(auth.getName());</tspan></text>
  <text x="446" y="394" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">        };</text>
  <text x="446" y="412" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">    }</text>
  <text x="446" y="430" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">}</text>
</svg>
