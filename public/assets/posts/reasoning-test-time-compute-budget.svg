  <text x="72" y="256" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">16회 병렬 호출 · 각 1단위</text>
  <text x="72" y="274" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">병렬 확장 (parallel)</text>
