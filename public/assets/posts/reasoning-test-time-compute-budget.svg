<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <rect x="0" y="0" width="880" height="480" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">같은 예산 16단위를 어디에 쓸 것인가</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">칸 하나가 컴퓨트 1단위. 총량이 같아도 배분 방식에 따라 지연과 필요 부품이 완전히 달라진다</text>

  <rect x="50" y="100" width="250" height="76" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="72" y="124" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">깊게 한 번</text>
  <text x="72" y="146" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">1회 호출 · 사고 예산 16단위</text>
