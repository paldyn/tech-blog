  <text x="340" y="388" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">지연 4배 · 서로 다른 접근 4개 확보 · 판별 부담도 4개로 줄어든다</text>

  <text x="50" y="442" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">예산을 늘리기 전에 먼저 물어야 할 것: 지연 예산은 얼마이고, 후보를 고를 기준은 무엇인가.</text>
