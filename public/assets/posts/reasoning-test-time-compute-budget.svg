  <text x="340" y="168" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">한 갈래를 끝까지 판다 · 지연이 16배로 그대로 늘어난다</text>

  <rect x="50" y="210" width="250" height="76" rx="8" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
