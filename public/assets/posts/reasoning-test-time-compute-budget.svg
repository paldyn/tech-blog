  <text x="340" y="278" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">지연은 1회분 · 대신 16개 중 하나를 고를 판별 장치가 필요하다</text>

  <rect x="50" y="320" width="250" height="76" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="72" y="344" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">절충</text>
