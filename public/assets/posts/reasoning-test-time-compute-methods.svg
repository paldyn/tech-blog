  <text x="50" y="432" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">세 방식 모두 &quot;좋은 후보를 알아보는 능력&quot;에 기대고 있다. 판별이 안 되면 컴퓨트만 늘고 정확도는 그대로다.</text>
