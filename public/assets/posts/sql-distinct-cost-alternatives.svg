<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
  <rect width="880" height="380" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle" xml:space="preserve">DISTINCT 대안 패턴</text>

  <!-- Left: DISTINCT vs GROUP BY -->
  <text x="80" y="80" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e05555" xml:space="preserve">DISTINCT (피해야 할 패턴)</text>
  <rect x="60" y="94" width="370" height="130" rx="6" fill="#000000" stroke="#e05555" stroke-width="1"/>
  <text x="76" y="116" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8">-- DISTINCT로 JOIN 중복 제거</tspan></text>
  <text x="76" y="134" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">SELECT DISTINCT</tspan> u.id, u.name</text>
  <text x="76" y="152" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan> users u</text>
  <text x="76" y="170" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">JOIN</tspan> orders o</text>
  <text x="76" y="188" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">ON</tspan> o.user_id = u.id</text>
  <text x="76" y="206" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#e05555">-- ✗ JOIN 후 전체 정렬 → 비효율</text>

  <!-- Right: EXISTS / subquery -->
  <text x="470" y="80" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555" xml:space="preserve">EXISTS 대안 (효율적)</text>
  <rect x="450" y="94" width="370" height="130" rx="6" fill="#000000" stroke="#55c555" stroke-width="1"/>
  <text x="466" y="116" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8">-- EXISTS: 첫 매칭 발견 즉시 멈춤</tspan></text>
  <text x="466" y="134" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan> u.id, u.name</text>
  <text x="466" y="152" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan> users u</text>
  <text x="466" y="170" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">WHERE EXISTS</tspan> (</text>
  <text x="466" y="188" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    <tspan fill="#7ec8e3" font-weight="600">SELECT</tspan> <tspan fill="#b5cea8">1</tspan> <tspan fill="#7ec8e3" font-weight="600">FROM</tspan> orders o</text>
  <text x="466" y="206" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    <tspan fill="#7ec8e3" font-weight="600">WHERE</tspan> o.user_id = u.id );</text>

  <!-- Bottom: GROUP BY vs COUNT DISTINCT -->
  <rect x="60" y="244" width="760" height="106" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="264" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8">-- COUNT DISTINCT: 집계 함수 내 중복 제거 (비용 있음)</tspan></text>
  <text x="76" y="282" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan> dept, <tspan fill="#7ec8e3" font-weight="600">COUNT</tspan>(<tspan fill="#7ec8e3" font-weight="600">DISTINCT</tspan> job_title) <tspan fill="#7ec8e3" font-weight="600">AS</tspan> unique_titles</text>
  <text x="76" y="300" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan> employees <tspan fill="#7ec8e3" font-weight="600">GROUP BY</tspan> dept;</text>
  <text x="76" y="318" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8">-- GROUP BY도 DISTINCT와 동일 비용 (내부적으로 같은 알고리즘)</tspan></text>
  <text x="76" y="336" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#55c555">-- DISTINCT를 써야 할 때: 단순 중복 제거, 진짜 필요한 경우만</text>

</svg>
