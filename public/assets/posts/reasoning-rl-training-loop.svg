<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450">
  <defs>
    <marker id="rlArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="rlArrGreen" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="450" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">검증 가능한 보상으로 도는 학습 루프</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">사람의 라벨 없이, 채점 가능한 문제만으로 사고 패턴을 학습시킨다</text>

  <rect x="50" y="130" width="220" height="70" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="72" y="152" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">① 문제 배치 샘플링</text>
  <text x="72" y="170" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">정답 채점이 가능한 문제만</text>
  <text x="72" y="188" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">수학 · 코드 · 구조 출력</text>

  <line x1="270" y1="165" x2="330" y2="165" stroke="#7ec8e3" stroke-width="2" marker-end="url(#rlArr)"/>

  <rect x="330" y="130" width="220" height="70" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="352" y="152" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">② 롤아웃 G개 생성</text>
  <text x="352" y="170" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">같은 문제를 G번 풀게 한다</text>
  <text x="352" y="188" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">온도를 올려 다양성 확보</text>

  <line x1="550" y1="165" x2="610" y2="165" stroke="#7ec8e3" stroke-width="2" marker-end="url(#rlArr)"/>

  <rect x="610" y="130" width="220" height="70" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="632" y="152" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">③ 검증기 채점</text>
  <text x="632" y="170" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">실행 · 대조로 0/1 보상 부여</text>
  <text x="632" y="188" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">사람 라벨러가 개입하지 않음</text>

  <line x1="720" y1="200" x2="720" y2="290" stroke="#7ec8e3" stroke-width="2" marker-end="url(#rlArr)"/>

  <rect x="610" y="290" width="220" height="70" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="632" y="312" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">④ 그룹 내 상대 우위</text>
  <text x="632" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">G개 평균보다 잘한 쪽에 +</text>
  <text x="632" y="348" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">별도 가치 모델이 필요 없다</text>

  <line x1="610" y1="325" x2="550" y2="325" stroke="#7ec8e3" stroke-width="2" marker-end="url(#rlArr)"/>

  <rect x="330" y="290" width="220" height="70" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="352" y="312" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">⑤ 정책 그래디언트</text>
  <text x="352" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">좋은 궤적의 확률을 높인다</text>
  <text x="352" y="348" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">KL 항으로 급변을 억제</text>

  <line x1="330" y1="325" x2="270" y2="325" stroke="#7ec8e3" stroke-width="2" marker-end="url(#rlArr)"/>

  <rect x="50" y="290" width="220" height="70" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="72" y="312" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">⑥ 가중치 업데이트</text>
  <text x="72" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">사고 길이가 스스로 늘어난다</text>
  <text x="72" y="348" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">되돌아가기 패턴이 출현</text>

  <line x1="160" y1="290" x2="160" y2="200" stroke="#55c555" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#rlArrGreen)"/>
  <text x="178" y="249" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">다음 배치로</text>

  <text x="50" y="404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">이 루프가 성립하려면 ③이 값싸고 정확해야 한다. 채점이 애매한 문제를 넣는 순간 학습은 엉뚱한 방향으로 간다.</text>
</svg>
