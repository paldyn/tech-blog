<svg width="880" height="570" viewBox="0 0 880 570" xmlns="http://www.w3.org/2000/svg" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect width="880" height="570" rx="12" fill="#0a0a0a"/>

  <text x="440" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">Supabase 아키텍처 — PostgreSQL 중심의 조립식 백엔드</text>

  <!-- 클라이언트 -->
  <rect x="50" y="210" width="150" height="110" rx="10" fill="#151515" stroke="#333333" stroke-width="1.5"/>
  <text x="125" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#e8e8e8">클라이언트</text>
  <text x="125" y="270" text-anchor="middle" font-size="11" fill="#888">웹 · 모바일 앱</text>
  <text x="125" y="292" text-anchor="middle" font-size="11" fill="#7ec8e3">supabase-js SDK</text>

  <!-- Supabase 플랫폼 컨테이너 -->
  <rect x="290" y="100" width="290" height="400" rx="12" fill="#0f1512" stroke="#2a4a35" stroke-width="1.5"/>
  <text x="435" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#55c555">Supabase</text>

  <rect x="310" y="145" width="250" height="70" rx="8" fill="#151515" stroke="#333333" stroke-width="1"/>
  <text x="435" y="173" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">Auth — 인증</text>
  <text x="435" y="195" text-anchor="middle" font-size="11" fill="#888">소셜 로그인 · JWT 발급</text>

  <rect x="310" y="232" width="250" height="70" rx="8" fill="#151515" stroke="#333333" stroke-width="1"/>
  <text x="435" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">REST API — PostgREST</text>
  <text x="435" y="282" text-anchor="middle" font-size="11" fill="#888">테이블마다 API 자동 생성</text>

  <rect x="310" y="319" width="250" height="70" rx="8" fill="#151515" stroke="#333333" stroke-width="1"/>
  <text x="435" y="347" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">Realtime</text>
  <text x="435" y="369" text-anchor="middle" font-size="11" fill="#888">WAL 구독 → 변경 브로드캐스트</text>

  <rect x="310" y="406" width="250" height="70" rx="8" fill="#151515" stroke="#333333" stroke-width="1"/>
  <text x="435" y="434" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">Storage</text>
  <text x="435" y="456" text-anchor="middle" font-size="11" fill="#888">파일 저장 · CDN 서빙</text>

  <!-- PostgreSQL -->
  <rect x="660" y="145" width="170" height="331" rx="10" fill="#10161c" stroke="#55c555" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <text x="745" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">PostgreSQL</text>
  <text x="745" y="320" text-anchor="middle" font-size="11" fill="#888">단일 진실 공급원</text>
  <text x="745" y="338" text-anchor="middle" font-size="11" fill="#888">RLS로 접근 제어</text>

  <!-- 화살표 -->
  <line x1="200" y1="265" x2="289" y2="265" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="560" y1="180" x2="659" y2="180" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="560" y1="267" x2="659" y2="267" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="560" y1="354" x2="659" y2="354" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="560" y1="441" x2="659" y2="441" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- 데이터 흐름 애니메이션 -->
  <circle r="4" fill="#55c555" opacity="0.9">
    <animateMotion path="M 204 265 L 282 265" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#55c555" opacity="0.9">
    <animateMotion path="M 564 180 L 652 180" dur="1.8s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#55c555" opacity="0.9">
    <animateMotion path="M 564 267 L 652 267" dur="1.8s" begin="0.45s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#55c555" opacity="0.9">
    <animateMotion path="M 564 354 L 652 354" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#55c555" opacity="0.9">
    <animateMotion path="M 564 441 L 652 441" dur="1.8s" begin="1.35s" repeatCount="indefinite"/>
  </circle>

  <text x="440" y="536" text-anchor="middle" font-size="12" fill="#888">테이블 하나를 만들면 REST API · 실시간 구독 · 권한 제어가 즉시 따라온다</text>
</svg>
