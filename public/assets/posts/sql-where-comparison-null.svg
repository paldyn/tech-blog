<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <rect width="880" height="420" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle" xml:space="preserve">NULL 비교의 함정 — 3값 논리 (Three-Valued Logic)</text>

  <!-- 3VL explanation -->
  <rect x="60" y="66" width="760" height="60" rx="8" fill="#1a1a0a" stroke="#e8a800" stroke-width="1.5"/>
  <text x="440" y="90" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#e8a800" text-anchor="middle" xml:space="preserve">SQL의 비교 연산 결과는 TRUE / FALSE / UNKNOWN (NULL 포함 시) 세 가지다</text>
  <text x="440" y="114" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle" xml:space="preserve">WHERE 절은 TRUE인 행만 통과시킨다 — UNKNOWN은 FALSE처럼 동작한다</text>

  <!-- Left: NULL trap -->
  <text x="80" y="158" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e05555" xml:space="preserve">흔한 함정</text>
  <rect x="60" y="172" width="370" height="146" rx="6" fill="#000000" stroke="#e05555" stroke-width="1"/>
  <text x="76" y="194" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- ✗ NULL = NULL → UNKNOWN (행 제외)</text>
  <text x="76" y="212" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">WHERE</tspan><tspan fill="#ffffff"> deleted_at = </tspan><tspan fill="#b5cea8">NULL</tspan><tspan fill="#e05555"> -- ✗ 0행</tspan></text>
  <text x="76" y="230" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- ✗ NULL &lt;&gt; NULL → UNKNOWN</text>
  <text x="76" y="248" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">WHERE</tspan><tspan fill="#ffffff"> deleted_at != </tspan><tspan fill="#b5cea8">NULL</tspan><tspan fill="#e05555"> -- ✗ 0행</tspan></text>
  <text x="76" y="266" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- NULL과의 모든 산술/비교 → NULL</text>
  <text x="76" y="284" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">SELECT</tspan><tspan fill="#b5cea8"> NULL</tspan><tspan fill="#ffffff"> + </tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">;</tspan><tspan fill="#9aa4b8"> -- → NULL</tspan></text>
  <text x="76" y="302" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- CONCAT('a', NULL) → NULL (표준)</text>

  <!-- Right: correct usage -->
  <text x="470" y="158" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555" xml:space="preserve">올바른 NULL 처리</text>
  <rect x="450" y="172" width="370" height="146" rx="6" fill="#000000" stroke="#55c555" stroke-width="1"/>
  <text x="466" y="194" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- ✓ IS NULL / IS NOT NULL 사용</text>
  <text x="466" y="212" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">WHERE</tspan><tspan fill="#ffffff"> deleted_at </tspan><tspan fill="#7ec8e3">IS NULL</tspan><tspan fill="#55c555"> -- ✓</tspan></text>
  <text x="466" y="230" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">WHERE</tspan><tspan fill="#ffffff"> deleted_at </tspan><tspan fill="#7ec8e3">IS NOT NULL</tspan><tspan fill="#55c555"> -- ✓</tspan></text>
  <text x="466" y="248" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- COALESCE로 NULL 대체</text>
  <text x="466" y="266" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">WHERE</tspan><tspan fill="#ffffff"> COALESCE(score, </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">) &gt; </tspan><tspan fill="#b5cea8">60</tspan></text>
  <text x="466" y="284" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- &lt;=&gt; (MySQL): NULL-safe equal</text>
  <text x="466" y="302" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff"> col </tspan><tspan fill="#7ec8e3">&lt;=&gt;</tspan><tspan fill="#b5cea8"> NULL</tspan><tspan fill="#9aa4b8"> -- MySQL TRUE</tspan></text>

  <!-- Summary -->
  <rect x="60" y="338" width="760" height="40" rx="6" fill="#0a1020" stroke="#7ec8e3" stroke-width="1"/>
  <text x="440" y="361" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3" text-anchor="middle" xml:space="preserve">NULL 비교는 반드시 IS NULL / IS NOT NULL — = NULL은 항상 0행을 반환한다</text>

  <!-- Footer -->
</svg>
