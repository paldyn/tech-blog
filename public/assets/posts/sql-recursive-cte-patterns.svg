<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430">
  <rect width="880" height="430" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">재귀 CTE 활용 패턴</text>

  <rect x="50" y="70" width="250" height="330" fill="#0d0d0d" rx="8" stroke="#55c555"/>
  <text x="175" y="94" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#55c555" text-anchor="middle">날짜 시리즈 생성</text>
  <rect x="60" y="104" width="230" height="200" fill="#000000" rx="6" stroke="#3a4a6e"/>
  <text x="72" y="127" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">WITH RECURSIVE</tspan></text>
  <text x="72" y="145" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">dates </tspan><tspan fill="#7ec8e3" font-weight="600">AS</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="72" y="163" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  SELECT</tspan></text>
  <text x="72" y="181" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">    DATE</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ce9178">'2025-01-01'</tspan><tspan fill="#ffffff"> d</tspan></text>
  <text x="72" y="199" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  UNION ALL</tspan></text>
  <text x="72" y="217" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  SELECT</tspan><tspan fill="#ffffff"> d+</tspan><tspan fill="#b5cea8">1</tspan></text>
  <text x="72" y="235" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  FROM</tspan><tspan fill="#ffffff"> dates</tspan></text>
  <text x="72" y="253" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  WHERE</tspan><tspan fill="#ffffff"> d &lt; </tspan><tspan fill="#ce9178">'2025-12-31'</tspan></text>
  <text x="72" y="271" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">)</tspan></text>
  <text x="72" y="289" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> * </tspan><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff"> dates;</tspan></text>
  <text x="175" y="328" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">연속 날짜 목록 생성</text>
  <text x="175" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">generate_series() 대안</text>

  <rect x="315" y="70" width="250" height="330" fill="#0d0d0d" rx="8" stroke="#7777cc"/>
  <text x="440" y="94" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#7777cc" text-anchor="middle">경로 문자열 누적</text>
  <rect x="325" y="104" width="230" height="236" fill="#000000" rx="6" stroke="#3a4a6e"/>
  <text x="337" y="127" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">WITH RECURSIVE</tspan></text>
  <text x="337" y="145" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">tree </tspan><tspan fill="#7ec8e3" font-weight="600">AS</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="337" y="163" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  SELECT</tspan><tspan fill="#ffffff"> id, name,</tspan></text>
  <text x="337" y="181" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    name::text path</tspan></text>
  <text x="337" y="199" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  FROM</tspan><tspan fill="#ffffff"> cat</tspan></text>
  <text x="337" y="217" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  WHERE</tspan><tspan fill="#ffffff"> pid </tspan><tspan fill="#7ec8e3" font-weight="600">IS NULL</tspan></text>
  <text x="337" y="235" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  UNION ALL</tspan></text>
  <text x="337" y="253" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  SELECT</tspan><tspan fill="#ffffff"> c.id, c.name,</tspan></text>
  <text x="337" y="271" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    t.path||</tspan><tspan fill="#ce9178">'/'</tspan><tspan fill="#ffffff">||c.name</tspan></text>
  <text x="337" y="289" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  FROM</tspan><tspan fill="#ffffff"> cat c </tspan><tspan fill="#7ec8e3" font-weight="600">JOIN</tspan><tspan fill="#ffffff"> tree t</tspan></text>
  <text x="337" y="307" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">    ON</tspan><tspan fill="#ffffff"> c.pid=t.id</tspan></text>
  <text x="337" y="325" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">)</tspan></text>
  <text x="440" y="364" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">카테고리 전체 경로 누적</text>
  <text x="440" y="382" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">전자 &gt; 스마트폰 &gt; 갤럭시</text>

  <rect x="580" y="70" width="250" height="330" fill="#0d0d0d" rx="8" stroke="#e05555"/>
  <text x="705" y="94" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#e05555" text-anchor="middle">무한 루프 방지</text>
  <rect x="590" y="104" width="230" height="182" fill="#000000" rx="6" stroke="#3a4a6e"/>
  <text x="602" y="127" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- 순환 감지 컬럼 추가</tspan></text>
  <text x="602" y="145" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">WITH RECURSIVE</tspan></text>
  <text x="602" y="163" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">graph </tspan><tspan fill="#7ec8e3" font-weight="600">AS</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="602" y="181" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  SELECT</tspan><tspan fill="#ffffff"> id,</tspan></text>
  <text x="602" y="199" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">    ARRAY</tspan><tspan fill="#ffffff">[id] visited</tspan></text>
  <text x="602" y="217" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  ...</tspan></text>
  <text x="602" y="235" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  WHERE NOT</tspan><tspan fill="#ffffff"> (next_id</tspan></text>
  <text x="602" y="253" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    = </tspan><tspan fill="#7ec8e3" font-weight="600">ANY</tspan><tspan fill="#ffffff">(visited))</tspan></text>
  <text x="602" y="271" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">)</tspan></text>
  <text x="705" y="310" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555" text-anchor="middle">순환 그래프에서 필수</text>
  <text x="705" y="328" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">방문 배열로 사이클 감지</text>
  <text x="705" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555" text-anchor="middle">또는 MAXRECURSION 제한</text>
  <text x="705" y="364" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">SQL:2023 CYCLE 절</text>
  <text x="705" y="382" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888" text-anchor="middle">(PostgreSQL 14+ 지원)</text>
</svg>
