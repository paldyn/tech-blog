<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <defs>
    <marker id="arrG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="arrR" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
    <marker id="arrN" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="880" height="470" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">COALESCE · NULLIF · NVL · IFNULL</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">NULL 처리 함수 비교</text>

  <!-- COALESCE box -->
  <rect x="60" y="90" width="360" height="280" rx="6" fill="#0e1117" stroke="#55c555" stroke-width="1.5"/>
  <text x="240" y="113" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555">COALESCE(v1, v2, ..., vN)</text>
  <line x1="60" y1="122" x2="420" y2="122" stroke="#3a4a6e"/>
  <text x="240" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">첫 번째 non-NULL 값 반환 (SQL 표준)</text>

  <!-- row v1 -->
  <rect x="80" y="163" width="60" height="30" rx="4" fill="#1a2a1a" stroke="#55c555"/>
  <text x="110" y="182" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">v1</text>
  <line x1="140" y1="178" x2="156" y2="178" stroke="#888" stroke-width="1.5" marker-end="url(#arrN)"/>
  <polygon points="200,160 244,178 200,196 156,178" fill="#111520" stroke="#7ec8e3"/>
  <text x="200" y="182" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#7ec8e3">NULL?</text>
  <line x1="244" y1="178" x2="290" y2="178" stroke="#55c555" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="267" y="164" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#55c555">NO</text>
  <rect x="290" y="166" width="80" height="24" rx="3" fill="#0a1a0a" stroke="#55c555" stroke-opacity="0.5"/>
  <text x="330" y="182" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#55c555">v1 반환</text>

  <line x1="200" y1="196" x2="200" y2="228" stroke="#e05555" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="212" y="216" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#e05555">YES</text>

  <!-- row v2 -->
  <rect x="80" y="231" width="60" height="30" rx="4" fill="#1a2a1a" stroke="#55c555"/>
  <text x="110" y="250" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">v2</text>
  <line x1="140" y1="246" x2="156" y2="246" stroke="#888" stroke-width="1.5" marker-end="url(#arrN)"/>
  <polygon points="200,228 244,246 200,264 156,246" fill="#111520" stroke="#7ec8e3"/>
  <text x="200" y="250" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#7ec8e3">NULL?</text>
  <line x1="244" y1="246" x2="290" y2="246" stroke="#55c555" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="267" y="232" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#55c555">NO</text>
  <rect x="290" y="234" width="80" height="24" rx="3" fill="#0a1a0a" stroke="#55c555" stroke-opacity="0.5"/>
  <text x="330" y="250" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#55c555">v2 반환</text>

  <line x1="200" y1="264" x2="200" y2="290" stroke="#e05555" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="212" y="282" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#e05555">YES</text>
  <text x="200" y="304" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">... 계속 평가 ...</text>

  <text x="240" y="326" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">모두 NULL → NULL 반환</text>
  <text x="240" y="343" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">COALESCE(a,b) =</text>
  <text x="240" y="358" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">CASE WHEN a IS NOT NULL THEN a ELSE b END</text>

  <!-- NULLIF box -->
  <rect x="460" y="90" width="360" height="280" rx="6" fill="#0e1117" stroke="#7777cc" stroke-width="1.5"/>
  <text x="640" y="113" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7777cc">NULLIF(v1, v2)</text>
  <line x1="460" y1="122" x2="820" y2="122" stroke="#3a4a6e"/>
  <text x="640" y="142" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">v1 = v2 이면 NULL 반환, 아니면 v1 반환</text>

  <rect x="486" y="163" width="70" height="30" rx="4" fill="#18102a" stroke="#7777cc"/>
  <text x="521" y="182" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7777cc">v1, v2</text>
  <line x1="556" y1="178" x2="592" y2="178" stroke="#888" stroke-width="1.5" marker-end="url(#arrN)"/>
  <polygon points="592,178 640,160 688,178 640,196" fill="#111520" stroke="#7777cc"/>
  <text x="640" y="182" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#7777cc">v1=v2?</text>
  <line x1="688" y1="178" x2="730" y2="178" stroke="#55c555" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="709" y="164" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#55c555">NO</text>
  <rect x="730" y="166" width="70" height="24" rx="3" fill="#0a1a0a" stroke="#55c555" stroke-opacity="0.5"/>
  <text x="765" y="182" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#55c555">v1 반환</text>

  <line x1="640" y1="196" x2="640" y2="226" stroke="#e05555" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="652" y="216" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="10" fill="#e05555">YES</text>
  <rect x="590" y="226" width="100" height="28" rx="3" fill="#1a0a0a" stroke="#e05555" stroke-opacity="0.5"/>
  <text x="640" y="245" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#e05555">NULL 반환</text>

  <text x="640" y="284" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">활용: 0 나누기 방지</text>
  <text x="640" y="304" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">v1 / NULLIF(v2, 0)</text>
  <text x="640" y="324" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">→ v2=0 이면 NULL, 계산 오류 방지</text>
  <text x="640" y="350" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">= CASE WHEN v1=v2 THEN NULL ELSE v1 END</text>

  <!-- Bottom function comparison -->
  <rect x="60" y="390" width="760" height="52" rx="6" fill="#0e1117" stroke="#3a4a6e"/>
  <text x="175" y="411" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">NVL(a,b) — Oracle 전용</text>
  <text x="175" y="429" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">= COALESCE(a,b) 동일</text>
  <line x1="290" y1="390" x2="290" y2="442" stroke="#3a4a6e"/>
  <text x="440" y="411" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">IFNULL(a,b) — MySQL 전용</text>
  <text x="440" y="429" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">= COALESCE(a,b) 동일</text>
  <line x1="590" y1="390" x2="590" y2="442" stroke="#3a4a6e"/>
  <text x="705" y="411" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7ec8e3">COALESCE — SQL 표준</text>
  <text x="705" y="429" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">모든 주요 DB 지원</text>
</svg>
