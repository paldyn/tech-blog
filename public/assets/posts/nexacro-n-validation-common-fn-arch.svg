<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460">
  <defs>
    <marker id="arrGreen" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 14 14" refX="12" refY="7"
            markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect width="880" height="460" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">gfn_validate() 공통 함수 아키텍처</text>
  <text x="440" y="68" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="400" fill="#888" text-anchor="middle">규칙 배열 선언 → 공통 함수 위임 → 실패 시 포커스 이동</text>

  <!-- 화면 폼 (왼쪽) -->
  <rect x="60" y="96" width="292" height="320" fill="#0e1a2a" rx="8" stroke="#2a4a7a" stroke-width="1.5"/>
  <text x="206" y="118" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3" text-anchor="middle">개별 화면 폼</text>

  <rect x="76" y="130" width="260" height="22" fill="#000000" rx="3"/>
  <text x="86" y="146" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">var rules = [</text>
  <rect x="76" y="156" width="260" height="22" fill="#000000" rx="3"/>
  <text x="86" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">  { col:</text><text x="149" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">"nm"</text><text x="180" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">, req:</text><text x="227" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">true</text><text x="258" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">},</text>
  <rect x="76" y="182" width="260" height="22" fill="#000000" rx="3"/>
  <text x="86" y="198" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">  { col:</text><text x="149" y="198" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">"dt"</text><text x="180" y="198" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">, fmt:</text><text x="227" y="198" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">"date8"</text><text x="282" y="198" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">},</text>
  <rect x="76" y="208" width="260" height="22" fill="#000000" rx="3"/>
  <text x="86" y="224" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">  { col:</text><text x="149" y="224" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">"qty"</text><text x="188" y="224" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">, min:</text><text x="235" y="224" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#b5cea8" xml:space="preserve">1</text><text x="243" y="224" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">, max:</text><text x="290" y="224" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#b5cea8" xml:space="preserve">999</text><text x="313" y="224" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">}</text>
  <rect x="76" y="234" width="260" height="22" fill="#000000" rx="3"/>
  <text x="86" y="250" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ce9178" xml:space="preserve">];</text>

  <rect x="76" y="268" width="260" height="44" fill="#0d1e0d" rx="4" stroke="#2a5a2a" stroke-width="1"/>
  <text x="206" y="288" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555" text-anchor="middle" xml:space="preserve">gfn_validate(ds, rules, ctrl)</text>
  <text x="206" y="305" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">호출</text>

  <text x="206" y="348" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">각 화면은 규칙만 선언</text>
  <text x="206" y="368" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">로직은 위임</text>

  <!-- 화살표: 화면 폼 → 공통 라이브러리 -->
  <line x1="352" y1="270" x2="412" y2="270" stroke="#55c555" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="382" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">위임</text>

  <!-- 공통 라이브러리 (가운데) -->
  <rect x="412" y="96" width="292" height="320" fill="#0d1e0d" rx="8" stroke="#2a5a2a" stroke-width="1.5"/>
  <text x="558" y="118" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">공통 라이브러리</text>
  <text x="558" y="138" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">gfn_validate()</text>

  <rect x="428" y="150" width="260" height="22" fill="#000000" rx="3"/>
  <text x="438" y="166" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">for each rule in rules {</text>

  <rect x="428" y="176" width="260" height="22" fill="#0d2137" rx="3"/>
  <text x="448" y="192" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" xml:space="preserve">if req → gfn_isNull</text>

  <rect x="428" y="202" width="260" height="22" fill="#0d1e0d" rx="3"/>
  <text x="448" y="218" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555" xml:space="preserve">if fmt → gfn_checkFormat</text>

  <rect x="428" y="228" width="260" height="22" fill="#1a1a0d" rx="3"/>
  <text x="448" y="244" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e8c44a" xml:space="preserve">if min/max → gfn_checkRange</text>

  <rect x="428" y="254" width="260" height="40" fill="#1e0d0d" rx="3"/>
  <text x="448" y="272" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555" xml:space="preserve">실패 → alert + setFocus</text>
  <text x="448" y="288" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555" xml:space="preserve">       return false</text>

  <rect x="428" y="300" width="260" height="22" fill="#0d1e0d" rx="3"/>
  <text x="438" y="316" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555" xml:space="preserve">전부 통과 → return true</text>

  <!-- 화살표: 공통 라이브러리 → 서브 함수 -->
  <line x1="704" y1="270" x2="764" y2="270" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="734" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">호출</text>

  <!-- 서브 함수 (오른쪽) -->
  <rect x="764" y="140" width="56" height="28" fill="#0d2137" rx="4" stroke="#2a4a7a" stroke-width="1"/>
  <text x="792" y="159" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3" text-anchor="middle" xml:space="preserve">isNull</text>
  <rect x="764" y="176" width="56" height="28" fill="#0d1e0d" rx="4" stroke="#2a5a2a" stroke-width="1"/>
  <text x="792" y="195" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555" text-anchor="middle" xml:space="preserve">chkFmt</text>
  <rect x="764" y="212" width="56" height="28" fill="#1a1a0d" rx="4" stroke="#5a5a2a" stroke-width="1"/>
  <text x="792" y="231" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e8c44a" text-anchor="middle" xml:space="preserve">chkRng</text>

  <!-- 장점 -->
  <rect x="60" y="428" width="760" height="22" fill="#0f0f0f" rx="4"/>
  <text x="440" y="443" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle">장점: 검증 규칙이 선언적 — 항목 추가 시 배열에 원소만 추가, 로직 수정 없음</text>
</svg>
