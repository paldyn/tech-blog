<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390">
  <rect width="880" height="390" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">CASE 실무 활용 패턴</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">조건부 집계 · 피벗 · ORDER BY 내 정렬 제어</text>

  <!-- Code block -->
  <rect x="60" y="88" width="760" height="251" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="113" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- 조건부 집계 (피벗 패턴)</tspan></text>
  <text x="76" y="132" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan></text>
  <text x="76" y="151" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">SUM</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#7ec8e3" font-weight="600">CASE</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">WHEN</tspan><tspan fill="#ffffff"> region=</tspan><tspan fill="#ce9178">'서울'</tspan></text>
  <text x="76" y="170" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">THEN</tspan><tspan fill="#ffffff"> amount </tspan><tspan fill="#7ec8e3" font-weight="600">ELSE</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">END</tspan><tspan fill="#ffffff">) </tspan><tspan fill="#7ec8e3" font-weight="600">AS</tspan><tspan fill="#ffffff"> seoul,</tspan></text>
  <text x="76" y="189" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">SUM</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#7ec8e3" font-weight="600">CASE</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">WHEN</tspan><tspan fill="#ffffff"> region=</tspan><tspan fill="#ce9178">'부산'</tspan></text>
  <text x="76" y="208" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">THEN</tspan><tspan fill="#ffffff"> amount </tspan><tspan fill="#7ec8e3" font-weight="600">ELSE</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">END</tspan><tspan fill="#ffffff">) </tspan><tspan fill="#7ec8e3" font-weight="600">AS</tspan><tspan fill="#ffffff"> busan</tspan></text>
  <text x="76" y="227" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff"> sales;</tspan></text>
  <text x="76" y="246" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- 사용자 지정 정렬 순서</tspan></text>
  <text x="76" y="265" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">ORDER</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">BY</tspan></text>
  <text x="76" y="284" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">CASE</tspan><tspan fill="#ffffff"> status</tspan></text>
  <text x="76" y="303" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">WHEN</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ce9178">'긴급'</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">THEN</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">WHEN</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ce9178">'일반'</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">THEN</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#b5cea8">2</tspan></text>
  <text x="76" y="322" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">ELSE</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#b5cea8">3</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">END</tspan><tspan fill="#ffffff">;</tspan></text>

  <!-- Note -->
  <text x="440" y="368" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">CASE WHEN condition THEN val END — ELSE 생략 시 NULL / 단락 평가(short-circuit) 적용</text>
</svg>
