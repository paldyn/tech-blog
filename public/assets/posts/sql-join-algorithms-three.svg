<svg xmlns="http://www.w3.org/2000/svg" width="880" height="550" viewBox="0 0 880 550">
  <rect width="880" height="550" fill="#0a0a0a" rx="12"/>
  <defs>
    <marker id="arrC" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/></marker>
    <marker id="arrP" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/></marker>
    <marker id="arrG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/></marker>
  </defs>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">3가지 조인 알고리즘</text>
  <text x="440" y="72" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">Nested Loop · Hash Join · Sort-Merge Join</text>

  <!-- ─── NL Join ─── -->
  <rect x="60" y="95" width="230" height="310" fill="#111" rx="8" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="175" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3">Nested Loop</text>

  <!-- Outer loop -->
  <rect x="78" y="133" width="84" height="106" fill="#0d1520" rx="4" stroke="#7ec8e3"/>
  <text x="120" y="154" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7ec8e3">Outer 테이블</text>
  <text x="120" y="179" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">row 1</text>
  <text x="120" y="201" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">row 2</text>
  <text x="120" y="223" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">row 3</text>

  <!-- Arrow to inner -->
  <line x1="162" y1="175" x2="212" y2="175" stroke="#7ec8e3" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrC)"/>
  <line x1="162" y1="197" x2="212" y2="197" stroke="#7ec8e3" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrC)"/>
  <line x1="162" y1="219" x2="212" y2="219" stroke="#7ec8e3" stroke-dasharray="4,4" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- Inner loop -->
  <rect x="212" y="133" width="60" height="106" fill="#0d1520" rx="4" stroke="#888"/>
  <text x="242" y="154" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">Inner</text>
  <text x="242" y="179" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">idx</text>
  <text x="242" y="201" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">lookup</text>
  <text x="242" y="223" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="12" fill="#9aa4b8">× N</text>

  <text x="175" y="266" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">복잡도: O(N × M)</text>
  <text x="175" y="284" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">Inner에 인덱스 필수</text>
  <text x="175" y="305" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">소량 × 인덱스 룩업</text>
  <text x="175" y="323" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">OLTP에 최적</text>
  <text x="175" y="346" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">대용량 테이블 × 메모리 낭비</text>
  <text x="175" y="364" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">인덱스 없으면 느림</text>

  <!-- ─── Hash Join ─── -->
  <rect x="325" y="95" width="230" height="310" fill="#111" rx="8" stroke="#7777cc" stroke-width="1.5"/>
  <text x="440" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7777cc">Hash Join</text>

  <rect x="343" y="133" width="194" height="44" fill="#0d1520" rx="4" stroke="#7777cc"/>
  <text x="440" y="151" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7777cc">Build Phase</text>
  <text x="440" y="167" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">작은 테이블 → 해시 테이블 구축</text>
  <line x1="440" y1="177" x2="440" y2="195" stroke="#7777cc" stroke-width="2" marker-end="url(#arrP)"/>
  <rect x="343" y="195" width="194" height="44" fill="#0d1520" rx="4" stroke="#888"/>
  <text x="440" y="213" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">Probe Phase</text>
  <text x="440" y="229" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">큰 테이블 → 해시 조회</text>

  <text x="440" y="266" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">복잡도: O(N + M)</text>
  <text x="440" y="284" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">Build 테이블을 메모리에 적재</text>
  <text x="440" y="305" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">대용량 등치 조인</text>
  <text x="440" y="323" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">인덱스 불필요</text>
  <text x="440" y="346" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">메모리 부족 시 디스크 Spill</text>
  <text x="440" y="364" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">범위 조인 미지원</text>

  <!-- ─── Sort-Merge Join ─── -->
  <rect x="590" y="95" width="230" height="310" fill="#111" rx="8" stroke="#55c555" stroke-width="1.5"/>
  <text x="705" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555">Sort-Merge Join</text>

  <rect x="608" y="133" width="194" height="44" fill="#0e1a0e" rx="4" stroke="#55c555"/>
  <text x="705" y="151" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">Sort Phase</text>
  <text x="705" y="167" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">양쪽 테이블을 조인 키로 정렬</text>
  <line x1="705" y1="177" x2="705" y2="195" stroke="#55c555" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="608" y="195" width="194" height="44" fill="#0e1a0e" rx="4" stroke="#888"/>
  <text x="705" y="213" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">Merge Phase</text>
  <text x="705" y="229" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">포인터로 순차 병합</text>

  <text x="705" y="266" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">복잡도: O(N log N + M log M)</text>
  <text x="705" y="284" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">이미 정렬된 데이터 최적</text>
  <text x="705" y="305" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">범위 조인 지원</text>
  <text x="705" y="323" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">이미 정렬 시 O(N+M)</text>
  <text x="705" y="346" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">정렬 비용 초기 발생</text>
  <text x="705" y="364" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">정렬 불가 컬럼엔 비적합</text>

  <!-- Bottom: decision guide -->
  <rect x="60" y="430" width="760" height="90" fill="#0d0d18" rx="6" stroke="#3a4a6e"/>
  <text x="440" y="454" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e8e8e8">옵티마이저 선택 기준</text>
  <text x="200" y="478" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7ec8e3">NL: 소량 + Inner 인덱스</text>
  <text x="440" y="478" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7777cc">Hash: 대용량 등치, 인덱스 없음</text>
  <text x="680" y="478" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">Sort-Merge: 정렬 데이터·범위 조인</text>
  <text x="440" y="502" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">힌트 없이 통계가 정확하면 CBO가 자동 선택 — EXPLAIN으로 확인</text>
</svg>
