<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510">
  <defs>
    <marker id="axisArr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="510" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">추론 모델이 값을 하는 영역</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">단계가 깊고 정답을 기계적으로 검증할 수 있을 때만 추가 비용이 회수된다</text>

  <line x1="132" y1="440" x2="132" y2="98" stroke="#666" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <line x1="132" y1="440" x2="852" y2="440" stroke="#666" stroke-width="1.5" marker-end="url(#axisArr)"/>

  <text x="0" y="0" transform="translate(114,300) rotate(-90)" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">추론 단계의 깊이</text>
  <text x="490" y="472" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">정답 검증의 용이성</text>

  <rect x="152" y="110" width="330" height="130" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="176" y="143" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">부분적으로 유효</text>
  <text x="176" y="171" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">아키텍처 선택, 전략 문서, 근거 정리</text>
  <text x="176" y="193" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">품질은 오르지만 확인할 방법이 없다</text>
  <text x="176" y="221" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">사람 리뷰가 반드시 붙어야 함</text>

  <rect x="512" y="110" width="330" height="130" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="536" y="143" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">최적 구간</text>
  <text x="536" y="171" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">경쟁 수학, 알고리즘 설계, 제약 스케줄링</text>
  <text x="536" y="193" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">테스트가 있는 버그 수정, 형식 증명</text>
  <text x="536" y="221" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">정확도 이득이 비용을 확실히 넘는다</text>

  <rect x="152" y="270" width="330" height="130" rx="8" fill="#12121a" stroke="#e05555" stroke-width="1"/>
  <text x="176" y="303" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">쓸 이유 없음</text>
  <text x="176" y="331" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">잡담 응답, 톤 변환, 짧은 요약</text>
  <text x="176" y="353" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">깊게 생각할 대상 자체가 없다</text>
  <text x="176" y="381" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">지연만 늘고 품질은 그대로</text>

  <rect x="512" y="270" width="330" height="130" rx="8" fill="#12121a" stroke="#e05555" stroke-width="1"/>
  <text x="536" y="303" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">과잉 투자</text>
  <text x="536" y="331" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">분류, 엔티티 추출, 포맷 변환, 라우팅</text>
  <text x="536" y="353" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">작은 모델이 이미 98%를 맞힌다</text>
  <text x="536" y="381" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">남는 2%를 사려고 10배를 낸다</text>
</svg>
