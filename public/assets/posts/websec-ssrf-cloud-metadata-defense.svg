<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <rect width="880" height="440" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">IMDSv2와 클라우드 보안 설정</text>

  <!-- IMDSv1 vs v2 -->
  <text x="210" y="82" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e05555">IMDSv1 (취약)</text>
  <rect x="60" y="94" width="300" height="100" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="118" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8"># 단순 GET 요청으로 탈취 가능</tspan></text>
  <text x="76" y="138" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">curl</tspan> http://169.254.169.254/</text>
  <text x="76" y="158" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">     latest/meta-data/iam/</text>
  <text x="76" y="178" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">     security-credentials/role</text>

  <text x="610" y="82" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555">IMDSv2 (토큰 필수)</text>
  <rect x="400" y="94" width="420" height="120" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="416" y="118" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8"># PUT으로 토큰 발급 후 GET</tspan></text>
  <text x="416" y="138" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">H=<tspan fill="#ce9178">"X-aws-ec2-metadata-token-ttl-seconds"</tspan></text>
  <text x="416" y="158" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">TOKEN=$(<tspan fill="#7ec8e3" font-weight="600">curl</tspan> -X PUT -H <tspan fill="#ce9178">"$H: 21600"</tspan> \</text>
  <text x="416" y="178" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  http://169.254.169.254/latest/api/token)</text>
  <text x="416" y="198" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8"># SSRF로 PUT 불가 → 토큰 없음 → 실패!</tspan></text>

  <!-- AWS config to enforce IMDSv2 -->
  <text x="440" y="250" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8">IMDSv2 강제 + IAM 최소 권한</text>
  <rect x="60" y="264" width="760" height="154" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="288" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8"># Terraform으로 IMDSv2 강제</tspan></text>
  <text x="76" y="307" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">resource</tspan> <tspan fill="#ce9178">"aws_instance" "web"</tspan> {</text>
  <text x="76" y="326" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  metadata_options {</text>
  <text x="76" y="345" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    http_tokens    = <tspan fill="#ce9178">"required"</tspan>  <tspan fill="#9aa4b8"># IMDSv2 강제</tspan></text>
  <text x="76" y="364" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    http_hop_limit = <tspan fill="#b5cea8">1</tspan>           <tspan fill="#9aa4b8"># 컨테이너 내 접근 제한</tspan></text>
  <text x="76" y="383" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  }</text>
  <text x="76" y="402" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">}</text>
</svg>
