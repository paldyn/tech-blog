<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 496"
     font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="496" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">Java Config vs XML Config 비교</text>
  <text x="440" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#888">@Configuration / @Bean 대 &lt;bean&gt; XML 태그</text>

  <!-- Column headers -->
  <rect x="40" y="82" width="396" height="36" rx="6" fill="#0f1a20" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="238" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#7ec8e3">Java Config (@Configuration)</text>

  <rect x="460" y="82" width="360" height="36" rx="6" fill="#1a1308" stroke="#e8a03a" stroke-width="1.5"/>
  <text x="640" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#e8a03a">XML Config (&lt;beans&gt; / &lt;bean&gt;)</text>

  <!-- Left code block -->
  <rect x="40" y="126" width="396" height="236" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="56" y="149" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#7ec8e3">@Configuration</text>
  <text x="56" y="167" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#7ec8e3">public class </text>
  <text x="164" y="167" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#ffffff">AppConfig {</text>
  <text x="56" y="185" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#ffffff">  </text>
  <text x="56" y="203" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#7ec8e3">  @Bean</text>
  <text x="56" y="221" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#7ec8e3">  public </text>
  <text x="122" y="221" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#ffffff">OrderService orderService() {</text>
  <text x="56" y="239" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">    return new </tspan><tspan fill="#ffffff">OrderService(discountPolicy());</tspan></text>
  
  <text x="56" y="257" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#ffffff">  }</text>
  <text x="56" y="275" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#ffffff">  </text>
  <text x="56" y="293" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#7ec8e3">  @Bean</text>
  <text x="56" y="311" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#7ec8e3">  public </text>
  <text x="122" y="311" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#ffffff">DiscountPolicy discountPolicy() {</text>
  <text x="56" y="329" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">    return new </tspan><tspan fill="#ffffff">RateDiscountPolicy();</tspan></text>
  
  <text x="56" y="347" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#ffffff">  }}</text>

  <!-- Right code block -->
  <rect x="460" y="126" width="360" height="236" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="476" y="149" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#7ec8e3">&lt;beans ...&gt;</text>
  <text x="476" y="167" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#ffffff">  </text>
  <text x="476" y="185" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">  &lt;bean </tspan><tspan fill="#b5cea8">id</tspan><tspan fill="#ce9178">="orderService"</tspan></text>

  <text x="476" y="203" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#b5cea8">        class</tspan><tspan fill="#ce9178">="c.e.OrderService"</tspan><tspan fill="#ffffff">&gt;</tspan></text>

  <text x="476" y="221" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">    &lt;constructor-arg </tspan><tspan fill="#b5cea8">ref</tspan><tspan fill="#ce9178">="discountPolicy"</tspan><tspan fill="#ffffff">/&gt;</tspan></text>

  <text x="476" y="239" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#7ec8e3">  &lt;/bean&gt;</text>
  <text x="476" y="257" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#ffffff">  </text>
  <text x="476" y="275" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#7ec8e3">  &lt;bean </tspan><tspan fill="#b5cea8">id</tspan><tspan fill="#ce9178">="discountPolicy"</tspan></text>

  <text x="476" y="293" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve"><tspan fill="#b5cea8">        class</tspan><tspan fill="#ce9178">="c.e.RateDiscountPolicy"</tspan><tspan fill="#ffffff">/&gt;</tspan></text>

  <text x="476" y="311" font-size="13" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" fill="#7ec8e3">&lt;/beans&gt;</text>

  <!-- Comparison table -->
  <rect x="60" y="374" width="760" height="90" rx="8" fill="#111" stroke="#222"/>
  <!-- Headers -->
  <text x="130" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#888">항목</text>
  <text x="330" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#7ec8e3">Java Config</text>
  <text x="640" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#e8a03a">XML Config</text>
  <line x1="200" y1="380" x2="200" y2="464" stroke="#222" stroke-width="1"/>
  <line x1="490" y1="380" x2="490" y2="464" stroke="#222" stroke-width="1"/>
  <line x1="60" y1="406" x2="820" y2="406" stroke="#222" stroke-width="1"/>
  <!-- Row 1 -->
  <text x="130" y="423" text-anchor="middle" font-size="12" fill="#888">타입 안전성</text>
  <text x="330" y="423" text-anchor="middle" font-size="12" fill="#55c555">컴파일 타임 체크 ✓</text>
  <text x="640" y="423" text-anchor="middle" font-size="12" fill="#e05555">런타임에 오류 발견</text>
  <line x1="60" y1="432" x2="820" y2="432" stroke="#222" stroke-width="1"/>
  <!-- Row 2 -->
  <text x="130" y="450" text-anchor="middle" font-size="12" fill="#888">IDE 지원</text>
  <text x="330" y="450" text-anchor="middle" font-size="12" fill="#55c555">자동완성·리팩터링 완전 지원</text>
  <text x="640" y="450" text-anchor="middle" font-size="12" fill="#888">플러그인 의존, 부분 지원</text>

  <!-- Footer -->
  <text x="440" y="480" text-anchor="middle" font-size="11" fill="#444">현대 스프링 프로젝트에서는 Java Config가 표준 — XML은 레거시 연동·외부 라이브러리 등록 시 선택적으로 사용</text>
</svg>
