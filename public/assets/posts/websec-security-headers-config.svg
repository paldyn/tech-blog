<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530">
  <rect width="880" height="530" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">보안 헤더 실전 설정</text>
  <text x="440" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#888" text-anchor="middle">nginx · Express · FastAPI 환경별 구성</text>

  <!-- nginx config -->
  <text x="76" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">nginx</text>
  <rect x="60" y="115" width="760" height="146" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="137" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8"># /etc/nginx/conf.d/security.conf</tspan></text>
  <text x="76" y="156" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">add_header</tspan> Strict-Transport-Security <tspan fill="#ce9178">"max-age=31536000; includeSubDomains; preload"</tspan>;</text>
  <text x="76" y="175" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">add_header</tspan> X-Content-Type-Options <tspan fill="#ce9178">"nosniff"</tspan>;</text>
  <text x="76" y="194" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">add_header</tspan> X-Frame-Options <tspan fill="#ce9178">"SAMEORIGIN"</tspan>;</text>
  <text x="76" y="213" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">add_header</tspan> Referrer-Policy <tspan fill="#ce9178">"strict-origin-when-cross-origin"</tspan>;</text>
  <text x="76" y="232" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">add_header</tspan> Permissions-Policy <tspan fill="#ce9178">"camera=(), microphone=(), geolocation=()"</tspan>;</text>
  <text x="76" y="249" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">always 파라미터 추가하면 오류 응답에도 헤더 포함됨</text>

  <!-- Express/Node.js -->
  <text x="76" y="282" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">Express.js (helmet)</text>
  <rect x="60" y="292" width="360" height="140" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="316" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">import</tspan> helmet <tspan fill="#7ec8e3" font-weight="600">from</tspan> <tspan fill="#ce9178">'helmet'</tspan></text>
  <text x="76" y="335" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">app.use(helmet({</text>
  <text x="76" y="354" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  hsts: { maxAge: <tspan fill="#b5cea8">31536000</tspan>,</text>
  <text x="76" y="373" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">          includeSubDomains: <tspan fill="#7ec8e3" font-weight="600">true</tspan> },</text>
  <text x="76" y="392" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  frameguard: { action: <tspan fill="#ce9178">'sameorigin'</tspan> },</text>
  <text x="76" y="411" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">}));</text>

  <!-- FastAPI -->
  <text x="456" y="282" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">FastAPI (미들웨어)</text>
  <rect x="440" y="292" width="380" height="140" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="454" y="316" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">class</tspan> SecurityHeaders(BaseHTTPMiddleware):</text>
  <text x="454" y="335" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">async def</tspan> dispatch(self, req, call_next):</text>
  <text x="454" y="354" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    resp = <tspan fill="#7ec8e3" font-weight="600">await</tspan> call_next(req)</text>
  <text x="454" y="373" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    resp.headers[<tspan fill="#ce9178">'X-Frame-Options'</tspan>] = <tspan fill="#ce9178">'DENY'</tspan></text>
  <text x="454" y="392" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    <tspan fill="#7ec8e3" font-weight="600">return</tspan> resp</text>

  <!-- Bottom security tool -->
  <rect x="60" y="450" width="760" height="64" rx="8" fill="#0d1a0d" stroke="#3aa83a" stroke-width="1"/>
  <text x="440" y="472" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555" text-anchor="middle">헤더 검사 도구</text>
  <text x="440" y="490" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#7ec8e3" font-weight="600" text-anchor="middle">curl -I https://yourdomain.com</text>
  <text x="440" y="506" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8" text-anchor="middle">securityheaders.com · observatory.mozilla.org 에서 온라인 검사 가능</text>
</svg>
