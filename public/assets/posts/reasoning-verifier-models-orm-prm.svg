  <text x="50" y="222" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">점수는 하나뿐이다. 틀렸다는 것만 알고, 어디서 틀렸는지는 모른다.</text>

  <text x="50" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7777cc">과정 보상 모델 — 단계마다 본다</text>

