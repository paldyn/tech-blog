  <text x="440" y="398" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#e05555">0.12</text>

  <text x="50" y="440" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">③에서 이미 점수가 무너지므로 뒤 두 단계를 생성하지 않고 끊어 낸다. 토큰과 지연을 그만큼 아낀다.</text>
