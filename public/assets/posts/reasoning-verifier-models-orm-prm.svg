  <rect x="213" y="378" width="128" height="30" rx="6" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="277" y="398" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#55c555">0.91</text>
