<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380">
  <rect width="880" height="380" rx="12" fill="#0a0a0a"/>

  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">Express 쿠키 보안 설정</text>

  <!-- 세션 쿠키 -->
  <rect x="60" y="70" width="370" height="34" rx="6" fill="#0a0a1a" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="245" y="93" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="700" fill="#7ec8e3" text-anchor="middle">세션 쿠키 (로그인용)</text>

  <rect x="60" y="115" width="370" height="140" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="137" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">res.cookie(</tspan><tspan fill="#ce9178">'session'</tspan><tspan fill="#ffffff">, token, {</tspan></text>
  <text x="76" y="157" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  httpOnly: </tspan><tspan font-weight="600" fill="#7ec8e3">true</tspan></text>
  <text x="76" y="177" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  secure: process.env.NODE_ENV</tspan></text>
  <text x="76" y="197" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    === </tspan><tspan fill="#ce9178">'production'</tspan></text>
  <text x="76" y="217" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  sameSite: </tspan><tspan fill="#ce9178">'strict'</tspan></text>
  <text x="76" y="237" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  maxAge: </tspan><tspan fill="#b5cea8">1000</tspan><tspan fill="#ffffff"> * </tspan><tspan fill="#b5cea8">60</tspan><tspan fill="#ffffff"> * </tspan><tspan fill="#b5cea8">60</tspan><tspan fill="#ffffff"> * </tspan><tspan fill="#b5cea8">24</tspan><tspan fill="#ffffff"> });</tspan></text>

  <!-- CSRF 쿠키 -->
  <rect x="460" y="70" width="370" height="34" rx="6" fill="#0a1a0a" stroke="#55c555" stroke-width="1.5"/>
  <text x="645" y="93" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="700" fill="#55c555" text-anchor="middle">CSRF 토큰 쿠키 (JS가 읽어야 함)</text>

  <rect x="460" y="115" width="370" height="140" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="476" y="147" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">res.cookie(</tspan><tspan fill="#ce9178">'csrf'</tspan><tspan fill="#ffffff">, csrfToken, {</tspan></text>
  <text x="476" y="167" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">  // httpOnly 없음 — JS가 읽어야 함</tspan></text>
  <text x="476" y="187" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  secure: </tspan><tspan font-weight="600" fill="#7ec8e3">true</tspan></text>
  <text x="476" y="207" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  sameSite: </tspan><tspan fill="#ce9178">'strict'</tspan></text>
  <text x="476" y="227" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  path: </tspan><tspan fill="#ce9178">'/'</tspan><tspan fill="#ffffff"> });</tspan></text>

  <!-- 로그아웃 -->
  <rect x="60" y="280" width="760" height="80" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="302" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">// 로그아웃 — 쿠키 만료로 삭제</tspan></text>
  <text x="76" y="322" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">res.cookie(</tspan><tspan fill="#ce9178">'session'</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ce9178">''</tspan><tspan fill="#ffffff">, { httpOnly: </tspan><tspan font-weight="600" fill="#7ec8e3">true</tspan><tspan fill="#ffffff">, maxAge: </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff"> });</tspan></text>
  <text x="76" y="344" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">// clearCookie는 내부적으로 maxAge:0 + 동일 속성으로 덮어씀</tspan></text>
</svg>
