<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420">
  <rect width="880" height="420" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">TypeScript 타입 시스템 특성</text>
  <text x="440" y="74" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">구조적 타이핑 · 타입 추론 · 점진적 도입</text>

  <!-- Three key characteristics -->
  <!-- 1. Structural Typing -->
  <rect x="60" y="96" width="230" height="130" rx="10" fill="#111520" stroke="#7ec8e3"/>
  <text x="175" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3">구조적 타이핑</text>
  <text x="76" y="146" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" xml:space="preserve"><tspan fill="#7ec8e3">interface</tspan><tspan fill="#ffffff"> Named { name: </tspan><tspan fill="#7ec8e3">string</tspan><tspan fill="#ffffff"> }</tspan></text>
  <text x="76" y="164" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" xml:space="preserve"><tspan fill="#7ec8e3">const</tspan><tspan fill="#ffffff"> dog = { name: </tspan><tspan fill="#ce9178">"Rex"</tspan><tspan fill="#ffffff">, age: </tspan><tspan fill="#b5cea8">3</tspan><tspan fill="#ffffff"> };</tspan></text>
  <text x="76" y="182" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#9aa4b8">// dog은 Named 구조를 충족 ✅</text>
  <text x="76" y="200" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" xml:space="preserve"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> greet(x: Named) {}</tspan></text>
  <text x="76" y="218" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" xml:space="preserve"><tspan fill="#ffffff">greet(dog); </tspan>  <tspan fill="#55c555">// 통과</tspan></text>

  <!-- 2. Type Inference -->
  <rect x="325" y="96" width="230" height="130" rx="10" fill="#111520" stroke="#7777cc"/>
  <text x="440" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7777cc">타입 추론</text>
  <text x="341" y="146" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#9aa4b8">// 명시하지 않아도 추론</text>
  <text x="341" y="164" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" xml:space="preserve"><tspan fill="#7ec8e3">const</tspan><tspan fill="#ffffff"> x = </tspan><tspan fill="#b5cea8">42</tspan><tspan fill="#ffffff">; </tspan>  <tspan fill="#9aa4b8">// number</tspan></text>
  <text x="341" y="182" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" xml:space="preserve"><tspan fill="#7ec8e3">const</tspan><tspan fill="#ffffff"> arr = [</tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#b5cea8">2</tspan><tspan fill="#ffffff">];</tspan></text>
  <text x="341" y="200" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#9aa4b8">// number[]</text>
  <text x="341" y="218" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" xml:space="preserve"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> add(a: </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff">,</tspan></text>

  <!-- 3. Gradual Typing -->
  <rect x="590" y="96" width="230" height="130" rx="10" fill="#111520" stroke="#55c555"/>
  <text x="705" y="120" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555">점진적 도입</text>
  <text x="606" y="146" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#9aa4b8">// .js → .ts 점진적 이전</text>
  <text x="606" y="164" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#9aa4b8">// allowJs + checkJs로 시작</text>
  <text x="606" y="182" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" xml:space="preserve"><tspan fill="#7ec8e3">let</tspan><tspan fill="#ffffff"> x: </tspan><tspan fill="#7ec8e3">any</tspan><tspan fill="#ffffff"> = legacyFn();</tspan></text>
  <text x="606" y="200" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#9aa4b8">// 나중에 타입 좁히기</text>
  <text x="606" y="218" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" xml:space="preserve"><tspan fill="#7ec8e3">let</tspan><tspan fill="#ffffff"> y: </tspan><tspan fill="#7ec8e3">string</tspan><tspan fill="#ffffff"> | </tspan><tspan fill="#7ec8e3">null</tspan><tspan fill="#ffffff">;</tspan></text>

  <!-- Bottom: key insight boxes -->
  <rect x="60" y="252" width="760" height="130" rx="10" fill="#111520" stroke="#3a4a6e"/>
  <text x="440" y="276" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e8e8e8">TypeScript의 핵심 전제</text>

  <rect x="80" y="290" width="210" height="76" rx="6" fill="#0a1020" stroke="#7ec8e3"/>
  <text x="185" y="314" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">타입은 런타임에 없다</text>
  <text x="185" y="338" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">컴파일 후 모든 타입</text>
  <text x="185" y="354" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">어노테이션 제거됨</text>

  <rect x="335" y="290" width="210" height="76" rx="6" fill="#0a1020" stroke="#7777cc"/>
  <text x="440" y="314" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7777cc">superset 관계</text>
  <text x="440" y="338" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">모든 유효한 JS는</text>
  <text x="440" y="354" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">유효한 TS다</text>

  <rect x="590" y="290" width="210" height="76" rx="6" fill="#0a1020" stroke="#55c555"/>
  <text x="695" y="314" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">타입 안전성 목표</text>
  <text x="695" y="338" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">런타임 오류를 컴파일</text>
  <text x="695" y="354" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">시점으로 앞당기기</text>
</svg>
