<svg xmlns="http://www.w3.org/2000/svg" width="880" height="424" viewBox="0 0 880 424">
  <rect width="880" height="424" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">PK 전략: 자연키 vs 서로게이트키</text>

  <!-- Natural Key -->
  <rect x="60" y="70" width="360" height="280" rx="8" fill="#0d0d0d" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="240" y="94" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="700" fill="#7ec8e3">자연키 (Natural Key)</text>
  <text x="240" y="114" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">비즈니스 의미를 가진 컬럼을 PK로</text>

  <rect x="76" y="124" width="328" height="78" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="92" y="148" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- 주민등록번호를 PK로</tspan></text>
  <text x="92" y="166" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#ffffff"> citizens (</tspan></text>
  <text x="92" y="184" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  rrn </tspan><tspan fill="#7ec8e3" font-weight="600">CHAR</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#b5cea8">14</tspan><tspan fill="#ffffff">) </tspan><tspan fill="#7ec8e3" font-weight="600">PRIMARY KEY</tspan><tspan fill="#ffffff">);</tspan></text>

  <text x="80" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">장점</text>
  <text x="80" y="260" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 별도 PK 컬럼 불필요</text>
  <text x="80" y="277" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 도메인 의미 명확</text>
  <text x="80" y="297" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">단점</text>
  <text x="80" y="313" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 값 변경 시 FK 연쇄 수정</text>
  <text x="80" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 개인정보 PK 노출 위험</text>

  <!-- Surrogate Key -->
  <rect x="460" y="70" width="360" height="280" rx="8" fill="#0d0d0d" stroke="#7777cc" stroke-width="1.5"/>
  <text x="640" y="94" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="700" fill="#7777cc">서로게이트키 (Surrogate Key)</text>
  <text x="640" y="114" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">의미 없는 시퀀스/UUID를 PK로</text>

  <rect x="476" y="124" width="328" height="96" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="492" y="148" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- 자동 증가 ID를 PK로</tspan></text>
  <text x="492" y="166" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#ffffff"> users (</tspan></text>
  <text x="492" y="184" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  id </tspan><tspan fill="#7ec8e3" font-weight="600">BIGINT GENERATED ALWAYS</tspan></text>
  <text x="492" y="202" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">     </tspan><tspan fill="#7ec8e3" font-weight="600">AS IDENTITY PRIMARY KEY</tspan><tspan fill="#ffffff">);</tspan></text>

  <text x="480" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">장점</text>
  <text x="480" y="260" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 불변, FK JOIN 안정</text>
  <text x="480" y="277" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 개인정보 분리 가능</text>
  <text x="480" y="297" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">단점</text>
  <text x="480" y="313" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 추가 컬럼 필요</text>
  <text x="480" y="330" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 도메인 의미 없음</text>

  <!-- Recommendation -->
  <rect x="60" y="368" width="760" height="36" rx="6" fill="#0d1520" stroke="#7777cc" stroke-width="1"/>
  <text x="440" y="391" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">실무 권장: 서로게이트키(BIGINT IDENTITY/SERIAL) 기본값 · 자연키는 UNIQUE 제약으로 보조</text>
</svg>
