<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <rect x="0" y="0" width="880" height="480" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">사고 예산과 출력 상한은 같은 통을 나눠 쓴다</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">막대 전체가 max_tokens. 사고가 다 먹으면 답변이 들어갈 자리가 남지 않는다</text>

  <rect x="50" y="110" width="230" height="76" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="72" y="134" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">정상</text>
  <text x="72" y="156" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">max_tokens 8000</text>
  <text x="72" y="174" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">budget_tokens 4000</text>
  <rect x="310" y="122" width="250" height="34" rx="4" fill="#7ec8e3" opacity="0.85"/>
  <text x="322" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#0a0a0a">사고 3,800</text>
  <rect x="560" y="122" width="70" height="34" rx="4" fill="#55c555" opacity="0.85"/>
  <text x="570" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#0a0a0a">답변</text>
  <rect x="630" y="122" width="160" height="34" rx="4" fill="none" stroke="#3a3a45" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="642" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">여유 3,300</text>
  <text x="310" y="178" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">사고가 예산 안에서 끝났고 답변을 쓸 자리도 남았다</text>

  <rect x="50" y="220" width="230" height="76" rx="8" fill="#12121a" stroke="#e05555" stroke-width="1"/>
  <text x="72" y="244" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">답변 잘림</text>
  <text x="72" y="266" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">max_tokens 4096</text>
  <text x="72" y="284" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">budget_tokens 4000</text>
  <rect x="310" y="232" width="455" height="34" rx="4" fill="#7ec8e3" opacity="0.85"/>
  <text x="322" y="254" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#0a0a0a">사고 4,000 — 예산을 전부 소진</text>
  <rect x="765" y="232" width="25" height="34" rx="4" fill="#e05555" opacity="0.9"/>
  <text x="310" y="288" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">답변 자리가 96토큰뿐 · 응답이 문장 중간에서 끊긴다</text>

  <rect x="50" y="330" width="230" height="76" rx="8" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
  <text x="72" y="354" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7777cc">권장 설정</text>
  <text x="72" y="376" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">max_tokens 12000</text>
  <text x="72" y="394" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">budget_tokens 6000</text>
  <rect x="310" y="342" width="240" height="34" rx="4" fill="#7ec8e3" opacity="0.85"/>
  <text x="322" y="364" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#0a0a0a">사고 상한 6,000</text>
  <rect x="550" y="342" width="240" height="34" rx="4" fill="#55c555" opacity="0.5"/>
  <text x="562" y="364" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#e8e8e8">답변 헤드룸 6,000</text>
  <text x="310" y="398" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">사고가 상한까지 차더라도 답변을 온전히 쓸 수 있다</text>

  <text x="50" y="446" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">경험칙: max_tokens ≥ budget_tokens + (예상 답변 길이 × 2). 상한은 목표치가 아니라 안전선이다.</text>
</svg>
