<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <rect x="0" y="0" width="880" height="480" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">답을 고르는 네 가지 눈</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">아래로 갈수록 적용 범위는 넓어지고 신뢰도는 떨어진다. 위쪽부터 소진하는 것이 순서다</text>

  <rect x="50" y="110" width="360" height="132" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="74" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">규칙 · 실행 검증기</text>
  <text x="74" y="172" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">테스트 실행, 스키마 검증, 정답 대조</text>
  <text x="74" y="194" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">판정이 0/1로 확실하고 비용이 거의 0</text>
  <text x="74" y="222" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#55c555">가능한 부분은 무조건 여기서 먼저 처리</text>

  <rect x="470" y="110" width="360" height="132" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="494" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">결과 보상 모델 (ORM)</text>
  <text x="494" y="172" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">최종 답만 보고 맞을 확률을 예측</text>
  <text x="494" y="194" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">라벨이 싸다 · 어디서 틀렸는지는 모른다</text>
  <text x="494" y="222" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#7ec8e3">규칙으로 못 짤 때의 현실적 기본값</text>

  <rect x="50" y="272" width="360" height="132" rx="8" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
  <text x="74" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">과정 보상 모델 (PRM)</text>
  <text x="74" y="334" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">단계마다 점수를 매겨 오류 위치를 짚는다</text>
  <text x="74" y="356" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">라벨 비용이 크다 · 탐색과 궁합이 좋다</text>
  <text x="74" y="384" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#7777cc">가지치기를 하려면 사실상 필수</text>

  <rect x="470" y="272" width="360" height="132" rx="8" fill="#12121a" stroke="#e05555" stroke-width="1"/>
  <text x="494" y="304" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e8e8e8">자기 검증 프롬프트</text>
  <text x="494" y="334" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">같은 모델에게 자기 답을 검토시킨다</text>
  <text x="494" y="356" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#9aa4b8">추가 부품 0 · 자기 오류에는 특히 약하다</text>
  <text x="494" y="384" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" font-weight="600" fill="#e05555">보조 신호로만 · 단독 판정은 금물</text>

  <text x="50" y="446" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">대부분의 실무 시스템은 하나만 쓰지 않는다. 규칙으로 거르고, 남은 것만 학습된 검증자에게 넘긴다.</text>
</svg>
