<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 0 880 570"
     style="font-family:'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arr-r" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>
  <rect width="880" height="570" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">Simple vs Extended Query Protocol</text>
  <text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#888">Simple Query (문자열 전송) vs Prepared Statement (파싱 캐시)</text>

  <!-- Left: Simple Query -->
  <rect x="60" y="90" width="340" height="346" fill="#0f1520" rx="8" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="230" y="118" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e05555">Simple Query</text>
  <text x="230" y="138" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">매 실행마다 전체 SQL 전송</text>
  <rect x="80" y="152" width="300" height="36" fill="#1a0f0f" rx="5" stroke="#7a3a3a"/>
  <text x="230" y="174" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">SQL 문자열 전송 (매번)</text>
  <line x1="230" y1="188" x2="230" y2="212" stroke="#e05555" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <rect x="80" y="212" width="300" height="36" fill="#1a0f0f" rx="5" stroke="#7a3a3a"/>
  <text x="230" y="234" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">파싱 (매번)</text>
  <line x1="230" y1="248" x2="230" y2="272" stroke="#e05555" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <rect x="80" y="272" width="300" height="36" fill="#1a0f0f" rx="5" stroke="#7a3a3a"/>
  <text x="230" y="294" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">실행 계획 생성 (매번)</text>
  <line x1="230" y1="308" x2="230" y2="332" stroke="#e05555" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <rect x="80" y="332" width="300" height="36" fill="#1a0f0f" rx="5" stroke="#7a3a3a"/>
  <text x="230" y="354" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8">실행 → 결과 반환</text>
  <rect x="80" y="384" width="300" height="36" fill="#2a0f0f" rx="5" stroke="#e05555"/>
  <text x="230" y="406" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">SQL Injection 취약 (파라미터 미바인딩 시)</text>

  <!-- Center arrow -->
  <line x1="400" y1="263" x2="480" y2="263" stroke="#7777cc" stroke-width="3" marker-end="url(#arr-p)"/>

  <!-- Right: Extended (Prepared) Query -->
  <rect x="480" y="90" width="340" height="346" fill="#0f1a10" rx="8" stroke="#3a4a6e" stroke-width="1.5"/>
  <text x="650" y="118" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555">Extended Query (Prepared)</text>
  <text x="650" y="138" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">파싱·실행 계획을 서버에 캐시</text>
  <rect x="500" y="152" width="300" height="36" fill="#0a1a0a" rx="5" stroke="#3a7a3a"/>
  <text x="650" y="174" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">1회: Parse (SQL + 파라미터 타입)</text>
  <line x1="650" y1="188" x2="650" y2="212" stroke="#55c555" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <rect x="500" y="212" width="300" height="36" fill="#0a1a0a" rx="5" stroke="#3a7a3a"/>
  <text x="650" y="234" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">1회: Bind (값 바인딩)</text>
  <line x1="650" y1="248" x2="650" y2="272" stroke="#55c555" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <rect x="500" y="272" width="300" height="36" fill="#0a1a0a" rx="5" stroke="#3a7a3a"/>
  <text x="650" y="294" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">N회: Execute (파싱 재사용)</text>
  <line x1="650" y1="308" x2="650" y2="332" stroke="#55c555" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <rect x="500" y="332" width="300" height="36" fill="#0a1a0a" rx="5" stroke="#3a7a3a"/>
  <text x="650" y="354" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">결과 반환 → Close/Sync</text>
  <rect x="500" y="384" width="300" height="36" fill="#0a2a0a" rx="5" stroke="#55c555"/>
  <text x="650" y="406" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">SQL Injection 방어 + 성능 향상</text>

  <!-- Code block -->
  <rect x="60" y="456" width="760" height="80" fill="#000000" rx="6" stroke="#3a4a6e" stroke-width="1"/>
  <text x="80" y="481" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- Prepared Statement (JDBC 예시 — SQL Injection 방어)</tspan></text>
  <text x="80" y="500" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">PreparedStatement</tspan><tspan fill="#ffffff"> ps = conn.prepareStatement(</tspan></text>
  <text x="80" y="519" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#ce9178">"SELECT * FROM users WHERE id = ?"</tspan><tspan fill="#ffffff">);</tspan></text>
</svg>
