<svg xmlns="http://www.w3.org/2000/svg" width="880" height="835" viewBox="0 0 880 835">
  <rect width="880" height="835" fill="#0a0a0a" rx="12"/>
  <text x="440" y="48" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">컴파운드 컴포넌트 구현 (Tabs)</text>

  <!-- Context + Root -->
  <rect x="60" y="72" width="760" height="36" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="95" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3">Context + Root 컴포넌트</text>
  <rect x="60" y="120" width="760" height="356" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="139" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> TabsContext = createContext(</tspan><tspan fill="#b5cea8">null</tspan><tspan fill="#ffffff">);</tspan></text>
  <text x="76" y="158" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff"> </tspan></text>
  <text x="76" y="177" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">function</tspan><tspan fill="#ffffff"> Tabs({ defaultTab, children }) {</tspan></text>
  <text x="76" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> [active, setActive] = useState(defaultTab);</tspan></text>
  <text x="76" y="215" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  return</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="76" y="234" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    &lt;</tspan><tspan fill="#7ec8e3" font-weight="600">TabsContext.Provider</tspan><tspan fill="#ffffff"> value={{ active, setActive }}&gt;</tspan></text>
  <text x="76" y="253" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">      &lt;</tspan><tspan fill="#7ec8e3" font-weight="600">div</tspan><tspan fill="#ffffff">&gt;{children}&lt;/</tspan><tspan fill="#7ec8e3" font-weight="600">div</tspan><tspan fill="#ffffff">&gt;</tspan></text>
  <text x="76" y="272" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    &lt;/</tspan><tspan fill="#7ec8e3" font-weight="600">TabsContext.Provider</tspan><tspan fill="#ffffff">&gt;</tspan></text>
  <text x="76" y="291" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  );</tspan></text>
  <text x="76" y="310" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">}</tspan></text>
  <text x="76" y="329" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff"> </tspan></text>
  <text x="76" y="348" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">Tabs.Tab = </tspan><tspan fill="#7ec8e3" font-weight="600">function</tspan><tspan fill="#ffffff">({ id, children }) {</tspan></text>
  <text x="76" y="367" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> { active, setActive } = useContext(TabsContext);</tspan></text>
  <text x="76" y="386" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  return</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="76" y="405" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    &lt;</tspan><tspan fill="#7ec8e3" font-weight="600">button</tspan><tspan fill="#ffffff"> onClick={() =&gt; setActive(id)}</tspan></text>
  <text x="76" y="424" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">      className={active === id ? </tspan><tspan fill="#ce9178">'active'</tspan><tspan fill="#ffffff"> : </tspan><tspan fill="#ce9178">''</tspan><tspan fill="#ffffff">}&gt;{children}&lt;/</tspan><tspan fill="#7ec8e3" font-weight="600">button</tspan><tspan fill="#ffffff">&gt;</tspan></text>
  <text x="76" y="443" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  );</tspan></text>
  <text x="76" y="462" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">};</tspan></text>

  <!-- Panel + Usage -->
  <rect x="60" y="506" width="760" height="36" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="440" y="529" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555">Panel + 사용 예</text>
  <rect x="60" y="550" width="760" height="261" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="569" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">Tabs.Panel = </tspan><tspan fill="#7ec8e3" font-weight="600">function</tspan><tspan fill="#ffffff">({ id, children }) {</tspan></text>
  <text x="76" y="588" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> { active } = useContext(TabsContext);</tspan></text>
  <text x="76" y="607" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  if</tspan><tspan fill="#ffffff"> (active !== id) </tspan><tspan fill="#7ec8e3" font-weight="600">return</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#b5cea8">null</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="76" y="626" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  return</tspan><tspan fill="#ffffff"> &lt;</tspan><tspan fill="#7ec8e3" font-weight="600">div</tspan><tspan fill="#ffffff">&gt;{children}&lt;/</tspan><tspan fill="#7ec8e3" font-weight="600">div</tspan><tspan fill="#ffffff">&gt;;</tspan></text>
  <text x="76" y="645" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">};</tspan></text>
  <text x="76" y="664" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff"> </tspan></text>
  <text x="76" y="683" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">// 사용 — 깔끔한 선언적 API</tspan></text>
  <text x="76" y="702" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">&lt;</tspan><tspan fill="#7ec8e3" font-weight="600">Tabs</tspan><tspan fill="#ffffff"> defaultTab=</tspan><tspan fill="#ce9178">"a"</tspan><tspan fill="#ffffff">&gt;</tspan></text>
  <text x="76" y="721" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  &lt;</tspan><tspan fill="#7ec8e3" font-weight="600">Tabs.Tab</tspan><tspan fill="#ffffff"> id=</tspan><tspan fill="#ce9178">"a"</tspan><tspan fill="#ffffff">&gt;React&lt;/</tspan><tspan fill="#7ec8e3" font-weight="600">Tabs.Tab</tspan><tspan fill="#ffffff">&gt;</tspan></text>
  <text x="76" y="740" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  &lt;</tspan><tspan fill="#7ec8e3" font-weight="600">Tabs.Tab</tspan><tspan fill="#ffffff"> id=</tspan><tspan fill="#ce9178">"b"</tspan><tspan fill="#ffffff">&gt;Vue&lt;/</tspan><tspan fill="#7ec8e3" font-weight="600">Tabs.Tab</tspan><tspan fill="#ffffff">&gt;</tspan></text>
  <text x="76" y="759" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  &lt;</tspan><tspan fill="#7ec8e3" font-weight="600">Tabs.Panel</tspan><tspan fill="#ffffff"> id=</tspan><tspan fill="#ce9178">"a"</tspan><tspan fill="#ffffff">&gt;React 내용&lt;/</tspan><tspan fill="#7ec8e3" font-weight="600">Tabs.Panel</tspan><tspan fill="#ffffff">&gt;</tspan></text>
  <text x="76" y="778" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  &lt;</tspan><tspan fill="#7ec8e3" font-weight="600">Tabs.Panel</tspan><tspan fill="#ffffff"> id=</tspan><tspan fill="#ce9178">"b"</tspan><tspan fill="#ffffff">&gt;Vue 내용&lt;/</tspan><tspan fill="#7ec8e3" font-weight="600">Tabs.Panel</tspan><tspan fill="#ffffff">&gt;</tspan></text>
  <text x="76" y="797" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">&lt;/</tspan><tspan fill="#7ec8e3" font-weight="600">Tabs</tspan><tspan fill="#ffffff">&gt;</tspan></text>
</svg>
