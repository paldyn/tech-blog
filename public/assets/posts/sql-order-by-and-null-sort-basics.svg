<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <rect width="880" height="470" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle" xml:space="preserve">ORDER BY 기본과 NULL 정렬 동작</text>

  <!-- Left: basic ORDER BY examples -->
  <text x="80" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#7ec8e3" xml:space="preserve">ORDER BY 기본</text>
  <rect x="60" y="96" width="370" height="182" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="118" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 단일 컬럼 정렬</text>
  <text x="76" y="136" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ORDER BY</tspan><tspan fill="#ffffff"> name ASC    </tspan><tspan fill="#9aa4b8">-- 기본값</tspan></text>
  <text x="76" y="154" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ORDER BY</tspan><tspan fill="#ffffff"> created_at DESC</tspan></text>
  <text x="76" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 다중 컬럼: 첫 기준→같으면 두 번째</text>
  <text x="76" y="190" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ORDER BY</tspan><tspan fill="#ffffff"> dept ASC, salary DESC</tspan></text>
  <text x="76" y="208" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- SELECT 별칭 사용 가능 (마지막 실행)</text>
  <text x="76" y="226" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">SELECT</tspan><tspan fill="#ffffff"> price*</tspan><tspan fill="#b5cea8">1.1</tspan><tspan fill="#ffffff"> AS total_price</tspan></text>
  <text x="76" y="244" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ORDER BY</tspan><tspan fill="#ffffff"> total_price DESC</tspan></text>
  <text x="76" y="262" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 컬럼 번호(위치)로 정렬 (비권장)</text>

  <!-- Right: NULL sort behavior -->
  <text x="470" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e05555" xml:space="preserve">DBMS별 NULL 기본 정렬 위치</text>
  <rect x="450" y="96" width="370" height="182" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="466" y="118" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- PostgreSQL / Oracle</text>
  <text x="466" y="136" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- ASC: NULL 마지막 / DESC: NULL 처음</text>
  <text x="466" y="154" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ORDER BY</tspan><tspan fill="#ffffff"> score ASC NULLS LAST</tspan></text>
  <text x="466" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ORDER BY</tspan><tspan fill="#ffffff"> score DESC NULLS FIRST</tspan></text>
  <text x="466" y="190" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- MySQL: NULL을 가장 작은 값으로 처리</text>
  <text x="466" y="208" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- ASC: NULL 처음 / DESC: NULL 마지막</text>
  <text x="466" y="226" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- MySQL NULL 마지막 정렬 꼼수:</text>
  <text x="466" y="244" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">ORDER BY</tspan><tspan fill="#ffffff"> score </tspan><tspan fill="#7ec8e3">IS NULL</tspan><tspan fill="#ffffff">, score ASC</tspan></text>

  <!-- DBMS null sort table -->
  <text x="60" y="306" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e8e8e8" xml:space="preserve">DBMS별 NULL 기본 위치</text>
  <rect x="60" y="320" width="760" height="32" rx="4" fill="#111827"/>
  <text x="200" y="341" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle" xml:space="preserve">DBMS</text>
  <text x="440" y="341" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle" xml:space="preserve">ASC 정렬 시 NULL 위치</text>
  <text x="700" y="341" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888" text-anchor="middle" xml:space="preserve">DESC 정렬 시 NULL 위치</text>

  <rect x="60" y="352" width="760" height="28" fill="#0d1117"/>
  <text x="200" y="371" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3" text-anchor="middle" xml:space="preserve">PostgreSQL / Oracle</text>
  <text x="440" y="371" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8" text-anchor="middle" xml:space="preserve">마지막 (NULLS LAST)</text>
  <text x="700" y="371" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8" text-anchor="middle" xml:space="preserve">처음 (NULLS FIRST)</text>

  <rect x="60" y="380" width="760" height="28" fill="#111827"/>
  <text x="200" y="399" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc" text-anchor="middle" xml:space="preserve">MySQL / MariaDB</text>
  <text x="440" y="399" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555" text-anchor="middle" xml:space="preserve">처음 (가장 작은 값)</text>
  <text x="700" y="399" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555" text-anchor="middle" xml:space="preserve">마지막 (가장 작은 값)</text>

  <rect x="60" y="408" width="760" height="28" fill="#0d1117"/>
  <text x="200" y="427" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555" text-anchor="middle" xml:space="preserve">SQL Server</text>
  <text x="440" y="427" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8" text-anchor="middle" xml:space="preserve">처음</text>
  <text x="700" y="427" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e8e8e8" text-anchor="middle" xml:space="preserve">마지막</text>

  <!-- Footer -->
</svg>
