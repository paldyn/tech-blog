<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 414">
  <rect width="880" height="414" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">포커스 관리 — useRef로 포커스 제어</text>

  <!-- Left: Problem -->
  <text x="230" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="14" font-weight="600" fill="#e05555" text-anchor="middle">포커스 관리가 필요한 상황</text>

  <rect x="60" y="94" width="340" height="234" rx="8" fill="#111827" stroke="#e05555" stroke-width="1.5"/>
  <rect x="80" y="107" width="300" height="42" rx="6" fill="#1a0d0d" stroke="#e05555" stroke-width="1"/>
  <text x="230" y="125" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="12" fill="#e8e8e8" text-anchor="middle">모달이 열릴 때</text>
  <text x="230" y="143" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="11" fill="#888" text-anchor="middle">→ 모달 첫 요소로 포커스 이동 필요</text>

  <rect x="80" y="162" width="300" height="42" rx="6" fill="#1a0d0d" stroke="#e05555" stroke-width="1"/>
  <text x="230" y="180" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="12" fill="#e8e8e8" text-anchor="middle">모달이 닫힐 때</text>
  <text x="230" y="198" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="11" fill="#888" text-anchor="middle">→ 모달을 연 버튼으로 포커스 복원 필요</text>

  <rect x="80" y="217" width="300" height="42" rx="6" fill="#1a0d0d" stroke="#e05555" stroke-width="1"/>
  <text x="230" y="235" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="12" fill="#e8e8e8" text-anchor="middle">에러 발생 시</text>
  <text x="230" y="253" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="11" fill="#888" text-anchor="middle">→ 에러 메시지 또는 해당 필드로 포커스</text>

  <rect x="80" y="272" width="300" height="42" rx="6" fill="#1a0d0d" stroke="#e05555" stroke-width="1"/>
  <text x="230" y="290" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="12" fill="#e8e8e8" text-anchor="middle">라우팅 후</text>
  <text x="230" y="308" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="11" fill="#888" text-anchor="middle">→ 새 페이지 h1 또는 메인 콘텐츠로 이동</text>

  <!-- Right: Code -->
  <text x="630" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="14" font-weight="600" fill="#55c555" text-anchor="middle">useRef로 포커스 제어</text>
  <rect x="440" y="94" width="380" height="234" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="456" y="121" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" font-size="13"><tspan fill="#7ec8e3" font-weight="600">function</tspan><tspan fill="#e8e8e8"> Modal({ isOpen, onClose }) {</tspan></text>
  <text x="456" y="141" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" font-size="13"><tspan fill="#9aa4b8">  // 첫 번째 포커스 대상</tspan></text>
  <text x="456" y="161" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" font-size="13"><tspan fill="#e8e8e8">  </tspan><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#e8e8e8"> firstRef = useRef(null);</tspan></text>
  <text x="456" y="186" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" font-size="13"><tspan fill="#9aa4b8">  // 열릴 때 포커스 이동</tspan></text>
  <text x="456" y="206" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" font-size="13"><tspan fill="#e8e8e8">  useEffect(() =&gt; {</tspan></text>
  <text x="456" y="226" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" font-size="13"><tspan fill="#e8e8e8">    </tspan><tspan fill="#7ec8e3" font-weight="600">if</tspan><tspan fill="#e8e8e8"> (isOpen) firstRef.current?.focus();</tspan></text>
  <text x="456" y="246" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" font-size="13"><tspan fill="#e8e8e8">  }, [isOpen]);</tspan></text>
  <text x="456" y="271" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" font-size="13"><tspan fill="#9aa4b8">  // 닫기 버튼에 ref 연결</tspan></text>
  <text x="456" y="291" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" font-size="13"><tspan fill="#e8e8e8">  </tspan><tspan fill="#7ec8e3" font-weight="600">return</tspan><tspan fill="#e8e8e8"> &lt;button ref={firstRef}&gt;닫기&lt;/button&gt;;</tspan></text>
  <text x="456" y="311" font-family="'JetBrains Mono','Menlo','Consolas',monospace" xml:space="preserve" font-size="13"><tspan fill="#e8e8e8">}</tspan></text>

  <!-- Bottom -->
  <rect x="60" y="348" width="760" height="36" rx="6" fill="#0d1a0d" stroke="#55c555" stroke-width="1"/>
  <text x="440" y="371" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="12" fill="#55c555" text-anchor="middle">포커스 관리는 시각 장애인 사용자가 키보드만으로 앱을 쓸 수 있게 하는 핵심 요소</text>
</svg>
