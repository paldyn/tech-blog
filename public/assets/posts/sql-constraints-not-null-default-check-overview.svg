<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520">
  <rect width="880" height="520" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">컬럼 제약 조건 — NOT NULL · DEFAULT · CHECK</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">컬럼에 걸 수 있는 세 가지 기본 제약의 동작 원리</text>

  <!-- NOT NULL Box -->
  <rect x="60" y="100" width="240" height="176" rx="10" fill="#111827" stroke="#3a4a6e"/>
  <text x="180" y="128" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7ec8e3">NOT NULL</text>
  <line x1="80" y1="136" x2="280" y2="136" stroke="#3a4a6e"/>
  <text x="180" y="157" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">NULL 값 저장 거부</text>
  <text x="180" y="178" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">컬럼에 반드시 값이 있어야 함</text>
  <text x="180" y="200" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">INSERT/UPDATE 시 검사</text>
  <rect x="90" y="214" width="180" height="46" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="180" y="233" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3">email VARCHAR</text>
  <text x="180" y="251" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3">NOT NULL</text>

  <!-- DEFAULT Box -->
  <rect x="320" y="100" width="240" height="176" rx="10" fill="#111827" stroke="#3a4a6e"/>
  <text x="440" y="128" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#55c555">DEFAULT</text>
  <line x1="340" y1="136" x2="540" y2="136" stroke="#3a4a6e"/>
  <text x="440" y="157" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">기본값 자동 적용</text>
  <text x="440" y="178" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">INSERT 시 값 생략 가능</text>
  <text x="440" y="200" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">함수·리터럴 모두 허용</text>
  <rect x="350" y="214" width="180" height="46" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="440" y="233" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555">status VARCHAR</text>
  <text x="440" y="251" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555">DEFAULT 'ACTIVE'</text>

  <!-- CHECK Box -->
  <rect x="580" y="100" width="240" height="176" rx="10" fill="#111827" stroke="#3a4a6e"/>
  <text x="700" y="128" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e05555">CHECK</text>
  <line x1="600" y1="136" x2="800" y2="136" stroke="#3a4a6e"/>
  <text x="700" y="157" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">범위·조건 검사</text>
  <text x="700" y="178" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">불리언 표현식 평가</text>
  <text x="700" y="200" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">FALSE 시 에러 발생</text>
  <rect x="610" y="214" width="180" height="46" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="700" y="233" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">CHECK (age</text>
  <text x="700" y="251" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">BETWEEN 0 AND 150)</text>

  <!-- Code block -->
  <rect x="60" y="300" width="760" height="190" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="80" y="324" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#9aa4b8">-- 세 제약 조건을 함께 사용하는 예</tspan></text>
  <text x="80" y="343" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan> employees (</text>
  <text x="80" y="362" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">    emp_id     INTEGER,</text>
  <text x="80" y="381" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">    name       VARCHAR(<tspan fill="#b5cea8">100</tspan>)  <tspan fill="#7ec8e3" font-weight="600">NOT NULL</tspan>,</text>
  <text x="80" y="400" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">    hire_date  DATE          <tspan fill="#55c555" font-weight="600">DEFAULT</tspan> CURRENT_DATE,</text>
  <text x="80" y="419" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">    salary     NUMERIC(<tspan fill="#b5cea8">12</tspan>,<tspan fill="#b5cea8">2</tspan>) <tspan fill="#e05555" font-weight="600">CHECK</tspan> (salary &gt; <tspan fill="#b5cea8">0</tspan>),</text>
  <text x="80" y="438" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">    status     VARCHAR(<tspan fill="#b5cea8">20</tspan>)   <tspan fill="#55c555" font-weight="600">DEFAULT</tspan> <tspan fill="#ce9178">'ACTIVE'</tspan></text>
  <text x="80" y="457" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">        <tspan fill="#e05555" font-weight="600">CHECK</tspan> (status <tspan fill="#7ec8e3" font-weight="600">IN</tspan> (<tspan fill="#ce9178">'ACTIVE'</tspan>, <tspan fill="#ce9178">'INACTIVE'</tspan>, <tspan fill="#ce9178">'SUSPENDED'</tspan>))</text>
  <text x="80" y="476" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">);</text>
</svg>
