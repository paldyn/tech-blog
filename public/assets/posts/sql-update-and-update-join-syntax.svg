<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" style="background:#0a0a0a;border-radius:12px">
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">UPDATE 기본과 UPDATE JOIN</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">단순 수정부터 다른 테이블 참조 업데이트까지</text>

  <!-- Code block -->
  <rect x="60" y="96" width="760" height="306" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="80" y="118" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 기본 UPDATE</text>
  <text x="80" y="136" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">UPDATE</tspan><tspan fill="#ffffff"> products</tspan></text>
  <text x="80" y="154" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">SET</tspan><tspan fill="#ffffff"> price = price * </tspan><tspan fill="#b5cea8">1.1</tspan><tspan fill="#ffffff">, updated_at = </tspan><tspan fill="#7ec8e3">CURRENT_TIMESTAMP</tspan></text>
  <text x="80" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">WHERE</tspan><tspan fill="#ffffff"> category = </tspan><tspan fill="#ce9178">'electronics'</tspan><tspan fill="#ffffff">;</tspan></text>

  <text x="80" y="198" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- UPDATE JOIN (MySQL)</text>
  <text x="80" y="216" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">UPDATE</tspan><tspan fill="#ffffff"> orders o</tspan></text>
  <text x="80" y="234" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">INNER JOIN</tspan><tspan fill="#ffffff"> customers c </tspan><tspan fill="#7ec8e3">ON</tspan><tspan fill="#ffffff"> o.customer_id = c.customer_id</tspan></text>
  <text x="80" y="252" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">SET</tspan><tspan fill="#ffffff"> o.discount_rate = c.vip_discount</tspan></text>
  <text x="80" y="270" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">WHERE</tspan><tspan fill="#ffffff"> c.grade = </tspan><tspan fill="#ce9178">'VIP'</tspan><tspan fill="#ffffff">;</tspan></text>

  <text x="80" y="296" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- UPDATE FROM (PostgreSQL, 서브쿼리 대안)</text>
  <text x="80" y="314" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">UPDATE</tspan><tspan fill="#ffffff"> orders o</tspan></text>
  <text x="80" y="332" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">SET</tspan><tspan fill="#ffffff"> discount_rate = c.vip_discount</tspan></text>
  <text x="80" y="350" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">FROM</tspan><tspan fill="#ffffff"> customers c</tspan></text>
  <text x="80" y="368" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3">WHERE</tspan><tspan fill="#ffffff"> o.customer_id = c.customer_id</tspan></text>
  <text x="80" y="386" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3">AND</tspan><tspan fill="#ffffff"> c.grade = </tspan><tspan fill="#ce9178">'VIP'</tspan><tspan fill="#ffffff">;</tspan></text>

</svg>
