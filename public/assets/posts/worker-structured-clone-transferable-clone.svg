<svg xmlns="http://www.w3.org/2000/svg" width="880" height="476" viewBox="0 0 880 476">
  <rect width="880" height="476" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle"
    font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="22" font-weight="700" fill="#e8e8e8">Structured Clone · 지원 타입과 제외 타입</text>

  <!-- Supported column -->
  <rect x="60" y="66" width="440" height="356" rx="8" fill="#0d1117" stroke="#55c555" stroke-width="1.5"/>
  <text x="280" y="92" text-anchor="middle"
    font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="16" font-weight="600" fill="#55c555">✓ 복제 가능</text>

  <!-- items -->
  <text x="88" y="128" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">기본 타입</text>
  <text x="170" y="120" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#b5cea8">String, Number, Boolean,</text>
  <text x="170" y="136" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#b5cea8">null, undefined, BigInt</text>

  <line x1="80" y1="148" x2="480" y2="148" stroke="#3a4a6e" stroke-width="1"/>

  <text x="88" y="168" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">객체/배열</text>
  <text x="170" y="168" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#b5cea8">Object, Array (중첩 포함)</text>

  <line x1="80" y1="180" x2="480" y2="180" stroke="#3a4a6e" stroke-width="1"/>

  <text x="88" y="200" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">날짜·정규식</text>
  <text x="170" y="200" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#b5cea8">Date, RegExp</text>

  <line x1="80" y1="212" x2="480" y2="212" stroke="#3a4a6e" stroke-width="1"/>

  <text x="88" y="232" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">컬렉션</text>
  <text x="170" y="232" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#b5cea8">Map, Set</text>

  <line x1="80" y1="244" x2="480" y2="244" stroke="#3a4a6e" stroke-width="1"/>

  <text x="88" y="264" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">바이너리</text>
  <text x="170" y="264" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#b5cea8">ArrayBuffer, TypedArray, DataView</text>

  <line x1="80" y1="276" x2="480" y2="276" stroke="#3a4a6e" stroke-width="1"/>

  <text x="88" y="296" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">파일/이미지</text>
  <text x="170" y="296" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#b5cea8">Blob, File, ImageBitmap, ImageData</text>

  <line x1="80" y1="308" x2="480" y2="308" stroke="#3a4a6e" stroke-width="1"/>

  <text x="88" y="328" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">에러</text>
  <text x="170" y="328" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#b5cea8">Error 계열 (ES2022+)</text>

  <line x1="80" y1="340" x2="480" y2="340" stroke="#3a4a6e" stroke-width="1"/>

  <text x="88" y="360" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">순환 참조</text>
  <text x="170" y="360" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555">지원 (JSON.stringify 불가 케이스)</text>

  <line x1="80" y1="372" x2="480" y2="372" stroke="#3a4a6e" stroke-width="1"/>

  <text x="88" y="392" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">원시래퍼</text>
  <text x="170" y="392" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#b5cea8">Boolean, Number, String 객체</text>

  <!-- Not supported column -->
  <rect x="520" y="66" width="300" height="356" rx="8" fill="#0d1117" stroke="#e05555" stroke-width="1.5"/>
  <text x="670" y="92" text-anchor="middle"
    font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="16" font-weight="600" fill="#e05555">✗ 복제 불가 (에러 발생)</text>

  <text x="536" y="124" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">Function</text>
  <text x="680" y="124" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">함수는 직렬화 불가</text>

  <line x1="530" y1="136" x2="800" y2="136" stroke="#3a4a6e" stroke-width="1"/>

  <text x="536" y="156" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">Symbol</text>
  <text x="680" y="156" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">전역 Symbol 제외</text>

  <line x1="530" y1="168" x2="800" y2="168" stroke="#3a4a6e" stroke-width="1"/>

  <text x="536" y="188" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">WeakMap / WeakSet</text>
  <text x="680" y="188" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">약한 참조 특성상 불가</text>

  <line x1="530" y1="200" x2="800" y2="200" stroke="#3a4a6e" stroke-width="1"/>

  <text x="536" y="220" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">DOM 노드</text>
  <text x="680" y="220" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">Worker에 DOM 없음</text>

  <line x1="530" y1="232" x2="800" y2="232" stroke="#3a4a6e" stroke-width="1"/>

  <text x="536" y="252" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">Proxy</text>
  <text x="680" y="252" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">핸들러 복제 불가</text>

  <line x1="530" y1="264" x2="800" y2="264" stroke="#3a4a6e" stroke-width="1"/>

  <text x="536" y="284" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">클래스 인스턴스</text>
  <text x="680" y="284" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">프로토타입 체인 소실</text>

  <line x1="530" y1="296" x2="800" y2="296" stroke="#3a4a6e" stroke-width="1"/>

  <text x="536" y="316" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555">getter/setter</text>
  <text x="680" y="316" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">프로퍼티 값만 복제</text>

  <!-- note at bottom -->
  <text x="440" y="446" text-anchor="middle"
    font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
    font-size="13" fill="#7ec8e3">structuredClone(value) — Node 17+ / 모던 브라우저에서 전역 함수로 사용 가능</text>
</svg>
