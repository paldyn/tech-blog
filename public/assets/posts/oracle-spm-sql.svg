<svg xmlns="http://www.w3.org/2000/svg" width="880" height="632" viewBox="0 0 880 632">
  <rect width="880" height="632" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">SPM Baseline 캡처 및 관리</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">DBMS_SPM 패키지를 통한 수동 캡처·수락·드롭</text>

  <!-- Left: Capture from cursor cache -->
  <text x="60" y="100" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3">Cursor Cache에서 Baseline 캡처</text>
  <rect x="60" y="108" width="380" height="230" fill="#000000" rx="6" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="128" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- 현재 캐시의 SQL로 baseline 수동 생성</tspan></text>
  <text x="76" y="146" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">DECLARE</tspan><tspan fill="#ffffff"> l_plans </tspan><tspan fill="#7ec8e3" font-weight="600">PLS_INTEGER</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="76" y="164" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">BEGIN</tspan></text>
  <text x="76" y="182" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  l_plans :=</tspan></text>
  <text x="76" y="200" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    DBMS_SPM.LOAD_PLANS_FROM_CURSOR_CACHE(</tspan></text>
  <text x="76" y="218" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">      sql_id =&gt; </tspan><tspan fill="#ce9178">'abc1234xyz789'</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="76" y="236" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">      plan_hash_value =&gt; </tspan><tspan fill="#b5cea8">3456789012</tspan></text>
  <text x="76" y="254" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    );</tspan></text>
  <text x="76" y="272" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  DBMS_OUTPUT.PUT_LINE(</tspan></text>
  <text x="76" y="290" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    l_plans || </tspan><tspan fill="#ce9178">' plan(s) loaded'</tspan><tspan fill="#ffffff">);</tspan></text>
  <text x="76" y="308" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">END</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="76" y="326" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">/</tspan></text>

  <!-- Right: Query and manage baselines -->
  <text x="460" y="100" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3">Baseline 조회 및 관리</text>
  <rect x="460" y="108" width="360" height="248" fill="#000000" rx="6" stroke="#3a4a6e" stroke-width="1"/>
  <text x="476" y="128" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- Baseline 목록 조회</tspan></text>
  <text x="476" y="146" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> sql_handle, plan_name,</tspan></text>
  <text x="476" y="164" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">       enabled, accepted, fixed</tspan></text>
  <text x="476" y="182" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff">   dba_sql_plan_baselines</tspan></text>
  <text x="476" y="200" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan><tspan fill="#ffffff">  sql_text </tspan><tspan fill="#7ec8e3" font-weight="600">LIKE</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ce9178">'%EMPLOYEES%'</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="476" y="236" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- Baseline 삭제</tspan></text>
  <text x="476" y="254" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">DECLARE</tspan><tspan fill="#ffffff"> l_dropped </tspan><tspan fill="#7ec8e3" font-weight="600">PLS_INTEGER</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="476" y="272" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">BEGIN</tspan></text>
  <text x="476" y="290" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  l_dropped := DBMS_SPM.</tspan></text>
  <text x="476" y="308" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    DROP_SQL_PLAN_BASELINE(</tspan></text>
  <text x="476" y="326" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">      sql_handle =&gt; </tspan><tspan fill="#ce9178">'SQL_...'</tspan><tspan fill="#ffffff">);</tspan></text>
  <text x="476" y="344" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">END</tspan><tspan fill="#ffffff">; /</tspan></text>

  <!-- Bottom section: Evolution + activation -->
  <rect x="60" y="380" width="760" height="228" fill="#111620" rx="8" stroke="#2a3a50" stroke-width="1"/>
  <text x="440" y="404" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7ec8e3">SPM 자동 캡처 활성화 및 진화 실행</text>

  <rect x="76" y="416" width="360" height="176" fill="#000000" rx="6" stroke="#3a4a6e" stroke-width="1"/>
  <text x="92" y="436" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- 자동 캡처 ON (반복 실행 SQL)</tspan></text>
  <text x="92" y="454" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">ALTER</tspan><tspan fill="#ffffff"> SYSTEM </tspan><tspan fill="#7ec8e3" font-weight="600">SET</tspan></text>
  <text x="92" y="472" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  optimizer_capture_sql_plan_baselines</tspan></text>
  <text x="92" y="490" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    = </tspan><tspan fill="#ce9178">TRUE</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="92" y="526" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- SPM Baseline 사용 ON (기본 TRUE)</tspan></text>
  <text x="92" y="544" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">ALTER</tspan><tspan fill="#ffffff"> SYSTEM </tspan><tspan fill="#7ec8e3" font-weight="600">SET</tspan></text>
  <text x="92" y="562" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  optimizer_use_sql_plan_baselines</tspan></text>
  <text x="92" y="580" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    = </tspan><tspan fill="#ce9178">TRUE</tspan><tspan fill="#ffffff">;</tspan></text>

  <rect x="456" y="416" width="354" height="158" fill="#000000" rx="6" stroke="#3a4a6e" stroke-width="1"/>
  <text x="472" y="436" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- SPM 진화 수동 실행</tspan></text>
  <text x="472" y="454" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">DECLARE</tspan></text>
  <text x="472" y="472" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  l_report CLOB;</tspan></text>
  <text x="472" y="490" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">BEGIN</tspan></text>
  <text x="472" y="508" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  l_report :=</tspan></text>
  <text x="472" y="526" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    DBMS_SPM.EVOLVE_SQL_PLAN_BASELINE();</tspan></text>
  <text x="472" y="544" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">END</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="472" y="562" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">/</tspan></text>
</svg>
