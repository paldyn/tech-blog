<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450">
  <rect width="880" height="450" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8">Path Traversal 방어: 실제 경로 검증</text>

  <!-- Vulnerable -->
  <text x="230" y="82" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e05555">취약 코드</text>
  <rect x="60" y="94" width="340" height="124" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="114" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8">// ❌ 경로 검증 없음</tspan></text>
  <text x="76" y="132" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">app</tspan>.get(<tspan fill="#ce9178">'/files'</tspan>, (req, res) =&gt; {</text>
  <text x="76" y="150" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">const</tspan> file = req.query.name;</text>
  <text x="76" y="168" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  <tspan fill="#e05555" font-weight="600">res.sendFile</tspan>(</text>
  <text x="76" y="186" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    <tspan fill="#ce9178">`/uploads/${file}`</tspan>);</text>
  <text x="76" y="204" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">});</text>

  <!-- Safe -->
  <text x="650" y="82" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#55c555">안전 코드 (realpath 검증)</text>
  <rect x="480" y="94" width="340" height="124" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="496" y="114" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8">// ✅ realpath로 경계 검증</tspan></text>
  <text x="496" y="132" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">const</tspan> base = path.resolve(<tspan fill="#ce9178">'/uploads'</tspan>);</text>
  <text x="496" y="150" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">const</tspan> resolved = path.resolve(</text>
  <text x="496" y="168" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  base, req.query.name);</text>
  <text x="496" y="186" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">if</tspan> (!resolved.startsWith(base + <tspan fill="#ce9178">'/'</tspan>))</text>
  <text x="496" y="204" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    <tspan fill="#7ec8e3" font-weight="600">return</tspan> res.status(<tspan fill="#b5cea8">400</tspan>).send();</text>

  <!-- Python example -->
  <text x="440" y="250" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="15" font-weight="600" fill="#e8e8e8">Python os.path.realpath 패턴</text>
  <rect x="60" y="264" width="760" height="160" rx="8" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="76" y="284" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">import</tspan> os</text>
  <text x="76" y="302" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">def</tspan> safe_open(filename: str, base_dir: str = <tspan fill="#ce9178">'/app/uploads'</tspan>):</text>
  <text x="76" y="320" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    <tspan fill="#9aa4b8"># 심볼릭 링크까지 해결한 실제 절대 경로</tspan></text>
  <text x="76" y="338" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    base = os.path.realpath(base_dir)</text>
  <text x="76" y="356" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    requested = os.path.realpath(os.path.join(base_dir, filename))</text>
  <text x="76" y="374" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    <tspan fill="#7ec8e3" font-weight="600">if</tspan> <tspan fill="#7ec8e3" font-weight="600">not</tspan> requested.startswith(base + os.sep):</text>
  <text x="76" y="392" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">        <tspan fill="#e05555" font-weight="600">raise</tspan> PermissionError(<tspan fill="#ce9178">'경로 순회 감지'</tspan>)</text>
  <text x="76" y="410" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">    <tspan fill="#7ec8e3" font-weight="600">return</tspan> open(requested, <tspan fill="#ce9178">'rb'</tspan>)</text>
</svg>
