<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460">
  <rect width="880" height="460" rx="12" fill="#0a0a0a"/>

  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">NULL 허용 여부와 CHECK의 NULL 처리</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">CHECK는 NULL을 에러로 보지 않는다 — 세 값 논리(Three-Valued Logic)</text>

  <!-- Left: NULL Allowed vs Not Allowed -->
  <rect x="60" y="100" width="360" height="132" rx="10" fill="#111827" stroke="#3a4a6e"/>
  <text x="240" y="124" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#7ec8e3">NULL 허용 컬럼 vs NOT NULL 컬럼</text>
  <line x1="80" y1="132" x2="400" y2="132" stroke="#3a4a6e"/>
  <!-- Table header -->
  <text x="84" y="152" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">컬럼 정의</text>
  <text x="340" y="152" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">NULL INSERT</text>
  <!-- Row 1 -->
  <text x="84" y="174" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">col INTEGER</text>
  <text x="340" y="174" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">✓ 허용</text>
  <!-- Row 2 -->
  <text x="84" y="196" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">col INTEGER NOT NULL</text>
  <text x="340" y="196" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">✗ 에러</text>
  <!-- Row 3 -->
  <text x="84" y="218" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">col INTEGER DEFAULT 0</text>
  <text x="340" y="218" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3">0 저장</text>

  <!-- Right: Three-valued logic -->
  <rect x="460" y="100" width="360" height="132" rx="10" fill="#111827" stroke="#3a4a6e"/>
  <text x="640" y="124" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e05555">CHECK와 세 값 논리(3VL)</text>
  <line x1="480" y1="132" x2="800" y2="132" stroke="#3a4a6e"/>
  <text x="540" y="152" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">표현식 결과</text>
  <text x="700" y="152" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">CHECK 결과</text>
  <text x="540" y="174" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">TRUE</text>
  <text x="700" y="174" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">통과</text>
  <text x="540" y="196" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">FALSE</text>
  <text x="700" y="196" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555">거부 (에러)</text>
  <text x="540" y="218" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7777cc">UNKNOWN (NULL)</text>
  <text x="700" y="218" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#55c555">통과 (!)</text>

  <!-- Code block -->
  <rect x="60" y="268" width="760" height="164" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="80" y="292" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#9aa4b8">-- CHECK NULL 통과 예시</tspan></text>
  <text x="80" y="310" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan> products (</text>
  <text x="80" y="328" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">    price NUMERIC <tspan fill="#e05555" font-weight="600">CHECK</tspan> (price &gt; <tspan fill="#b5cea8">0</tspan>)</text>
  <text x="80" y="346" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">);</text>
  <text x="80" y="364" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#9aa4b8">-- price=NULL이면 NULL &gt; 0 → UNKNOWN → 통과!</tspan></text>
  <text x="80" y="382" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">INSERT INTO</tspan> products (price) <tspan fill="#7ec8e3" font-weight="600">VALUES</tspan> (<tspan fill="#7ec8e3" font-weight="600">NULL</tspan>);  <tspan fill="#9aa4b8">-- 성공!</tspan></text>
  <text x="80" y="400" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#9aa4b8">-- NULL도 막으려면 NOT NULL + CHECK를 함께 사용</tspan></text>
  <text x="80" y="418" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">    price NUMERIC <tspan fill="#7ec8e3" font-weight="600">NOT NULL</tspan> <tspan fill="#e05555" font-weight="600">CHECK</tspan> (price &gt; <tspan fill="#b5cea8">0</tspan>)</text>
</svg>
