<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580"
     style="font-family:'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="580" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="arr" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">타임존 함정 · INTERVAL 산술</text>

  <!-- ── Left: Timezone-aware vs naive ── -->
  <rect x="60" y="68" width="350" height="472" rx="8" fill="#0d0d0d" stroke="#3a4a6e"/>
  <text x="235" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#ce9178">타임존: naive vs aware</text>
  <line x1="60" y1="108" x2="410" y2="108" stroke="#2a2a3a"/>

  <!-- Naive block -->
  <rect x="78" y="118" width="314" height="62" rx="4" fill="#1a0a0a" stroke="#5a2a2a"/>
  <text x="90" y="136" font-size="12" font-weight="600" fill="#e05555">✗ Timezone-naive (TIMESTAMP)</text>
  <text x="90" y="155" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">2026-04-26 14:30:00</text>
  <text x="90" y="171" font-size="10" fill="#e05555">어느 나라 14:30인지 알 수 없음</text>

  <!-- Aware block -->
  <rect x="78" y="188" width="314" height="62" rx="4" fill="#0a1a0a" stroke="#2a5a2a"/>
  <text x="90" y="206" font-size="12" font-weight="600" fill="#55c555">✓ Timezone-aware (TIMESTAMPTZ)</text>
  <text x="90" y="225" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">2026-04-26 14:30:00+09:00</text>
  <text x="90" y="241" font-size="10" fill="#55c555">한국 시간 → 내부적으로 UTC 변환 저장</text>

  <!-- Arrow showing conversion -->
  <line x1="235" y1="250" x2="235" y2="274" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stored as UTC -->
  <rect x="78" y="274" width="314" height="44" rx="4" fill="#0a1520" stroke="#3a4a6e"/>
  <text x="90" y="291" font-size="11" fill="#888">DB 내부 저장값 (UTC):</text>
  <text x="90" y="309" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3">2026-04-26 05:30:00+00:00</text>

  <!-- Code block -->
  <rect x="78" y="330" width="314" height="196" rx="4" fill="#000000" stroke="#3a4a6e"/>
  <text x="94" y="352" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 타임존 변환 쿼리</tspan></text>
  <text x="94" y="372" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- PostgreSQL</tspan></text>
  <text x="94" y="392" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">created_at</text>
  <text x="94" y="412" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">AT TIME ZONE</tspan> <tspan fill="#ce9178">&apos;Asia/Seoul&apos;</tspan></text>
  <text x="94" y="432" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- MySQL</tspan></text>
  <text x="94" y="452" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">CONVERT_TZ</tspan>(created_at,</text>
  <text x="94" y="472" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#ce9178">&apos;UTC&apos;</tspan>, <tspan fill="#ce9178">&apos;Asia/Seoul&apos;</tspan>)</text>
  <text x="94" y="492" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- Oracle</tspan></text>
  <text x="94" y="512" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- AT TIME ZONE 'Asia/Seoul'</tspan></text>

  <!-- ── Right: INTERVAL ── -->
  <rect x="470" y="68" width="350" height="472" rx="8" fill="#0d0d0d" stroke="#3a4a6e"/>
  <text x="645" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#7777cc">INTERVAL 산술</text>
  <line x1="470" y1="108" x2="820" y2="108" stroke="#2a2a3a"/>

  <!-- INTERVAL explanation -->
  <rect x="488" y="118" width="314" height="48" rx="4" fill="#0a0a1a" stroke="#3a4a6e"/>
  <text x="500" y="138" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" font-weight="700" fill="#7777cc">INTERVAL</text>
  <text x="572" y="138" font-size="11" fill="#888">  기간/간격 타입</text>
  <text x="500" y="157" font-size="11" fill="#888">날짜·시간 값에 더하거나 뺄 수 있음</text>

  <!-- Code block: date arithmetic -->
  <rect x="488" y="178" width="314" height="196" rx="4" fill="#000000" stroke="#3a4a6e"/>
  <text x="504" y="200" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 날짜 덧셈·뺄셈</tspan></text>
  <text x="504" y="220" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">NOW() + <tspan fill="#7ec8e3" font-weight="600">INTERVAL</tspan> <tspan fill="#ce9178">&apos;7 days&apos;</tspan></text>
  <text x="504" y="240" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">NOW() + <tspan fill="#7ec8e3" font-weight="600">INTERVAL</tspan> <tspan fill="#ce9178">&apos;1 month&apos;</tspan></text>
  <text x="504" y="260" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">NOW() - <tspan fill="#7ec8e3" font-weight="600">INTERVAL</tspan> <tspan fill="#ce9178">&apos;30 minutes&apos;</tspan></text>
  <text x="504" y="280" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- 날짜 차이 계산</tspan></text>
  <text x="504" y="300" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">end_date - start_date</text>
  <text x="504" y="320" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- EXTRACT로 부분 추출</tspan></text>
  <text x="504" y="340" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">EXTRACT</tspan>(<tspan fill="#7ec8e3" font-weight="600">YEAR</tspan> <tspan fill="#7ec8e3" font-weight="600">FROM</tspan> created_at)</text>
  <text x="504" y="360" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">-- MONTH, DAY, HOUR, MINUTE, SECOND</tspan></text>

  <!-- Practical examples -->
  <rect x="488" y="386" width="314" height="102" rx="4" fill="#060e06" stroke="#2a5a2a"/>
  <text x="500" y="404" font-size="11" font-weight="600" fill="#55c555">실용 예시</text>
  <text x="500" y="422" font-size="11" fill="#888">만료 30일 전 알림:</text>
  <text x="500" y="441" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan> expires_at - NOW() &lt;</text>
  <text x="500" y="460" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">INTERVAL</tspan> <tspan fill="#ce9178">&apos;30 days&apos;</tspan></text>
  <text x="500" y="478" font-size="10" fill="#888">주문 후 30일 지난 미처리 건 조회</text>
</svg>
