<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420">
  <rect width="880" height="420" rx="12" fill="#0a0a0a"/>
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">ALTER TABLE과 테이블 락 — 운영 중 변경의 위험</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">대형 테이블 스키마 변경 전략</text>

  <!-- Risk matrix -->
  <rect x="60" y="96" width="760" height="105" rx="10" fill="#111827" stroke="#3a4a6e"/>
  <text x="440" y="118" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e8e8e8">연산별 락 수준 (PostgreSQL 기준)</text>
  <line x1="80" y1="126" x2="800" y2="126" stroke="#3a4a6e"/>
  <!-- headers -->
  <text x="200" y="146" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">연산</text>
  <text x="460" y="146" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">락 수준</text>
  <text x="700" y="146" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">DML 차단 여부</text>
  <!-- rows -->
  <text x="80" y="168" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">ADD COLUMN (nullable)</text>
  <text x="460" y="168" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">AccessExclusiveLock (짧음)</text>
  <text x="700" y="168" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">메타데이터만, 빠름</text>
  <text x="80" y="188" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">ADD NOT NULL COLUMN</text>
  <text x="460" y="188" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">테이블 리라이트</text>
  <text x="700" y="188" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">장시간 차단 위험</text>

  <!-- Solution code block -->
  <rect x="60" y="225" width="760" height="156" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="80" y="250" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- 안전한 NOT NULL 컬럼 추가 3단계 패턴</tspan></text>
  <text x="80" y="269" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- 1. NULL 허용으로 추가</tspan></text>
  <text x="80" y="288" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">ALTER</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">TABLE</tspan><tspan fill="#ffffff"> orders </tspan><tspan fill="#7ec8e3" font-weight="600">ADD</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">COLUMN</tspan><tspan fill="#ffffff"> region VARCHAR(</tspan><tspan fill="#b5cea8">20</tspan><tspan fill="#ffffff">);</tspan></text>
  <text x="80" y="307" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- 2. 기존 행 백필</tspan></text>
  <text x="80" y="326" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">UPDATE</tspan><tspan fill="#ffffff"> orders </tspan><tspan fill="#7ec8e3" font-weight="600">SET</tspan><tspan fill="#ffffff"> region = </tspan><tspan fill="#ce9178">'KR'</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan><tspan fill="#ffffff"> region </tspan><tspan fill="#7ec8e3" font-weight="600">IS</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">NULL</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="80" y="345" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- 3. NOT NULL 제약 추가</tspan></text>
  <text x="80" y="364" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">ALTER</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">TABLE</tspan><tspan fill="#ffffff"> orders </tspan><tspan fill="#7ec8e3" font-weight="600">ALTER</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">COLUMN</tspan><tspan fill="#ffffff"> region </tspan><tspan fill="#7ec8e3" font-weight="600">SET</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">NOT</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">NULL</tspan><tspan fill="#ffffff">;</tspan></text>
</svg>
