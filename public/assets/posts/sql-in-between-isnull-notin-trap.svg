<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
  <rect width="880" height="360" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle" xml:space="preserve">NOT IN의 NULL 함정 — 가장 자주 만나는 버그</text>

  <!-- Explanation -->
  <rect x="60" y="66" width="760" height="44" rx="6" fill="#1a0a0a" stroke="#e05555" stroke-width="1.5"/>
  <text x="440" y="86" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e05555" text-anchor="middle" xml:space="preserve">NOT IN 목록에 NULL이 하나라도 있으면 전체 쿼리가 0행을 반환한다</text>
  <text x="440" y="104" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888" text-anchor="middle" xml:space="preserve">이유: 1 NOT IN (2, 3, NULL) → 1≠2 AND 1≠3 AND 1≠NULL → TRUE AND TRUE AND UNKNOWN → UNKNOWN</text>

  <!-- Left: Problem code -->
  <text x="80" y="140" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e05555" xml:space="preserve">문제 상황</text>
  <rect x="60" y="154" width="370" height="144" rx="6" fill="#000000" stroke="#e05555" stroke-width="1"/>
  <text x="76" y="176" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- subquery 결과에 NULL 포함 가능</text>
  <text x="76" y="194" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> * </tspan><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff"> orders</tspan></text>
  <text x="76" y="212" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan><tspan fill="#ffffff"> user_id </tspan><tspan fill="#7ec8e3" font-weight="600">NOT IN</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="76" y="230" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    SELECT</tspan><tspan fill="#ffffff"> user_id</tspan></text>
  <text x="76" y="248" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    FROM</tspan><tspan fill="#ffffff"> blacklist );</tspan></text>
  <text x="76" y="266" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#e05555" xml:space="preserve">-- blacklist.user_id에 NULL 있으면 0행!</text>
  <text x="76" y="284" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- 실제 버그: 블랙리스트가 전혀 없는 것처럼</text>

  <!-- Right: Solution code -->
  <text x="470" y="140" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555" xml:space="preserve">해결책</text>
  <rect x="450" y="154" width="370" height="144" rx="6" fill="#000000" stroke="#55c555" stroke-width="1"/>
  <text x="466" y="176" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8" xml:space="preserve">-- NOT EXISTS 사용 (NULL 안전)</text>
  <text x="466" y="194" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> * </tspan><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff"> orders o</tspan></text>
  <text x="466" y="212" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">WHERE NOT EXISTS</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="466" y="230" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    SELECT</tspan><tspan fill="#b5cea8"> 1</tspan><tspan fill="#7ec8e3" font-weight="600"> FROM</tspan><tspan fill="#ffffff"> blacklist b</tspan></text>
  <text x="466" y="248" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    WHERE</tspan><tspan fill="#ffffff"> b.user_id = o.user_id</tspan></text>
  <text x="466" y="266" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">);</text>
  <text x="466" y="284" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555" xml:space="preserve">-- NULL에 안전 + 성능도 일반적으로 우수</text>
</svg>
