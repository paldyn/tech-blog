<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">제약 패턴 — 실전 활용</text>
  <text x="440" y="74" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">extends + keyof + 인덱스 타입으로 강력한 추상화 구성</text>

  <!-- Left: deep-get pattern -->
  <text x="60" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">getProperty — 인덱스 타입 T[K]</text>
  <rect x="60" y="116" width="380" height="262" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="142" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// T[K] — 인덱스 접근 타입</text>
  <text x="76" y="160" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> getProperty&lt;</tspan></text>
  <text x="76" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  T, K </tspan><tspan fill="#7ec8e3">extends</tspan><tspan fill="#7ec8e3"> keyof</tspan><tspan fill="#ffffff"> T</tspan></text>
  <text x="76" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">&gt;(obj: T, key: K): T[K] {</text>
  <text x="76" y="214" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  return</tspan><tspan fill="#ffffff"> obj[key];</tspan></text>
  <text x="76" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>
  <text x="76" y="268" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">const</tspan><tspan fill="#ffffff"> user = { id: </tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">, name: </tspan><tspan fill="#ce9178">"Alice"</tspan><tspan fill="#ffffff"> };</tspan></text>
  <text x="76" y="304" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">getProperty(user, </tspan><tspan fill="#ce9178">"id"</tspan><tspan fill="#ffffff">);   </tspan><tspan fill="#9aa4b8">// number</tspan></text>
  <text x="76" y="322" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">getProperty(user, </tspan><tspan fill="#ce9178">"name"</tspan><tspan fill="#ffffff">); </tspan>  <tspan fill="#9aa4b8">// string</tspan></text>
  <text x="76" y="358" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">getProperty(user, </tspan><tspan fill="#ce9178">"age"</tspan><tspan fill="#ffffff">);  </tspan><tspan fill="#e05555">// TS2345 ❌</tspan></text>

  <!-- Right: factory constructor constraint -->
  <text x="470" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">생성자 제약 · 재귀 제약</text>
  <rect x="470" y="116" width="350" height="262" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="486" y="142" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// new() 생성자 제약</text>
  <text x="486" y="160" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> create&lt;T&gt;(</tspan></text>
  <text x="486" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  Ctor: </tspan><tspan fill="#7ec8e3">new</tspan><tspan fill="#ffffff">() =&gt; T</tspan></text>
  <text x="486" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">): T {</text>
  <text x="486" y="214" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  return</tspan><tspan fill="#7ec8e3"> new</tspan><tspan fill="#ffffff"> Ctor();</tspan></text>
  <text x="486" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>
  <text x="486" y="268" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 재귀 제약 (Comparable 패턴)</text>
  <text x="486" y="286" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> maxOf&lt;T </tspan><tspan fill="#7ec8e3">extends</tspan></text>
  <text x="486" y="304" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  { compareTo(o: T): </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff"> }&gt;</tspan></text>
  <text x="486" y="322" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  (a: T, b: T): T {</text>
  <text x="486" y="340" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  return</tspan><tspan fill="#ffffff"> a.compareTo(b) &gt; </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff"> ? a : b;</tspan></text>
  <text x="486" y="358" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>
</svg>
