<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452">
  <rect width="880" height="452" fill="#0a0a0a" rx="12"/>
  <text x="440" y="42" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">as const — 리터럴 타입 고정</text>
  <text x="440" y="64" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#888">TypeScript 3.4+: 값을 가장 좁은 리터럴 타입으로 추론</text>

  <!-- Without as const -->
  <rect x="60" y="84" width="360" height="212" rx="8" fill="#1a0a0a" stroke="#e05555" stroke-width="2"/>
  <text x="240" y="112" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e05555">as const 없이</text>
  <rect x="74" y="124" width="332" height="160" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="90" y="144" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan> config = {</text>
  <text x="90" y="164" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">  host: <tspan fill="#ce9178">"localhost"</tspan>,</text>
  <text x="90" y="184" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">  port: <tspan fill="#b5cea8">3000</tspan></text>
  <text x="90" y="204" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">}</text>
  <text x="90" y="228" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#9aa4b8">// 추론 타입: {</tspan></text>
  <text x="90" y="248" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#9aa4b8">//   host: string  (넓음)</tspan></text>
  <text x="90" y="268" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#9aa4b8">//   port: number  (넓음)</tspan></text>

  <!-- With as const -->
  <rect x="460" y="84" width="360" height="212" rx="8" fill="#0a1a0a" stroke="#55c555" stroke-width="2"/>
  <text x="640" y="112" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555">as const 사용</text>
  <rect x="474" y="124" width="332" height="160" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="490" y="144" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan> config = {</text>
  <text x="490" y="164" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">  host: <tspan fill="#ce9178">"localhost"</tspan>,</text>
  <text x="490" y="184" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">  port: <tspan fill="#b5cea8">3000</tspan></text>
  <text x="490" y="204" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve">} <tspan fill="#7ec8e3" font-weight="600">as</tspan> <tspan fill="#7ec8e3" font-weight="600">const</tspan></text>
  <text x="490" y="228" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#9aa4b8">// 추론 타입: {</tspan></text>
  <text x="490" y="248" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#55c555">//   host: "localhost"  (리터럴)</tspan></text>
  <text x="490" y="268" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#55c555">//   port: 3000  (리터럴)</tspan></text>

  <!-- Practical use: union from array -->
  <rect x="60" y="316" width="760" height="120" rx="8" fill="#0d1627" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="440" y="340" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">실용 패턴: 배열에서 유니온 타입 추출</text>
  <rect x="74" y="352" width="736" height="72" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="90" y="380" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan> ROLES = [<tspan fill="#ce9178">"admin"</tspan>, <tspan fill="#ce9178">"user"</tspan>, <tspan fill="#ce9178">"guest"</tspan>] <tspan fill="#7ec8e3" font-weight="600">as</tspan> <tspan fill="#7ec8e3" font-weight="600">const</tspan></text>
  <text x="90" y="402" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">type</tspan> Role = <tspan fill="#7ec8e3" font-weight="600">typeof</tspan> ROLES[<tspan fill="#b5cea8">number</tspan>];  <tspan fill="#9aa4b8">// "admin" | "user" | "guest"</tspan></text>
</svg>