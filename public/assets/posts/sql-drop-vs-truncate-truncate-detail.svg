<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" style="background:#0a0a0a;border-radius:12px">
  <rect width="880" height="390" rx="12" fill="#0a0a0a"/>
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">TRUNCATE 주의사항</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">FK 참조, RESTART IDENTITY, CASCADE</text>

  <!-- Warning boxes -->
  <rect x="60" y="96" width="360" height="100" rx="10" fill="#1a0a0a" stroke="#e05555" stroke-width="1"/>
  <text x="240" y="118" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#e05555">FK 참조 테이블 TRUNCATE</text>
  <text x="80" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">자식 테이블이 참조하는 부모</text>
  <text x="80" y="162" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">테이블은 TRUNCATE 불가</text>
  <text x="80" y="182" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">→ CASCADE 옵션으로 함께 삭제</text>

  <rect x="460" y="96" width="360" height="100" rx="10" fill="#0a1a0a" stroke="#55c555" stroke-width="1"/>
  <text x="640" y="118" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#55c555">RESTART IDENTITY</text>
  <text x="480" y="142" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">시퀀스·AUTO_INCREMENT를</text>
  <text x="480" y="162" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#e8e8e8">1부터 다시 시작</text>
  <text x="480" y="182" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">→ PostgreSQL 옵션</text>

  <!-- Code block -->
  <rect x="60" y="220" width="760" height="136" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="80" y="242" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8">-- 시퀀스 초기화하며 TRUNCATE (PostgreSQL)</tspan></text>
  <text x="80" y="260" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">TRUNCATE TABLE</tspan> orders <tspan fill="#7ec8e3" font-weight="600">RESTART IDENTITY</tspan>;</text>
  <text x="80" y="282" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8">-- FK 자식 테이블도 함께 TRUNCATE (PostgreSQL)</tspan></text>
  <text x="80" y="300" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">TRUNCATE TABLE</tspan> customers <tspan fill="#7ec8e3" font-weight="600">CASCADE</tspan>;</text>
  <text x="80" y="322" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#9aa4b8">-- IF EXISTS로 없는 테이블 에러 방지</tspan></text>
  <text x="80" y="340" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">DROP TABLE IF EXISTS</tspan> temp_session_data;</text>
</svg>
