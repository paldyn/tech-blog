<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
  <rect width="880" height="480" fill="#0a0a0a" rx="12"/>

  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">다형성 관계 문제와 해법</text>
  <text x="440" y="68" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" fill="#888">댓글(Comment)이 여러 엔티티에 속하는 경우</text>

  <!-- Problem side -->
  <rect x="60" y="86" width="360" height="350" rx="8" fill="#0d0d0d" stroke="#e05555" stroke-width="1.5"/>
  <text x="240" y="110" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#e05555">안티패턴: 다형성 FK</text>
  <text x="240" y="130" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">target_type + target_id</text>

  <rect x="76" y="140" width="328" height="182" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="92" y="163" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- 하나의 FK가 여러 테이블 참조</tspan></text>
  <text x="92" y="181" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#ffffff"> comments (</tspan></text>
  <text x="92" y="199" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  id          BIGINT </tspan><tspan fill="#7ec8e3" font-weight="600">PRIMARY KEY</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="92" y="217" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  target_type </tspan><tspan fill="#7ec8e3" font-weight="600">VARCHAR</tspan><tspan fill="#ffffff">(20),</tspan></text>
  <text x="92" y="235" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  target_id   </tspan><tspan fill="#7ec8e3" font-weight="600">BIGINT</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="92" y="253" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  body        </tspan><tspan fill="#7ec8e3" font-weight="600">TEXT</tspan></text>
  <text x="92" y="271" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">);</tspan></text>
  <text x="92" y="289" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- target_id는 FOREIGN KEY가 아님!</tspan></text>
  <text x="92" y="307" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- 참조 무결성 DB 레벨 보장 불가</tspan></text>

  <text x="80" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">문제점:</text>
  <text x="80" y="364" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 참조 무결성 없음</text>
  <text x="80" y="382" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• 고아(Orphan) 레코드 발생</text>
  <text x="80" y="400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#b0b0b0">• JOIN 쿼리 복잡</text>

  <!-- Solution side: exclusive arc -->
  <rect x="460" y="86" width="360" height="350" rx="8" fill="#0d0d0d" stroke="#55c555" stroke-width="1.5"/>
  <text x="640" y="110" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="700" fill="#55c555">해법: Exclusive Arc (FK 분리)</text>
  <text x="640" y="130" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">각 FK 컬럼 + CHECK</text>

  <rect x="476" y="140" width="328" height="236" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="492" y="163" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">-- FK를 컬럼으로 분리</tspan></text>
  <text x="492" y="181" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#ffffff"> comments (</tspan></text>
  <text x="492" y="199" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  id         BIGINT </tspan><tspan fill="#7ec8e3" font-weight="600">PRIMARY KEY</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="492" y="217" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7777cc">  post_id    </tspan><tspan fill="#ffffff">BIGINT </tspan><tspan fill="#7ec8e3" font-weight="600">REFERENCES</tspan><tspan fill="#ffffff"> posts,</tspan></text>
  <text x="492" y="235" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7777cc">  product_id </tspan><tspan fill="#ffffff">BIGINT</tspan></text>
  <text x="492" y="253" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">REFERENCES</tspan><tspan fill="#ffffff"> products,</tspan></text>
  <text x="492" y="271" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  body       TEXT,</tspan></text>
  <text x="492" y="289" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#9aa4b8">  -- 정확히 하나만 NOT NULL</tspan></text>
  <text x="492" y="307" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3" font-weight="600">  CHECK</tspan><tspan fill="#ffffff"> ((post_id </tspan><tspan fill="#7ec8e3" font-weight="600">IS NOT NULL</tspan><tspan fill="#ffffff">)::INT</tspan></text>
  <text x="492" y="325" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    + (product_id </tspan><tspan fill="#7ec8e3" font-weight="600">IS NOT NULL</tspan><tspan fill="#ffffff">)::INT</tspan></text>
  <text x="492" y="343" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">    = 1)</tspan></text>
  <text x="492" y="361" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">);</tspan></text>

  <text x="476" y="402" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#55c555">장점: 참조 무결성 보장</text>
  <text x="476" y="420" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#e05555">단점: 타입 추가 시 컬럼 추가</text>

  <!-- Bottom line -->
  <text x="440" y="462" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#555">최선의 해법: 수퍼타입 테이블(댓글 대상 추상화) + CTI 패턴으로 다형성 제거</text>
</svg>
