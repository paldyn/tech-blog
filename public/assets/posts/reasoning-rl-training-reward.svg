<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510">
  <rect x="0" y="0" width="880" height="510" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">보상을 어디서 가져오는가</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">보상 함수의 빈틈은 그대로 학습 목표가 된다. 속일 수 없는 신호만 0/1로 쓴다</text>

  <text x="50" y="110" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#55c555">규칙 기반 검증</text>
  <text x="470" y="110" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#e05555">모델 판정</text>

  <rect x="50" y="126" width="360" height="142" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text xml:space="preserve" x="66" y="154" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">def</tspan> reward(out, task):</text>
  <text xml:space="preserve" x="66" y="174" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">    # 실행 결과로만 판정</text>
  <text xml:space="preserve" x="66" y="194" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    ok = run_tests(out, task)</text>
  <text xml:space="preserve" x="66" y="214" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    <tspan fill="#7ec8e3" font-weight="600">if not</tspan> has_tag(out):</text>
  <text xml:space="preserve" x="66" y="234" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">        <tspan fill="#7ec8e3" font-weight="600">return</tspan> <tspan fill="#b5cea8">0.0</tspan></text>
  <text xml:space="preserve" x="66" y="254" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    <tspan fill="#7ec8e3" font-weight="600">return</tspan> <tspan fill="#b5cea8">1.0</tspan> <tspan fill="#7ec8e3" font-weight="600">if</tspan> ok <tspan fill="#7ec8e3" font-weight="600">else</tspan> <tspan fill="#b5cea8">0.0</tspan></text>

  <rect x="470" y="126" width="360" height="142" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text xml:space="preserve" x="486" y="154" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">def</tspan> reward(out, task):</text>
  <text xml:space="preserve" x="486" y="174" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">    # 판정 모델이 점수를 준다</text>
  <text xml:space="preserve" x="486" y="194" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    s = judge_model(out)</text>
  <text xml:space="preserve" x="486" y="214" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    <tspan fill="#7ec8e3" font-weight="600">return</tspan> s</text>
  <text xml:space="preserve" x="486" y="254" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8"># judge의 빈틈이 곧 보상이 된다</text>

  <rect x="50" y="296" width="360" height="98" rx="8" fill="#12121a" stroke="#55c555" stroke-width="1"/>
  <text x="72" y="322" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">속일 방법이 구조적으로 없다</text>
  <text x="72" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">테스트가 통과하거나 통과하지 않거나 둘 중 하나</text>
  <text x="72" y="366" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">채점 비용이 싸고 배치로 대량 실행이 가능</text>
  <text x="72" y="386" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">한계: 적용 가능한 문제 종류가 한정된다</text>

  <rect x="470" y="296" width="360" height="98" rx="8" fill="#12121a" stroke="#e05555" stroke-width="1"/>
  <text x="492" y="322" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e05555">판정자의 취향을 학습한다</text>
  <text x="492" y="346" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">길게 쓸수록 점수가 오르면 답이 계속 길어진다</text>
  <text x="492" y="366" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">확신 어투 · 형식 흉내로 가산점을 챙긴다</text>
  <text x="492" y="386" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">쓸 수는 있지만 감시 지표가 반드시 붙어야 한다</text>

  <rect x="50" y="418" width="780" height="76" rx="8" fill="#12121a" stroke="#2a2a35" stroke-width="1"/>
  <text x="72" y="442" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">실무 조합</text>
  <text x="72" y="464" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">검증 가능한 부분은 규칙으로 0/1을 주고, 문체·유용성처럼 채점이 애매한 부분은 별도 단계에서 다룬다.</text>
  <text x="72" y="482" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">하나의 보상 함수에 둘을 섞어 넣으면 최적화는 언제나 속이기 쉬운 쪽으로 쏠린다.</text>
</svg>
