<svg width="880" height="520" viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect width="880" height="520" rx="12" fill="#0a0a0a"/>

  <text x="440" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">Realtime — 변경이 구독자에게 전파되는 과정</text>

  <!-- 1행: 발신 흐름 -->
  <rect x="50" y="150" width="160" height="90" rx="10" fill="#151515" stroke="#333333" stroke-width="1.5"/>
  <text x="130" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">클라이언트 A</text>
  <text x="130" y="210" text-anchor="middle" font-size="11" fill="#888">INSERT 실행</text>

  <rect x="290" y="150" width="170" height="90" rx="10" fill="#10161c" stroke="#55c555" stroke-width="1.5"/>
  <text x="375" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PostgreSQL</text>
  <text x="375" y="210" text-anchor="middle" font-size="11" fill="#888">WAL에 변경 기록</text>

  <rect x="540" y="150" width="170" height="90" rx="10" fill="#151515" stroke="#333333" stroke-width="1.5"/>
  <text x="625" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">Realtime 서버</text>
  <text x="625" y="210" text-anchor="middle" font-size="11" fill="#888">WAL 스트림 구독</text>

  <!-- 2행: 구독자 -->
  <rect x="430" y="340" width="160" height="80" rx="10" fill="#151515" stroke="#333333" stroke-width="1.5">
    <animate attributeName="stroke" values="#333333;#333333;#55c555;#333333" keyTimes="0;0.86;0.92;1" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <text x="510" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">클라이언트 B</text>
  <text x="510" y="394" text-anchor="middle" font-size="11" fill="#55c555">웹소켓 구독 중</text>

  <rect x="650" y="340" width="160" height="80" rx="10" fill="#151515" stroke="#333333" stroke-width="1.5">
    <animate attributeName="stroke" values="#333333;#333333;#55c555;#333333" keyTimes="0;0.86;0.92;1" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <text x="730" y="372" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">클라이언트 C</text>
  <text x="730" y="394" text-anchor="middle" font-size="11" fill="#55c555">웹소켓 구독 중</text>

  <!-- 화살표 -->
  <line x1="210" y1="195" x2="289" y2="195" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="250" y="177" text-anchor="middle" font-size="12" fill="#7ec8e3">① INSERT</text>

  <line x1="460" y1="195" x2="539" y2="195" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="500" y="177" text-anchor="middle" font-size="12" fill="#7ec8e3">② WAL 감지</text>

  <line x1="590" y1="240" x2="514" y2="339" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="660" y1="240" x2="736" y2="339" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="625" y="300" text-anchor="middle" font-size="12" fill="#7ec8e3">③ 브로드캐스트</text>

  <!-- 순차 이동 애니메이션 (주기 3.6s) -->
  <circle r="4" fill="#55c555">
    <animateMotion path="M 214 195 L 285 195" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.25;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.26;1" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#55c555" opacity="0">
    <animateMotion path="M 464 195 L 535 195" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.33;0.58;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.56;0.58;1" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#55c555" opacity="0">
    <animateMotion path="M 590 244 L 520 333" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.66;0.91;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.65;0.67;0.89;0.91;1" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#55c555" opacity="0">
    <animateMotion path="M 660 244 L 730 333" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.66;0.91;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.65;0.67;0.89;0.91;1" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <text x="440" y="482" text-anchor="middle" font-size="12" fill="#888">폴링 없음 — 데이터베이스의 WAL을 구독해 변경을 곧바로 밀어(push) 보낸다</text>
</svg>
