<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <rect width="880" height="520" fill="#0a0a0a" rx="12"/>
  <defs>
    <marker id="arrB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
    <marker id="arrG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="arrP" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">해시 인덱스 구조</text>
  <text x="440" y="72" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">해시 함수로 버킷을 결정 — 등치(=) 검색 O(1), 범위 검색 불가</text>

  <!-- Hash function box -->
  <rect x="60" y="95" width="200" height="54" fill="#0d0d18" rx="8" stroke="#7777cc" stroke-width="1.5"/>
  <text x="160" y="117" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#7777cc">해시 함수</text>
  <text x="160" y="137" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">hash(key) mod N</text>

  <!-- Input keys -->
  <rect x="60" y="205" width="85" height="30" fill="#1a1a1a" rx="4" stroke="#666"/>
  <text x="102" y="225" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">'alice'</text>

  <rect x="155" y="205" width="85" height="30" fill="#1a1a1a" rx="4" stroke="#666"/>
  <text x="197" y="225" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">'bob'</text>

  <text x="150" y="258" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">입력 키</text>

  <!-- Arrows from input to hash -->
  <line x1="102" y1="205" x2="128" y2="149" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrP)"/>
  <line x1="197" y1="205" x2="172" y2="149" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrP)"/>

  <!-- Hash result arrows -->
  <line x1="260" y1="122" x2="380" y2="170" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="260" y1="122" x2="380" y2="240" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="260" y1="122" x2="380" y2="310" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="260" y1="122" x2="380" y2="380" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- Hash Bucket array -->
  <text x="430" y="138" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">버킷 배열</text>

  <rect x="380" y="152" width="100" height="36" fill="#0d1520" rx="4" stroke="#3a4a6e"/>
  <text x="430" y="175" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">Bucket[0]</text>

  <rect x="380" y="222" width="100" height="36" fill="#0d1520" rx="4" stroke="#7ec8e3" stroke-width="2"/>
  <text x="430" y="245" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#7ec8e3">Bucket[1]</text>

  <rect x="380" y="292" width="100" height="36" fill="#0d1520" rx="4" stroke="#55c555" stroke-width="2"/>
  <text x="430" y="315" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#55c555">Bucket[2]</text>

  <rect x="380" y="362" width="100" height="36" fill="#0d1520" rx="4" stroke="#3a4a6e"/>
  <text x="430" y="385" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">Bucket[3]</text>

  <!-- Bucket 1 → 'bob' entry -->
  <line x1="480" y1="240" x2="540" y2="240" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>
  <rect x="540" y="218" width="140" height="44" fill="#111" rx="4" stroke="#7ec8e3"/>
  <text x="610" y="236" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">'bob'</text>
  <text x="610" y="253" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#9aa4b8">→ heap tid (3,5)</text>

  <!-- Bucket 2 → 'alice' entry -->
  <line x1="480" y1="310" x2="540" y2="310" stroke="#55c555" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="540" y="288" width="140" height="44" fill="#111" rx="4" stroke="#55c555"/>
  <text x="610" y="306" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">'alice'</text>
  <text x="610" y="323" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#9aa4b8">→ heap tid (1,2)</text>

  <!-- Collision chain -->
  <text x="770" y="270" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">충돌(Collision)</text>
  <text x="770" y="286" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#888">발생 시 체인</text>
  <line x1="680" y1="310" x2="720" y2="310" stroke="#888" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="720" y="295" width="100" height="30" fill="#1a1a1a" rx="4" stroke="#666"/>
  <text x="770" y="314" text-anchor="middle" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="11" fill="#9aa4b8">'carol' → …</text>

  <!-- B-Tree comparison box -->
  <rect x="60" y="440" width="760" height="54" fill="#111" rx="6" stroke="#3a4a6e"/>
  <text x="260" y="461" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#7ec8e3">해시 인덱스</text>
  <text x="260" y="480" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">등치 조건 O(1) · 범위/정렬 불가</text>
  <line x1="440" y1="448" x2="440" y2="486" stroke="#3a4a6e"/>
  <text x="620" y="461" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">B-Tree 인덱스</text>
  <text x="620" y="480" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">범위/정렬 가능 · 등치 O(log n)</text>
</svg>
