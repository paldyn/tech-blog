<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
  <rect width="880" height="420" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle" xml:space="preserve">가독성 향상 — 인라인 뷰 vs CTE</text>

  <!-- Left: Inline view (hard to read) -->
  <text x="80" y="80" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#e05555" xml:space="preserve">중첩 서브쿼리 (가독성 나쁨)</text>
  <rect x="60" y="94" width="370" height="232" rx="6" fill="#000000" stroke="#e05555" stroke-width="1"/>
  <text x="76" y="119" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> dept, avg_sal</tspan></text>
  <text x="76" y="138" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan></text>
  <text x="76" y="157" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  (</tspan></text>
  <text x="76" y="176" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> dept,</tspan></text>
  <text x="76" y="195" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">      </tspan><tspan fill="#7ec8e3" font-weight="600">AVG</tspan><tspan fill="#ffffff">(salary) avg_sal</tspan></text>
  <text x="76" y="214" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff"> employees</tspan></text>
  <text x="76" y="233" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">GROUP</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">BY</tspan><tspan fill="#ffffff"> dept</tspan></text>
  <text x="76" y="252" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  ) </tspan><tspan fill="#7ec8e3" font-weight="600">AS</tspan><tspan fill="#ffffff"> dept_avg</tspan></text>
  <text x="76" y="271" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan><tspan fill="#ffffff"> avg_sal &gt; </tspan><tspan fill="#b5cea8">50000</tspan></text>
  <text x="76" y="290" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">ORDER</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">BY</tspan><tspan fill="#ffffff"> avg_sal </tspan><tspan fill="#7ec8e3" font-weight="600">DESC</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="76" y="309" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#e05555">-- 중첩이 깊어지면 이해하기 어려움</tspan></text>

  <!-- Right: CTE (readable) -->
  <text x="470" y="80" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="15" font-weight="600" fill="#55c555" xml:space="preserve">CTE 사용 (가독성 좋음)</text>
  <rect x="450" y="94" width="370" height="232" rx="6" fill="#000000" stroke="#55c555" stroke-width="1"/>
  <text x="466" y="119" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- CTE로 의미 단위 분리</tspan></text>
  <text x="466" y="138" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">WITH</tspan><tspan fill="#ffffff"> dept_avg </tspan><tspan fill="#7ec8e3" font-weight="600">AS</tspan><tspan fill="#ffffff"> (</tspan></text>
  <text x="466" y="157" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> dept,</tspan></text>
  <text x="466" y="176" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    </tspan><tspan fill="#7ec8e3" font-weight="600">AVG</tspan><tspan fill="#ffffff">(salary) </tspan><tspan fill="#7ec8e3" font-weight="600">AS</tspan><tspan fill="#ffffff"> avg_sal</tspan></text>
  <text x="466" y="195" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff"> employees</tspan></text>
  <text x="466" y="214" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  </tspan><tspan fill="#7ec8e3" font-weight="600">GROUP</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">BY</tspan><tspan fill="#ffffff"> dept</tspan></text>
  <text x="466" y="233" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">)</tspan></text>
  <text x="466" y="252" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">SELECT</tspan><tspan fill="#ffffff"> dept, avg_sal</tspan></text>
  <text x="466" y="271" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">FROM</tspan><tspan fill="#ffffff"> dept_avg</tspan></text>
  <text x="466" y="290" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">WHERE</tspan><tspan fill="#ffffff"> avg_sal &gt; </tspan><tspan fill="#b5cea8">50000</tspan></text>
  <text x="466" y="309" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">ORDER</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#7ec8e3" font-weight="600">BY</tspan><tspan fill="#ffffff"> avg_sal </tspan><tspan fill="#7ec8e3" font-weight="600">DESC</tspan><tspan fill="#ffffff">;</tspan></text>

  <!-- Best practice summary -->
  <rect x="60" y="346" width="760" height="40" rx="6" fill="#0a1020" stroke="#7ec8e3" stroke-width="1"/>
  <text x="440" y="370" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#7ec8e3" text-anchor="middle" xml:space="preserve">중첩이 깊어지면 CTE로 분리 — 이름이 생기면 의도가 명확해진다</text>
</svg>
