<svg xmlns="http://www.w3.org/2000/svg" width="880" viewBox="0 0 880 400" style="background:#0a0a0a;border-radius:12px">
  <!-- Title -->
  <text x="440" y="44" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8" text-anchor="middle">get / set 코드 패턴</text>

  <!-- Code block -->
  <rect x="60" y="64" width="760" height="302" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <text x="76" y="92" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#7ec8e3" font-weight="600">class</text>
  <text x="122" y="92" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff"> Temperature {</text>
  <text x="76" y="114" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  private</tspan><tspan fill="#ffffff"> _celsius: </tspan><tspan fill="#7ec8e3" font-weight="600">number</tspan>   <tspan fill="#ffffff">;</tspan></text>
  

  <text x="76" y="148" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  constructor</tspan><tspan fill="#ffffff">(c: </tspan><tspan fill="#7ec8e3" font-weight="600">number</tspan>   <tspan fill="#ffffff">) { </tspan><tspan fill="#7ec8e3" font-weight="600">this</tspan><tspan fill="#ffffff">._celsius = c; }</tspan></text>
  
  

  <text x="76" y="182" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#9aa4b8">  // getter</text>
  <text x="76" y="202" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  get</tspan><tspan fill="#ffffff"> fahrenheit(): </tspan><tspan fill="#7ec8e3" font-weight="600">number</tspan>    <tspan fill="#ffffff"> {</tspan></text>
  
  <text x="76" y="222" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    return</tspan><tspan fill="#7ec8e3" font-weight="600"> this</tspan><tspan fill="#ffffff">._celsius * </tspan><tspan fill="#b5cea8">9</tspan><tspan fill="#ffffff"> / </tspan><tspan fill="#b5cea8">5</tspan><tspan fill="#ffffff"> + </tspan><tspan fill="#b5cea8">32</tspan><tspan fill="#ffffff">;</tspan></text>
  
  
  
  
  <text x="76" y="242" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">  }</text>

  <text x="76" y="276" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#9aa4b8">  // setter — 유효성 검사 포함</text>
  <text x="76" y="296" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  set</tspan><tspan fill="#ffffff"> celsius(v: </tspan><tspan fill="#7ec8e3" font-weight="600">number</tspan><tspan fill="#ffffff">) {</tspan></text>
  
  <text x="76" y="316" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    if</tspan><tspan fill="#ffffff"> (v </tspan><tspan fill="#ffffff">&lt; -</tspan><tspan fill="#b5cea8">273.15</tspan><tspan fill="#ffffff">) </tspan><tspan fill="#7ec8e3" font-weight="600">throw new</tspan><tspan fill="#ffffff"> Error(</tspan><tspan fill="#ce9178">"절대영도 이하"</tspan><tspan fill="#ffffff">);</tspan></text>
  
  
  
  
  <text x="76" y="336" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">    this</tspan><tspan fill="#ffffff">._celsius = v;  }</tspan></text>
  <text x="76" y="356" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve" fill="#ffffff">}</text>
</svg>
