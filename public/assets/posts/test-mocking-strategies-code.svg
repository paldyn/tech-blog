<svg xmlns="http://www.w3.org/2000/svg" width="880" height="496" viewBox="0 0 880 496">
  <rect width="880" height="496" fill="#0a0a0a" rx="12"/>

  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="22" font-weight="700" fill="#e8e8e8">Mock 전략 코드 패턴</text>

  <!-- Left: Module mock -->
  <text x="60" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#7ec8e3">모듈 목 (vi.mock)</text>
  <rect x="60" y="94" width="370" height="236" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <!-- Right: Spy vs boundary -->
  <text x="450" y="82" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#55c555">Spy — 실제 동작 유지하며 검증</text>
  <rect x="450" y="94" width="370" height="236" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <!-- Bottom: Boundary guideline -->
  <text x="60" y="362" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="14" font-weight="600" fill="#e8e8e8">목 경계 설정 원칙</text>
  <rect x="60" y="376" width="760" height="100" rx="8" fill="#111827" stroke="#3a4a6e" stroke-width="1"/>
  <text x="80" y="400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#55c555">목킹할 대상</text>
  <text x="300" y="400" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#e8e8e8">외부 HTTP API · DB · 파일시스템 · 이메일 · 타이머</text>
  <text x="80" y="424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#e05555">목킹 삼가야 할 대상</text>
  <text x="300" y="424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#e8e8e8">테스트 대상 함수 내부 로직 · 내부 구현 세부사항</text>
  <text x="80" y="448" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="13" font-weight="600" fill="#7ec8e3">경계 선택 기준</text>
  <text x="300" y="448" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#e8e8e8">같은 모듈 내부 → 목 불필요 / 시스템 경계(I/O) → 목 적용</text>
  <text x="80" y="468" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif"
        font-size="12" fill="#888">과도한 목킹 신호: 테스트 코드가 구현 코드보다 길어질 때</text>
  <text x="76" y="116" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">// 파일 최상단 — hoisting됨</tspan></text>
  <text x="76" y="136" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">vi.mock(<tspan fill="#ce9178">'../lib/email'</tspan>, () =&gt; ({</text>
  <text x="76" y="156" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  sendMail: vi.fn()</text>
  <text x="76" y="176" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}))</text>
  <text x="76" y="216" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#9aa4b8">// 테스트에서 반환값 설정</tspan></text>
  <text x="76" y="236" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">import</tspan> { sendMail } <tspan fill="#7ec8e3" font-weight="600">from</tspan> <tspan fill="#ce9178">'../lib/email'</tspan></text>
  <text x="76" y="256" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">vi.mocked(sendMail).mockResolvedValue(</text>
  <text x="76" y="276" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">true</tspan>)</text>
  <text x="466" y="116" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff"><tspan fill="#7ec8e3" font-weight="600">import</tspan> * <tspan fill="#7ec8e3" font-weight="600">as</tspan> logger <tspan fill="#7ec8e3" font-weight="600">from</tspan> <tspan fill="#ce9178">'./logger'</tspan></text>
  <text x="466" y="156" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">it(<tspan fill="#ce9178">'에러 로깅'</tspan>, () =&gt; {</text>
  <text x="466" y="176" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  <tspan fill="#7ec8e3" font-weight="600">const</tspan> spy = vi.spyOn(logger, <tspan fill="#ce9178">'error'</tspan>)</text>
  <text x="466" y="196" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  processOrder(<tspan fill="#7ec8e3" font-weight="600">null</tspan>)</text>
  <text x="466" y="216" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  expect(spy).toHaveBeenCalledOnce()</text>
  <text x="466" y="236" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  expect(spy).toHaveBeenCalledWith(</text>
  <text x="466" y="256" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    expect.stringContaining(</text>
  <text x="466" y="276" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">      <tspan fill="#ce9178">'invalid order'</tspan></text>
  <text x="466" y="296" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">    ))</text>
  <text x="466" y="316" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">})</text>
</svg>
