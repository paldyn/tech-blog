<svg width="880" height="540" viewBox="0 0 880 540" xmlns="http://www.w3.org/2000/svg" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <defs>
    <marker id="arrG" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#55c555"/>
    </marker>
    <marker id="arrP" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
    <marker id="arrB" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect width="880" height="540" rx="12" fill="#0a0a0a"/>

  <text x="440" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">Row Level Security — 행 단위로 걸러지는 데이터</text>

  <!-- 사용자 A / B -->
  <rect x="50" y="140" width="180" height="80" rx="10" fill="#151515" stroke="#55c555" stroke-width="1.5"/>
  <text x="140" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">사용자 A</text>
  <text x="140" y="196" text-anchor="middle" font-size="11" fill="#9aa4b8" font-family="'JetBrains Mono','Menlo','Consolas',monospace">JWT · sub = "A"</text>

  <rect x="50" y="330" width="180" height="80" rx="10" fill="#151515" stroke="#7777cc" stroke-width="1.5"/>
  <text x="140" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">사용자 B</text>
  <text x="140" y="386" text-anchor="middle" font-size="11" fill="#9aa4b8" font-family="'JetBrains Mono','Menlo','Consolas',monospace">JWT · sub = "B"</text>

  <!-- RLS 정책 게이트 (코드 박스) -->
  <rect x="310" y="200" width="220" height="150" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>
  <text x="420" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#e8e8e8">RLS 정책</text>
  <text x="326" y="258" xml:space="preserve" font-size="13" fill="#7ec8e3" font-weight="600" font-family="'JetBrains Mono','Menlo','Consolas',monospace">using (</text>
  <text x="326" y="278" xml:space="preserve" font-size="13" fill="#ffffff" font-family="'JetBrains Mono','Menlo','Consolas',monospace">  auth.uid() = user_id</text>
  <text x="326" y="298" xml:space="preserve" font-size="13" fill="#7ec8e3" font-weight="600" font-family="'JetBrains Mono','Menlo','Consolas',monospace">)</text>
  <text x="420" y="330" text-anchor="middle" font-size="11" fill="#888">모든 행이 이 검사를 통과해야 반환</text>

  <!-- todos 테이블 -->
  <rect x="590" y="110" width="230" height="340" rx="10" fill="#111111" stroke="#333333" stroke-width="1.5"/>
  <text x="705" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#e8e8e8">todos 테이블</text>

  <rect x="605" y="152" width="200" height="48" rx="6" fill="#0f1f16" stroke="#2a4a35" stroke-width="1"/>
  <text x="617" y="171" font-size="12" fill="#e8e8e8">id 1 · 우유 사기</text>
  <text x="617" y="190" font-size="10.5" fill="#55c555" font-family="'JetBrains Mono','Menlo','Consolas',monospace">user_id = A</text>
  <rect x="605" y="152" width="200" height="48" rx="6" fill="#55c555" opacity="0">
    <animate attributeName="opacity" values="0;0;0.3;0.3;0;0" keyTimes="0;0.32;0.38;0.46;0.52;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <rect x="605" y="210" width="200" height="48" rx="6" fill="#14141f" stroke="#33335a" stroke-width="1"/>
  <text x="617" y="229" font-size="12" fill="#e8e8e8">id 2 · 회의 준비</text>
  <text x="617" y="248" font-size="10.5" fill="#7777cc" font-family="'JetBrains Mono','Menlo','Consolas',monospace">user_id = B</text>
  <rect x="605" y="210" width="200" height="48" rx="6" fill="#7777cc" opacity="0">
    <animate attributeName="opacity" values="0;0;0.3;0.3;0;0" keyTimes="0;0.82;0.87;0.95;0.99;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <rect x="605" y="268" width="200" height="48" rx="6" fill="#0f1f16" stroke="#2a4a35" stroke-width="1"/>
  <text x="617" y="287" font-size="12" fill="#e8e8e8">id 3 · 운동</text>
  <text x="617" y="306" font-size="10.5" fill="#55c555" font-family="'JetBrains Mono','Menlo','Consolas',monospace">user_id = A</text>
  <rect x="605" y="268" width="200" height="48" rx="6" fill="#55c555" opacity="0">
    <animate attributeName="opacity" values="0;0;0.3;0.3;0;0" keyTimes="0;0.32;0.38;0.46;0.52;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <rect x="605" y="326" width="200" height="48" rx="6" fill="#14141f" stroke="#33335a" stroke-width="1"/>
  <text x="617" y="345" font-size="12" fill="#e8e8e8">id 4 · 책 반납</text>
  <text x="617" y="364" font-size="10.5" fill="#7777cc" font-family="'JetBrains Mono','Menlo','Consolas',monospace">user_id = B</text>
  <rect x="605" y="326" width="200" height="48" rx="6" fill="#7777cc" opacity="0">
    <animate attributeName="opacity" values="0;0;0.3;0.3;0;0" keyTimes="0;0.82;0.87;0.95;0.99;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="705" y="404" text-anchor="middle" font-size="11" fill="#55c555">사용자 A에게 보이는 행 → 1, 3</text>
  <text x="705" y="424" text-anchor="middle" font-size="11" fill="#7777cc">사용자 B에게 보이는 행 → 2, 4</text>

  <!-- 화살표 -->
  <line x1="230" y1="180" x2="309" y2="235" stroke="#55c555" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="230" y1="370" x2="309" y2="315" stroke="#7777cc" stroke-width="2" marker-end="url(#arrP)"/>
  <line x1="530" y1="275" x2="589" y2="275" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- 요청 흐름 애니메이션 (주기 5s: 전반 A, 후반 B) -->
  <circle r="4" fill="#55c555" opacity="0">
    <animateMotion path="M 234 183 L 305 232" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.18;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.16;0.18;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#55c555" opacity="0">
    <animateMotion path="M 534 275 L 585 275" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.20;0.32;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.21;0.30;0.32;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#7777cc" opacity="0">
    <animateMotion path="M 234 367 L 305 318" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.52;0.68;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.53;0.66;0.68;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#7777cc" opacity="0">
    <animateMotion path="M 534 275 L 585 275" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.70;0.82;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.69;0.71;0.80;0.82;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <text x="440" y="505" text-anchor="middle" font-size="12" fill="#888">같은 select 쿼리라도 — 누가 보내느냐에 따라 정책을 통과한 행만 반환된다</text>
</svg>
