<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <defs>
    <marker id="arrPurple" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7777cc"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="500" rx="12" fill="#0a0a0a"/>

  <text x="50" y="46" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">토큰이 어디서 소비되는가</text>
  <text x="50" y="72" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">일반 LLM은 답변에만, 추론 모델은 답변 이전의 사고 과정에도 토큰을 쓴다</text>

  <text x="230" y="106" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7777cc">일반 LLM</text>
  <text x="650" y="106" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#7ec8e3">추론 모델</text>

  <rect x="50" y="120" width="360" height="60" rx="8" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
  <text x="74" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">입력 프롬프트</text>
  <text x="74" y="164" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">질문 + 컨텍스트 (입력 토큰으로 과금)</text>

  <rect x="470" y="120" width="360" height="60" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="494" y="144" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">입력 프롬프트</text>
  <text x="494" y="164" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">질문 + 컨텍스트 (입력 토큰으로 과금)</text>

  <line x1="230" y1="180" x2="230" y2="210" stroke="#7777cc" stroke-width="2" marker-end="url(#arrPurple)"/>
  <line x1="650" y1="180" x2="650" y2="210" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrBlue)"/>

  <rect x="50" y="210" width="360" height="70" rx="8" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
  <text x="74" y="232" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">즉시 답변 생성</text>
  <text x="74" y="250" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">첫 토큰부터 곧바로 정답을 쓰기 시작한다</text>
  <text x="74" y="268" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">되돌아가 고칠 여지가 구조적으로 없다</text>

  <rect x="470" y="210" width="360" height="130" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="494" y="234" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8">사고 토큰 (thinking)</text>
  <text x="494" y="262" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">문제 분해 → 후보 풀이 → 자기 검증</text>
  <text x="494" y="284" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">막히면 되돌아가 다른 경로로 다시 시도</text>
  <text x="494" y="306" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#9aa4b8">사용자에게 보이지 않지만 출력으로 과금</text>
  <text x="494" y="328" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#e05555">길이는 문제 난도에 따라 크게 요동친다</text>

  <line x1="230" y1="280" x2="230" y2="380" stroke="#7777cc" stroke-width="2" marker-end="url(#arrPurple)"/>
  <line x1="650" y1="340" x2="650" y2="380" stroke="#7ec8e3" stroke-width="2" marker-end="url(#arrBlue)"/>

  <rect x="50" y="380" width="360" height="60" rx="8" fill="#12121a" stroke="#7777cc" stroke-width="1"/>
  <text x="74" y="404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">출력 = 답변 토큰뿐</text>
  <text x="74" y="424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">지연 짧음 · 비용 예측이 쉽다</text>

  <rect x="470" y="380" width="360" height="60" rx="8" fill="#12121a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="494" y="404" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" font-weight="600" fill="#55c555">출력 = 사고 토큰 + 답변 토큰</text>
  <text x="494" y="424" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="11" fill="#888">정확도 상승 · 지연과 비용은 몇 배로</text>

  <text x="50" y="472" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">과금 기준은 &quot;보이는 답변&quot;이 아니라 &quot;생성된 전체 출력&quot;이다. 사고 토큰을 못 보더라도 청구서에는 남는다.</text>
</svg>
