<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430"
     style="font-family:'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="430" rx="12" fill="#0a0a0a"/>
  <defs>
    <marker id="arrR" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 13 7 L 0 14 z" fill="#e05555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#e8e8e8">트랜잭션 흐름 — TCL 명령어 시퀀스</text>

  <!-- Timeline baseline -->
  <line x1="80" y1="200" x2="800" y2="200" stroke="#555" stroke-width="2"/>

  <!-- BEGIN -->
  <circle cx="110" cy="200" r="8" fill="#7ec8e3" stroke="#0a0a0a" stroke-width="2"/>
  <line x1="110" y1="192" x2="110" y2="150" stroke="#7ec8e3" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="70" y="126" width="80" height="22" rx="4" fill="#0a1520" stroke="#7ec8e3"/>
  <text x="110" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#7ec8e3">BEGIN</text>
  <text x="110" y="220" text-anchor="middle" font-size="11" fill="#888">트랜잭션 시작</text>

  <!-- INSERT (DML op) -->
  <circle cx="220" cy="200" r="6" fill="#55c555" stroke="#0a0a0a" stroke-width="1.5"/>
  <line x1="220" y1="194" x2="220" y2="162" stroke="#55c555" stroke-width="1.5"/>
  <rect x="170" y="146" width="100" height="14" rx="3" fill="#0a1a0a"/>
  <text x="220" y="156" text-anchor="middle" font-size="10" fill="#55c555">INSERT 실행</text>
  <text x="220" y="220" text-anchor="middle" font-size="11" fill="#888">DML 수행</text>

  <!-- SAVEPOINT -->
  <circle cx="340" cy="200" r="8" fill="#e8c555" stroke="#0a0a0a" stroke-width="2"/>
  <line x1="340" y1="192" x2="340" y2="150" stroke="#e8c555" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="293" y="126" width="94" height="22" rx="4" fill="#1a1400" stroke="#e8c555"/>
  <text x="340" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#e8c555">SAVEPOINT</text>
  <text x="340" y="220" text-anchor="middle" font-size="11" fill="#888">중간 저장점</text>

  <!-- UPDATE (DML op) -->
  <circle cx="450" cy="200" r="6" fill="#55c555" stroke="#0a0a0a" stroke-width="1.5"/>
  <line x1="450" y1="194" x2="450" y2="162" stroke="#55c555" stroke-width="1.5"/>
  <rect x="400" y="146" width="100" height="14" rx="3" fill="#0a1a0a"/>
  <text x="450" y="156" text-anchor="middle" font-size="10" fill="#55c555">UPDATE 실행</text>
  <text x="450" y="220" text-anchor="middle" font-size="11" fill="#888">DML 수행</text>

  <!-- ROLLBACK TO SAVEPOINT -->
  <circle cx="570" cy="200" r="8" fill="#e05555" stroke="#0a0a0a" stroke-width="2"/>
  <line x1="570" y1="208" x2="570" y2="260" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="498" y="262" width="144" height="22" rx="4" fill="#1a0a0a" stroke="#e05555"/>
  <text x="570" y="277" text-anchor="middle" font-size="11" font-weight="600" fill="#e05555">ROLLBACK TO sp1</text>
  <!-- Undo arc arrow from 570 back to 340 -->
  <path d="M 498,273 C 420,292 340,292 340,236" stroke="#e05555" stroke-width="2" fill="none" stroke-dasharray="4,4" marker-end="url(#arrR)"/>
  <text x="440" y="330" text-anchor="middle" font-size="11" fill="#e05555">↩ UPDATE 취소, SAVEPOINT로 복귀</text>

  <!-- DELETE (DML op after partial rollback) -->
  <circle cx="680" cy="200" r="6" fill="#55c555" stroke="#0a0a0a" stroke-width="1.5"/>
  <line x1="680" y1="194" x2="680" y2="162" stroke="#55c555" stroke-width="1.5"/>
  <rect x="630" y="146" width="100" height="14" rx="3" fill="#0a1a0a"/>
  <text x="680" y="156" text-anchor="middle" font-size="10" fill="#55c555">DELETE 실행</text>

  <!-- COMMIT -->
  <circle cx="780" cy="200" r="8" fill="#7ec8e3" stroke="#0a0a0a" stroke-width="2"/>
  <line x1="780" y1="192" x2="780" y2="150" stroke="#7ec8e3" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="736" y="126" width="88" height="22" rx="4" fill="#0a1520" stroke="#7ec8e3"/>
  <text x="780" y="141" text-anchor="middle" font-size="11" font-weight="600" fill="#7ec8e3">COMMIT</text>
  <text x="780" y="220" text-anchor="middle" font-size="11" fill="#888">영구 반영</text>

  <!-- Transaction span annotation -->
  <line x1="110" y1="360" x2="780" y2="360" stroke="#555" stroke-width="1.5"/>
  <line x1="110" y1="354" x2="110" y2="366" stroke="#555" stroke-width="1.5"/>
  <line x1="780" y1="354" x2="780" y2="366" stroke="#555" stroke-width="1.5"/>
  <text x="445" y="382" text-anchor="middle" font-size="12" fill="#888">트랜잭션 범위 (BEGIN ~ COMMIT)</text>
  <text x="445" y="400" text-anchor="middle" font-size="11" fill="#888">INSERT + DELETE만 최종 반영됨 (UPDATE는 취소됨)</text>

</svg>
