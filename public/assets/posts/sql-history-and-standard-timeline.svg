<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520"
     style="font-family:'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif">
  <rect width="880" height="520" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#e8e8e8">SQL 역사 타임라인</text>
  <text x="440" y="68" text-anchor="middle" font-size="14" fill="#888">1970년 Codd 논문부터 SQL:2023까지</text>

  <!-- Timeline axis -->
  <line x1="80" y1="280" x2="800" y2="280" stroke="#2a3040" stroke-width="2"/>

  <!-- Events -->
  <!-- 1970 -->
  <line x1="100" y1="280" x2="100" y2="216" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="100" cy="280" r="5" fill="#7777cc"/>
  <rect x="45" y="160" width="110" height="56" fill="#0f0f1a" rx="5" stroke="#7777cc" stroke-width="1.5"/>
  <text x="100" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#7777cc">1970</text>
  <text x="100" y="193" text-anchor="middle" font-size="10" fill="#888">Codd 논문</text>
  <text x="100" y="207" text-anchor="middle" font-size="10" fill="#888">관계형 모델</text>

  <!-- 1974 -->
  <line x1="190" y1="280" x2="190" y2="148" stroke="#7ec8e3" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="190" cy="280" r="5" fill="#7ec8e3"/>
  <rect x="135" y="92" width="110" height="56" fill="#0a1520" rx="5" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="190" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#7ec8e3">1974</text>
  <text x="190" y="125" text-anchor="middle" font-size="10" fill="#888">SEQUEL</text>
  <text x="190" y="139" text-anchor="middle" font-size="10" fill="#888">IBM System R</text>

  <!-- 1979 -->
  <line x1="290" y1="280" x2="290" y2="216" stroke="#e05555" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="290" cy="280" r="5" fill="#e05555"/>
  <rect x="235" y="160" width="110" height="56" fill="#1a0a0a" rx="5" stroke="#e05555" stroke-width="1.5"/>
  <text x="290" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#e05555">1979</text>
  <text x="290" y="193" text-anchor="middle" font-size="10" fill="#888">Oracle V2</text>
  <text x="290" y="207" text-anchor="middle" font-size="10" fill="#888">최초 상용 SQL</text>

  <!-- 1986 -->
  <line x1="400" y1="280" x2="400" y2="148" stroke="#55c555" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="400" cy="280" r="7" fill="#55c555"/>
  <rect x="345" y="92" width="110" height="56" fill="#0a1a0a" rx="5" stroke="#55c555" stroke-width="1.5"/>
  <text x="400" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#55c555">1986</text>
  <text x="400" y="125" text-anchor="middle" font-size="10" fill="#e8e8e8">SQL-86</text>
  <text x="400" y="139" text-anchor="middle" font-size="10" fill="#888">ANSI 최초 표준</text>

  <!-- 1992 -->
  <line x1="490" y1="280" x2="490" y2="216" stroke="#55c555" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="490" cy="280" r="7" fill="#55c555"/>
  <rect x="435" y="160" width="110" height="56" fill="#0a1a0a" rx="5" stroke="#55c555" stroke-width="1.5"/>
  <text x="490" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#55c555">1992</text>
  <text x="490" y="193" text-anchor="middle" font-size="10" fill="#e8e8e8">SQL-92 (SQL2)</text>
  <text x="490" y="207" text-anchor="middle" font-size="10" fill="#888">JOIN 표준화</text>

  <!-- 1999 -->
  <line x1="580" y1="280" x2="580" y2="148" stroke="#7ec8e3" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="580" cy="280" r="5" fill="#7ec8e3"/>
  <rect x="525" y="92" width="110" height="56" fill="#0a1520" rx="5" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="580" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#7ec8e3">1999</text>
  <text x="580" y="125" text-anchor="middle" font-size="10" fill="#e8e8e8">SQL:1999 (SQL3)</text>
  <text x="580" y="139" text-anchor="middle" font-size="10" fill="#888">CTE · 윈도우 함수</text>

  <!-- 2003~ -->
  <line x1="670" y1="280" x2="670" y2="216" stroke="#7777cc" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="670" cy="280" r="5" fill="#7777cc"/>
  <rect x="615" y="160" width="110" height="56" fill="#0f0f1a" rx="5" stroke="#7777cc" stroke-width="1.5"/>
  <text x="670" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#7777cc">2003~</text>
  <text x="670" y="193" text-anchor="middle" font-size="10" fill="#e8e8e8">SQL:2003</text>
  <text x="670" y="207" text-anchor="middle" font-size="10" fill="#888">XML · 시퀀스</text>

  <!-- 2023 -->
  <line x1="760" y1="280" x2="760" y2="148" stroke="#e8c060" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="760" cy="280" r="6" fill="#e8c060"/>
  <rect x="702" y="92" width="116" height="56" fill="#120e00" rx="5" stroke="#e8c060" stroke-width="1.5"/>
  <text x="760" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#e8c060">2023</text>
  <text x="760" y="125" text-anchor="middle" font-size="10" fill="#e8e8e8">SQL:2023</text>
  <text x="760" y="139" text-anchor="middle" font-size="10" fill="#888">JSON · 그래프 쿼리</text>

  <!-- Below axis: DBMS labels -->
  <text x="100" y="304" text-anchor="middle" font-size="10" fill="#888">IBM</text>
  <text x="290" y="304" text-anchor="middle" font-size="10" fill="#888">Oracle</text>
  <text x="380" y="322" text-anchor="middle" font-size="10" fill="#888">Sybase/</text>
  <text x="380" y="334" text-anchor="middle" font-size="10" fill="#888">SQL Server</text>
  <text x="490" y="304" text-anchor="middle" font-size="10" fill="#888">MySQL 1995</text>
  <text x="600" y="322" text-anchor="middle" font-size="10" fill="#888">PostgreSQL</text>
  <text x="600" y="334" text-anchor="middle" font-size="10" fill="#888">1996</text>

  <!-- Standards table -->
  <rect x="60" y="360" width="760" height="128" fill="#0f1520" rx="8" stroke="#3a4a6e" stroke-width="1"/>
  <text x="80" y="386" font-size="13" font-weight="600" fill="#7ec8e3">주요 SQL 표준 비교</text>

  <!-- Table rows -->
  <text x="100" y="410" font-size="12" fill="#888">표준</text>
  <text x="220" y="410" font-size="12" fill="#888">주요 추가 기능</text>
  <text x="580" y="410" font-size="12" fill="#888">DBMS 지원</text>

  <line x1="80" y1="415" x2="800" y2="415" stroke="#3a4a6e" stroke-width="1"/>

  <text x="100" y="432" font-size="12" fill="#55c555">SQL-92</text>
  <text x="220" y="432" font-size="12" fill="#e8e8e8">OUTER JOIN, CASE, CAST, 서브쿼리</text>
  <text x="580" y="432" font-size="12" fill="#888">현재 모든 RDBMS</text>

  <text x="100" y="452" font-size="12" fill="#7ec8e3">SQL:1999</text>
  <text x="220" y="452" font-size="12" fill="#e8e8e8">CTE(WITH), 재귀, 윈도우 함수, TRIGGER</text>
  <text x="580" y="452" font-size="12" fill="#888">Oracle 9i+, PG 8.4+</text>

  <text x="100" y="472" font-size="12" fill="#e8c060">SQL:2023</text>
  <text x="220" y="472" font-size="12" fill="#e8e8e8">JSON_TABLE, 그래프 패턴 매칭(GQL)</text>
  <text x="580" y="472" font-size="12" fill="#888">일부 지원 중</text>

</svg>
