<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">어노테이션 베스트 프랙티스</text>
  <text x="440" y="72" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="14" font-weight="600" fill="#888">파라미터, 반환 타입, 제네릭, 단순 변수 — 상황별 권장 패턴</text>

  <!-- Code box -->
  <text x="60" y="101" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">타입 어노테이션 베스트 프랙티스</text>
  <rect x="60" y="112" width="760" height="260" rx="6" fill="#000000" stroke="#3a4a6e" stroke-width="1"/>

  <!-- 1. 함수 파라미터 -->
  <text x="76" y="134" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 1. 함수 파라미터 — 항상 명시</text>
  <text x="76" y="153" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">function</tspan><tspan fill="#ffffff"> process(</tspan></text>
  <text x="76" y="172" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">  data: </tspan><tspan fill="#7ec8e3" font-weight="600">string</tspan><tspan fill="#ffffff">[],</tspan></text>
  <text x="76" y="191" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  options: ProcessOptions</text>
  <text x="76" y="210" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">): </tspan><tspan fill="#7ec8e3" font-weight="600">void</tspan><tspan fill="#ffffff"> { ... }</tspan></text>

  <!-- 2. 공개 API 반환 타입 -->
  <text x="76" y="234" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 2. 공개 API 반환 타입 — 명시 권장</text>
  <text x="76" y="253" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">export</tspan><tspan fill="#7ec8e3" font-weight="600"> function</tspan><tspan fill="#ffffff"> createUser(name: </tspan><tspan fill="#7ec8e3" font-weight="600">string</tspan><tspan fill="#ffffff">): User {</tspan></text>
  <text x="76" y="272" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">  return</tspan><tspan fill="#ffffff"> { id: </tspan><tspan fill="#b5cea8">1</tspan><tspan fill="#ffffff">, name };</tspan></text>
  <text x="76" y="291" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>

  <!-- 3. 복잡한 제네릭 -->
  <text x="76" y="315" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 3. 복잡한 제네릭 — 명시로 가독성 향상</text>
  <text x="76" y="334" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> map = </tspan><tspan fill="#7ec8e3" font-weight="600">new</tspan><tspan fill="#ffffff"> Map&lt;</tspan><tspan fill="#7ec8e3" font-weight="600">string</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#7ec8e3" font-weight="600">number</tspan><tspan fill="#ffffff">&gt;();</tspan></text>

  <!-- 4. 단순 변수 -->
  <text x="450" y="315" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 4. 단순 변수 — 추론 신뢰</text>
  <text x="450" y="334" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> count = </tspan><tspan fill="#b5cea8">0</tspan><tspan fill="#ffffff">;  </tspan><tspan fill="#9aa4b8">// number</tspan></text>
  <text x="450" y="353" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">const</tspan><tspan fill="#ffffff"> label = </tspan><tspan fill="#ce9178">"hello"</tspan><tspan fill="#ffffff">; </tspan><tspan fill="#9aa4b8">// string</tspan></text>

  <!-- Bottom note -->
  <text x="440" y="391" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="12" fill="#7ec8e3">파라미터·공개 API는 명시 / 단순 초기값은 추론 — 이 두 원칙만 기억하면 충분</text>

</svg>
