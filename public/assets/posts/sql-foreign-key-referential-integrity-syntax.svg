<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <rect width="880" height="440" fill="#0a0a0a" rx="12"/>
  <text x="440" y="44" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">FOREIGN KEY 선언 문법과 DEFERRABLE</text>
  <text x="440" y="70" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">인라인 vs 테이블 수준 선언, 지연 검사 옵션</text>

  <!-- Code block -->
  <rect x="60" y="96" width="760" height="312" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="80" y="124" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- 테이블 수준 FOREIGN KEY 선언 (권장)</tspan></text>
  <text x="80" y="143" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7ec8e3" font-weight="600">CREATE TABLE</tspan><tspan fill="#ffffff"> orders (</tspan></text>
  <text x="80" y="162" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    order_id    </tspan><tspan fill="#7ec8e3" font-weight="600">BIGINT PRIMARY KEY</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="80" y="181" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    customer_id </tspan><tspan fill="#7ec8e3" font-weight="600">BIGINT NOT NULL</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="80" y="200" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">    total       </tspan><tspan fill="#7ec8e3" font-weight="600">NUMERIC</tspan><tspan fill="#ffffff">(12,2) </tspan><tspan fill="#7ec8e3" font-weight="600">NOT NULL</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="80" y="219" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#e05555">    CONSTRAINT fk_orders_customer</tspan></text>
  <text x="80" y="238" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#e05555">        FOREIGN KEY (customer_id)</tspan></text>
  <text x="80" y="257" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#e05555">        REFERENCES customers (customer_id)</tspan></text>
  <text x="80" y="276" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#55c555">        ON DELETE RESTRICT</tspan></text>
  <text x="80" y="295" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#55c555">        ON UPDATE CASCADE</tspan></text>
  <text x="80" y="314" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#ffffff">);</tspan></text>
  <text x="80" y="333" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#9aa4b8">-- 지연 검사 (PostgreSQL: 트랜잭션 커밋 시점에 검사)</tspan></text>
  <text x="80" y="352" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#e05555">    CONSTRAINT fk_deferred FOREIGN KEY (parent_id)</tspan></text>
  <text x="80" y="371" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#e05555">    REFERENCES parent (id)</tspan></text>
  <text x="80" y="390" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" xml:space="preserve"><tspan fill="#7777cc" font-weight="600">    DEFERRABLE INITIALLY DEFERRED</tspan></text>
</svg>
