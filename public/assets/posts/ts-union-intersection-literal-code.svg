<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <rect width="880" height="400" rx="12" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#e8e8e8">리터럴 타입과 판별 유니언</text>
  <text x="440" y="74" text-anchor="middle" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="16" font-weight="600" fill="#888">kind 필드로 각 케이스를 안전하게 구분한다</text>

  <!-- Left: literal types -->
  <text x="60" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">리터럴 타입</text>
  <rect x="60" y="116" width="360" height="258" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="76" y="142" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// 특정 값만 허용하는 타입</text>
  <text x="76" y="160" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">type</tspan><tspan fill="#ffffff"> Method = </tspan><tspan fill="#ce9178">"GET"</tspan><tspan fill="#ffffff"> | </tspan><tspan fill="#ce9178">"POST"</tspan><tspan fill="#ffffff"> | </tspan><tspan fill="#ce9178">"DELETE"</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="76" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">type</tspan><tspan fill="#ffffff"> Port = </tspan><tspan fill="#b5cea8">80</tspan><tspan fill="#ffffff"> | </tspan><tspan fill="#b5cea8">443</tspan><tspan fill="#ffffff"> | </tspan><tspan fill="#b5cea8">8080</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="76" y="214" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> request(url: </tspan><tspan fill="#7ec8e3">string</tspan><tspan fill="#ffffff">,</tspan></text>
  <text x="76" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  method: Method) {}</text>
  <text x="76" y="268" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">request(</tspan><tspan fill="#ce9178">"/api"</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ce9178">"GET"</tspan><tspan fill="#ffffff">);   </tspan><tspan fill="#55c555">// ✅</tspan></text>
  <text x="76" y="286" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">request(</tspan><tspan fill="#ce9178">"/api"</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#ce9178">"PATCH"</tspan><tspan fill="#ffffff">); </tspan><tspan fill="#e05555">// TS2345 ❌</tspan></text>
  <text x="76" y="340" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// Template literal 타입</text>
  <text x="76" y="358" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">type</tspan><tspan fill="#ffffff"> EventName = </tspan><tspan fill="#ce9178">`on${</tspan><tspan fill="#7ec8e3">string</tspan><tspan fill="#ce9178">}`</tspan><tspan fill="#ffffff">;</tspan></text>

  <!-- Right: discriminated union -->
  <text x="460" y="106" font-family="'Wanted Sans Variable','Wanted Sans',-apple-system,sans-serif" font-size="13" fill="#888">판별 유니언 (Discriminated Union)</text>
  <rect x="460" y="116" width="360" height="258" rx="6" fill="#000000" stroke="#3a4a6e"/>
  <text x="476" y="142" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">type</tspan><tspan fill="#ffffff"> Shape =</tspan></text>
  <text x="476" y="160" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  | { kind: </tspan><tspan fill="#ce9178">"circle"</tspan><tspan fill="#ffffff">; radius: </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff"> }</tspan></text>
  <text x="476" y="178" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#ffffff">  | { kind: </tspan><tspan fill="#ce9178">"rect"</tspan><tspan fill="#ffffff">; w: </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff">; h: </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff"> };</tspan></text>
  <text x="476" y="214" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">function</tspan><tspan fill="#ffffff"> area(s: Shape): </tspan><tspan fill="#7ec8e3">number</tspan><tspan fill="#ffffff"> {</tspan></text>
  <text x="476" y="232" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">  switch</tspan><tspan fill="#ffffff"> (s.kind) {</tspan></text>
  <text x="476" y="250" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">    case</tspan><tspan fill="#ce9178"> "circle"</tspan><tspan fill="#ffffff">:</tspan></text>
  <text x="476" y="268" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">      return</tspan><tspan fill="#ffffff"> Math.PI * s.radius ** </tspan><tspan fill="#b5cea8">2</tspan><tspan fill="#ffffff">;</tspan></text>
  <text x="476" y="286" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">    case</tspan><tspan fill="#ce9178"> "rect"</tspan><tspan fill="#ffffff">:</tspan></text>
  <text x="476" y="304" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13"><tspan fill="#7ec8e3">      return</tspan><tspan fill="#ffffff"> s.w * s.h;</tspan></text>
  <text x="476" y="322" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">  }</text>
  <text x="476" y="340" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#ffffff">}</text>
  <text x="476" y="358" xml:space="preserve" font-family="'JetBrains Mono','Menlo','Consolas',monospace" font-size="13" fill="#9aa4b8">// kind로 타입 자동 좁히기</text>
</svg>
